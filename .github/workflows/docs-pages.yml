name: Deploy stdlib API docs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/docs-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build ipe
        run: cargo build -p ipe --release

      - name: Generate stdlib API documentation
        run: |
          mkdir -p _scratch
          cd _scratch
          ../target/release/ipe doc --write-format html
          cd ..

      - name: Stage site artifact
        run: |
          mkdir -p _site/api
          cp -r _scratch/doc/html/. _site/api/
          # Minimal root redirect so the Pages root does not 404.
          printf '<!DOCTYPE html>\n<html>\n<head>\n<meta http-equiv="refresh" content="0;url=api/">\n</head>\n<body>\n<a href="api/">API documentation</a>\n</body>\n</html>\n' > _site/index.html

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - id: deployment
        name: Deploy to GitHub Pages
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
