name: release-please

# Automated versioning + changelog + release cutting, driven by Conventional
# Commits. On every push to `main`, release-please opens (or refreshes) a single
# standing "release PR" targeting `main` that bumps the workspace version in
# Cargo.toml and prepends the new CHANGELOG.md section. That PR is inert until
# merged; merging it tags `vX.Y.Z` and creates the GitHub release. The binary
# build+upload lives in release.yml, triggered by the tag release-please pushes.
#
# The release PR targets `main` — where the release commit and tag live. main is
# advanced directly by merged PRs, so the merged release PR fast-forwards onto
# main like any other; no cross-branch backport is involved.
#
# Pre-1.0 bump policy (release-please-config.json): feat/fix/perf -> patch,
# `!`/`BREAKING CHANGE` -> minor. It never auto-bumps to 1.0 — that is a
# deliberate stability promise made by hand.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      # The release PR as a JSON PullRequest object (empty when none is open).
      # sync-cargo-lock gates on it AND reads its `headBranchName` — the action
      # exposes no scalar branch output, so the branch must come from this JSON.
      pr: ${{ steps.rp.outputs.pr }}
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          # A PAT, not GITHUB_TOKEN: GitHub does not trigger workflows for events
          # created by GITHUB_TOKEN, so a GITHUB_TOKEN-opened release PR never runs
          # the required checks and can only be admin-merged. A PAT-opened PR runs
          # the gate and merges normally; the tag it pushes also triggers
          # release.yml. Falls back to GITHUB_TOKEN until RELEASE_PLEASE_TOKEN is set.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: .config/release-please-config.json
          manifest-file: .github/.release-please-manifest.json
          # The release PR targets main — where the release commit + tag live.
          target-branch: main

  # Keep Cargo.lock in sync with whichever version Cargo.toml was bumped to.
  #
  # release-please updates Cargo.toml via the generic extra-files marker but
  # never touches Cargo.lock, so the release PR carries a lock still pinned to
  # the previous version — `cargo build --locked` then fails post-release and
  # the manifest-lock-consistency gate (correctly) reds the PR. This job runs on
  # the same push, checks out the *release branch* (NOT the default branch),
  # relocks the workspace members, and commits the synced lock onto the PR so
  # the gate greens. It re-runs on every release-please refresh, so the branch
  # ends each cycle consistent even though release-please force-push discards
  # the prior lock commit.
  #
  # The branch name comes from the `pr` JSON's `headBranchName`: the action
  # exposes no scalar branch output. (Reading a non-existent `pr_branch` output
  # is what silently checked out the default branch and made this a no-op.)
  sync-cargo-lock:
    needs: release-please
    # Only when a release PR is open. On the merged-PR run release_created=true
    # and pr is empty, so this is skipped — the merged tree is already synced.
    if: ${{ needs.release-please.outputs.pr != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
          # A PAT (falls back to GITHUB_TOKEN): a GITHUB_TOKEN push does not
          # re-trigger required checks, so the synced head would never re-run
          # the gate. The PAT push re-runs it and greens the PR.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: ./.github/actions/rust-toolchain-pinned

      - name: Sync Cargo.lock to bumped workspace version
        run: cargo update --workspace

      - name: Commit updated Cargo.lock if changed
        run: |
          if git diff --quiet Cargo.lock; then
            echo "Cargo.lock already up to date — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "chore: sync Cargo.lock to bumped workspace version"
          git push
