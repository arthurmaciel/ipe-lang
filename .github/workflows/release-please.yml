name: release-please

# Automated versioning + changelog + release cutting, driven by Conventional
# Commits. On every push to `main`, release-please opens (or refreshes) a single
# standing "release PR" targeting `main` that bumps the workspace version in
# Cargo.toml and prepends the new CHANGELOG.md section. That PR is inert until
# merged; merging it tags `vX.Y.Z` and creates the GitHub release. The binary
# build+upload lives in release.yml, triggered by the tag release-please pushes.
#
# The release PR targets `main` because that is where the release commit and tag
# must live. main is otherwise advanced only by the FF promotion of an
# already-green development HEAD, so a version bump landing on main would leave
# main AHEAD of development and break the next fast-forward. The
# `backport-bump-to-development` job below closes that gap: once a release merges
# to main it pushes the same bump onto development, keeping development an
# ancestor-or-equal of main so the FF promotion stays valid.
#
# Pre-1.0 bump policy (release-please-config.json): feat/fix/perf -> patch,
# `!`/`BREAKING CHANGE` -> minor. It never auto-bumps to 1.0 — that is a
# deliberate stability promise made by hand.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      # Forwarded so the lock-sync job can gate on a live release PR.
      pr: ${{ steps.rp.outputs.pr }}
      pr_branch: ${{ steps.rp.outputs.pr_branch }}
      # Set to "true" on the run where a release PR just MERGED to main (the tag
      # was cut). The backport job below gates on it.
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          # A PAT, not GITHUB_TOKEN: GitHub does not trigger workflows for events
          # created by GITHUB_TOKEN, so a GITHUB_TOKEN-opened release PR never runs
          # the required checks and can only be admin-merged. A PAT-opened PR runs
          # the gate and merges normally; the tag it pushes also triggers
          # release.yml. Falls back to GITHUB_TOKEN until RELEASE_PLEASE_TOKEN is set.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .github/.release-please-manifest.json
          # The release PR targets main — where the release commit + tag live.
          # The backport job below re-lands the bump on development afterward so
          # the FF promotion (development -> main) stays valid.
          target-branch: main

  # Keep Cargo.lock in sync with whichever version Cargo.toml was bumped to.
  #
  # release-please updates Cargo.toml via the generic extra-files marker but
  # never touches Cargo.lock, so `cargo build --locked` fails after a release
  # and the next build dirties the lock. This job runs only when a release PR
  # is open (not on the tag-push run where release_created=true), checks out
  # the release branch, regenerates the lock for workspace members only, and
  # force-pushes the result back — keeping the PR self-consistent.
  sync-cargo-lock:
    needs: release-please
    # Run only when a release PR is open or was just refreshed.  When
    # release-please fires on the merged PR it sets release_created=true and
    # pr is empty; skip that run — the lock is already correct at that point
    # because this job already synced it before the merge.
    if: ${{ needs.release-please.outputs.pr != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.pr_branch }}
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Sync Cargo.lock to bumped workspace version
        run: cargo update --workspace

      - name: Commit updated Cargo.lock if changed
        run: |
          if git diff --quiet Cargo.lock; then
            echo "Cargo.lock already up to date — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "chore: sync Cargo.lock to bumped workspace version"
          git push

  # After a release merges to main (the tag was cut), re-land the version bump on
  # development so development stays an ancestor-or-equal of main and the FF
  # promotion (development -> main) keeps fast-forwarding cleanly. Merges main
  # into development with a merge commit — the bumped Cargo.toml/Cargo.lock/
  # CHANGELOG.md flow across without a hand edit; if development already contains
  # them (nothing to merge) the push is a no-op.
  backport-bump-to-development:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so `git merge origin/main` can fast-forward or merge.
          fetch-depth: 0
          ref: development
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Merge the release bump from main into development
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if git merge-base --is-ancestor origin/main HEAD; then
            echo "development already contains main's release bump — nothing to backport."
            exit 0
          fi
          git merge --no-edit origin/main
          git push origin HEAD:development
