# ─────────────────────────────────────────────────────────────────────────────
# Sky upstream-drift detection — nightly / manual, network, main only.
#
# Runs tools/scripts/check-sky-drift.sh, which:
#   1. Fetches the current anzellai/sky corpus (one tarball download).
#   2. Recomputes each example's content hash.
#   3. Compares to examples/sky/upstream.lock:
#        unchanged → skip.
#        changed   → fail, naming the example(s) — a human re-syncs.
#        added     → auto-convert, build, open a bot PR for human review.
#        removed   → warn (human decides to keep pinned or drop).
#
# Needs write access to push a branch + open a PR for auto-converted additions.
# ─────────────────────────────────────────────────────────────────────────────
name: sky upstream drift

on:
  schedule:
    - cron: '17 3 * * *'    # nightly at 03:17 UTC (offset from examples-sweep at 04:37)
  workflow_dispatch: {}

concurrency:
  group: sky-drift-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  sky-drift:
    name: sky upstream drift check
    runs-on: ubuntu-latest
    # Non-fatal while lock + converter stabilise.  Flip to false once lock is
    # anchored and the drift job reliably passes on a stable upstream.
    continue-on-error: true

    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.cache/ipe-target
      IPE_NO_SCCACHE: '1'
      IPE_SWEEP_BUILD_TIMEOUT: '300'
      IPE_AUTH_TOKEN_SECRET: ipe-ci-sweep-test-secret-0123456789-abcdef
      CARGO_HTTP_MULTIPLEXING: 'false'
      CARGO_NET_RETRY: '5'

    steps:
      - uses: actions/checkout@v7

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/share/swift || true
          sudo apt-get clean || true

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ${{ github.workspace }}/.cache/ipe-target
          key: ${{ runner.os }}-sky-drift-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-sky-drift-cargo-
            ${{ runner.os }}-sweep-cargo-

      - name: Install ripgrep
        run: sudo apt-get install -y ripgrep

      - name: Build ipe
        run: cargo build --release -p ipe

      - name: Pre-warm runtime deps
        run: cargo build -p ipe-runtime-rust || cargo build --workspace || true

      - name: Detect upstream drift (fetch + hash compare + auto-convert additions)
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/scripts/check-sky-drift.sh
