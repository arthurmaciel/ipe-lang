name: CI

# Public repo → GitHub-hosted runners (4-core/16GB, ephemeral) with matrix
# parallelism. Cheap gates fail fast; E2E is sharded; sccache (GHA backend) keeps
# builds warm across runs. See docs/architecture/ci-and-hosting.md.

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: '0 4 * * *'        # nightly full sweep (catches dep/upstream drift)
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true     # newer push supersedes in-progress (never cancels tags)

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: mozilla-actions/sccache-action@v0.0.6
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --workspace -- -D warnings

  # Guards the ipe-runtime-rust feature graph against silent coupling. The
  # workspace jobs above build the runtime with its DEFAULT features (`[]`), so
  # narrow subsets are otherwise unexercised. In particular a DB-only server /
  # CLI app must compile WITHOUT `live` (Sky.Live) — if a future change adds an
  # ungated reference to a `live`-only item (e.g. `super::LiveReq`) from
  # `db`-gated code, or pulls `live` into the `db` feature list, this job fails.
  # Keep `db` and `live` independently buildable; gate cross-feature items with
  # `#[cfg(feature = "live")]`.
  runtime-feature-combos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: mozilla-actions/sccache-action@v0.0.6
      - uses: Swatinem/rust-cache@v2
      # db WITHOUT live — the load-bearing invariant.
      - run: cargo clippy -p ipe-runtime-rust --no-default-features --features db --all-targets -- -D warnings
      # db WITH live — the pair must also stay co-buildable.
      - run: cargo clippy -p ipe-runtime-rust --no-default-features --features db,live --all-targets -- -D warnings

  # WASM floor: the pure kernel set (incl. the whole Ipe.Ui render surface) and
  # the json leg must keep compiling to wasm32-unknown-unknown — the substrate
  # of the browser target (docs/architecture/wasm-target.md).
  wasm-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: mozilla-actions/sccache-action@v0.0.6
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p ipe-runtime-rust --target wasm32-unknown-unknown
      - run: cargo build -p ipe-runtime-rust --target wasm32-unknown-unknown --features json

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.6
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run --workspace          # E2E tests no-op without IPE_E2E
      - run: cargo test --doc --workspace           # nextest doesn't run doctests

  # `ipe-runtime-rust`'s `default = []` leaves `compression`/`csv`/`config`/
  # `tokio` (and every other optional feature) OFF, so the `test` job above
  # never compiles the `#[cfg(feature = "...")]`-gated unit tests that live
  # behind those flags — including #129's 7 `*_spawn_blocking_tests` modules
  # in `file`/`compression`/`config_decode`/`csv`/`system.rs`, which prove a
  # blocking kernel actually offloads onto tokio's blocking pool (a future
  # refactor that silently dropped `spawn_blocking` would pass the default
  # gate untouched), AND the ENTIRE `sky_runtime::live::*` test surface —
  # the `style_inject` CSS-injection sink-forgery gates, SSE/session/dispatch
  # (gate blind spot, 2026-07-11: `full` ⊇ `live`; a default-only gate shows
  # green while these are red). `full` turns on every optional feature so
  # this job is the one place those regression tests run in CI. The local
  # gate recipes (scripts/progressive-development/context.md +
  # autopilot.sh) carry the mirroring
  # `cargo nextest run -p ipe-runtime-rust --features full` lane — keep them
  # in sync with this job.
  runtime-full-features:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.6
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run -p ipe-runtime-rust --features full

  # Scoped deliberately, not exhaustively. All 6 targets are
  # `#![forbid(unsafe_code)]`, so Miri's value here is catching UB triggered
  # indirectly through a DEPENDENCY's own `unsafe` (interning/IR/union-find
  # data structures are exactly the kind of code that leans on library
  # invariants) plus Stacked/Tree-Borrows aliasing violations, not scanning
  # for a nonexistent `unsafe` block of ours. `ipe_db` (the salsa
  # incremental-compilation database — the other candidate with genuinely
  # complex invariants, per docs/architecture/ci-and-hosting.md §3.5) was
  # evaluated and rejected: `cargo +nightly miri test -p ipe_db` timed out
  # after 280s on the FIRST of 3 tests (salsa's internal thread-pool/
  # generation-counter machinery is impractical under Miri's interpretation
  # overhead). `ipe`/`ipe_canon`/`ipe_parse`/`ipe_backend`/`runtime` are
  # out of scope for a different reason: they spawn real subprocesses / do
  # real I/O (E2E tests, `ipe_backend::cache`'s on-disk cache, the runtime's
  # HTTP/DB/websocket kernels), which Miri can't interpret at all.
  miri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
      - run: cargo +nightly miri test -p ipe_intern -p ipe_ir -p ipe_types -p ipe_lower -p ipe_diagnostics -p ipe_backend_rust
        env:
          MIRIFLAGS: -Zmiri-disable-isolation

  # E2E builds+runs the emitted Rust per golden (THE SEAL — the soundness floor:
  # every `ipe`-exit-0 golden's emitted Cargo project must `cargo build` + run).
  # Sharded across runners via nextest partitioning. Behavioural parity vs the Go
  # oracle rides the CACHED oracle (committed expected_go.txt — see
  # docs/architecture/e2e-and-oracle-caching.md), so NO Go toolchain is needed here.
  #
  # The Ipê runtime lives IN-REPO at src/runtime/rust/src (the `ipe-runtime-rust`
  # crate); `ipe::resolve_runtime()` finds it by walking up from the repo root, so
  # no separate vendoring step is required. IPE_RUNTIME_DIR is set explicitly as a
  # belt-and-braces (CWD-independent under nextest).
  #
  # NON-GATING FOR NOW (`continue-on-error: true`). The prior form gated on a
  # `vendor/upstream-sky/...` path that never landed, so E2E ALWAYS self-skipped —
  # THE SEAL was never enforced in CI. Pointing it at the in-repo runtime turns it
  # back on, which surfaces a real pre-existing backlog the skip had masked: ~101
  # of 450 goldens are oracle-stale (their `Main.ipe` sha no longer matches the
  # cached `oracle.meta` after the `.sky`→`.ipe` + namespace-flatten renames — a
  # `refresh-oracle` regeneration is owed) and the `adts` enum-stringify emit has
  # its own red. Those are tracked blockers, not a reason to keep E2E blind, so the
  # job runs and reports without failing CI. FLIP `continue-on-error` to false once
  # the oracle backlog is regenerated and the adts red is fixed — then a SEAL
  # regression (an `ipe`-exit-0 golden whose emit fails `cargo build`, exactly the
  # `dom`/`html` base-template class fixed here) fails CI as it should.
  e2e:
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.6
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      # Reclaim runner disk before the E2E build: each emitted golden crate pulls
      # the full runtime dep tree (axum/tokio/sqlx/serde) into the shared target.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/share/swift || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL /opt/microsoft /opt/google/chrome /opt/az || true
          sudo swapoff -a || true; sudo rm -f /swapfile /mnt/swapfile || true
          sudo apt-get clean || true
          df -h /
      - name: E2E shard ${{ matrix.shard }}/4 (THE SEAL — build+run emitted Rust)
        env:
          IPE_E2E: "1"
          IPE_RUNTIME_DIR: ${{ github.workspace }}/src/runtime/rust/src
        run: cargo nextest run --workspace --partition count:${{ matrix.shard }}/4
