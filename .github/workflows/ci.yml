name: CI

# GitHub-hosted runners (4-core/16GB, ephemeral) with matrix parallelism.
#
# Split by trigger so `main` is green by construction:
#   • PULL REQUEST — the FAST required gate (target: minutes). fmt, clippy,
#     test (nextest unit/integration), cargo-deny (in security.yml), and
#     seal-smoke (build+run ONE emitted example, a fast proxy for THE SEAL).
#     A PR merges only when these pass; branch protection lists them as the
#     required checks.
#   • PUSH to main + nightly SCHEDULE — the SLOW non-blocking checks: the full
#     6-shard e2e (THE SEAL in full), miri, and the runtime
#     feature-combo / full-feature builds. These never gate a PR; they catch
#     regressions post-merge and on the nightly dep/upstream-drift sweep.
#   • wasm-floor runs on PRs only when wasm-relevant paths change (paths: filter
#     below), plus nightly — it is OFF the always-required PR path.
#
# Job-level `if:` keys on github.event_name: the slow jobs self-skip on
# pull_request. E2E is sharded across 6 runners; sccache (GHA backend) keeps
# builds warm across runs.

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: '0 4 * * *'        # nightly full sweep (catches dep/upstream drift)
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true     # newer push supersedes in-progress (never cancels tags)

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  # Path filter for wasm-floor: on a PR it runs only when wasm-relevant files
  # change; on push/schedule it always runs (see wasm-floor's `if:`). Keeps the
  # wasm build OFF the always-required PR path for non-wasm changes.
  changes:
    runs-on: ubuntu-latest
    outputs:
      wasm: ${{ steps.filter.outputs.wasm }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            wasm:
              - 'src/runtime/**'
              - 'src/compiler/backend/**'
              - 'src/wasm/**'
              - 'runtime/**'
              - 'crates/ipe_backend_rust/**'
              - '**/*wasm*'
              - '.github/workflows/ci.yml'

  # Fail-closed guard against clone bloat: a commit that tracks a build artifact
  # (a target/ directory, an .rlib/.rmeta/.o/.a/.so/.dylib/.wasm blob) or any file
  # over 5 MiB turns this red. Regenerable build output committed once bloats every
  # future clone and can only be purged from history by a human-run rewrite;
  # this keeps the tree clean going forward. No toolchain needed — pure git +
  # shell, so it stays on the
  # fast required PR path.
  artifact-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: ./scripts/ci/artifact-guard.sh

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: mozilla-actions/sccache-action@v0.0.9
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --workspace -- -D warnings

  # Guards the ipe-runtime-rust feature graph against silent coupling. The
  # workspace jobs above build the runtime with its DEFAULT features (`[]`), so
  # narrow subsets are otherwise unexercised. In particular a DB-only server /
  # CLI app must compile WITHOUT `live` (Ipe.Live) — if a future change adds an
  # ungated reference to a `live`-only item (e.g. `super::LiveReq`) from
  # `db`-gated code, or pulls `live` into the `db` feature list, this job fails.
  # Keep `db` and `live` independently buildable; gate cross-feature items with
  # `#[cfg(feature = "live")]`.
  runtime-feature-combos:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'   # slow: push/nightly only, off the required PR gate
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: mozilla-actions/sccache-action@v0.0.9
      - uses: Swatinem/rust-cache@v2
      # db WITHOUT web — the load-bearing invariant.
      - run: cargo clippy -p ipe-runtime-rust --no-default-features --features db --all-targets -- -D warnings
      # db WITH web — the pair must also stay co-buildable.
      - run: cargo clippy -p ipe-runtime-rust --no-default-features --features db,web --all-targets -- -D warnings

  # WASM floor: the pure kernel set (incl. the whole Ipe.Ui render surface) and
  # the json leg must keep compiling to wasm32-unknown-unknown — the substrate
  # of the browser target (docs/architecture/wasm-target.md).
  wasm-floor:
    runs-on: ubuntu-latest
    # OFF the required PR path: on a PR it runs only when wasm-relevant files
    # change (the `changes` job's filter); on push/schedule it always runs.
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.wasm == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: mozilla-actions/sccache-action@v0.0.9
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p ipe-runtime-rust --target wasm32-unknown-unknown
      - run: cargo build -p ipe-runtime-rust --target wasm32-unknown-unknown --features json

  # The ~180 golden test binaries each statically link the full compiler rlib
  # set. Two independent guards keep the link inside the runner's memory: the
  # root `[profile.test] debug = 0` (no debug-symbol table to relocate per
  # binary) and mold (a memory-frugal linker vs the default GNU `ld`, which OOMs
  # here as `ld terminated with signal 7 [Bus error]`).
  test:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: rui314/setup-mold@v1
      - uses: mozilla-actions/sccache-action@v0.0.9
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run --workspace --profile ci   # E2E tests no-op without IPE_E2E
      - run: cargo test --doc --workspace                 # nextest doesn't run doctests

  # SEAL smoke — the fast required proxy for THE SEAL. Build the compiler, then
  # take ONE small `cli` example end to end: `ipe build` → `cargo build` the
  # emitted crate → run it → assert its expected stdout. This proves the
  # emit→build→run floor holds on every PR in ~a couple of minutes, without the
  # full 6-shard `e2e` (which stays on push/nightly below). A break here means
  # the compiler emits a crate that no longer builds or runs — a hard stop.
  seal-smoke:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -C link-arg=-fuse-ld=mold
      IPE_RUNTIME_DIR: ${{ github.workspace }}/src/runtime/rust/src
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: rui314/setup-mold@v1
      - uses: mozilla-actions/sccache-action@v0.0.9
      - uses: Swatinem/rust-cache@v2
      - name: Build ipe
        run: cargo build --release -p ipe
      - name: Emit + build + run (examples/sky/ipe/01-hello-world)
        run: |
          set -euo pipefail
          IPE="$PWD/target/release/ipe"
          cd examples/sky/ipe/01-hello-world
          "$IPE" build ipe.toml --out out/rust
          cd out/rust
          cargo build --release
          OUT="$(cargo run --release --quiet)"
          echo "emitted-binary output: $OUT"
          # The mirror port preserves the upstream greeting string verbatim (the
          # token rewrite never touches string literals).
          echo "$OUT" | grep -q 'Hello from Sky!'

  # `ipe-runtime-rust`'s `default = []` leaves `compression`/`csv`/`config`/
  # `tokio` (and every other optional feature) OFF, so the `test` job above
  # never compiles the `#[cfg(feature = "...")]`-gated unit tests that live
  # behind those flags — including #129's 7 `*_spawn_blocking_tests` modules
  # in `file`/`compression`/`config_decode`/`csv`/`system.rs`, which prove a
  # blocking kernel actually offloads onto tokio's blocking pool (a future
  # refactor that silently dropped `spawn_blocking` would pass the default
  # gate untouched), AND the ENTIRE `ipe_runtime::live::*` test surface —
  # the `style_inject` CSS-injection sink-forgery gates, SSE/session/dispatch
  # (gate blind spot, 2026-07-11: `full` ⊇ `live`; a default-only gate shows
  # green while these are red). `full` turns on every optional feature so
  # this job is the one place those regression tests run in CI. The local
  # gate recipes (misc/scripts/progressive-development/context.md +
  # autopilot.sh) carry the mirroring
  # `cargo nextest run -p ipe-runtime-rust --features full` lane — keep them
  # in sync with this job.
  runtime-full-features:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'   # slow: push/nightly only, off the required PR gate
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.9
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run -p ipe-runtime-rust --features full --profile ci

  # Scoped deliberately, not exhaustively. All 5 targets are
  # `#![forbid(unsafe_code)]`, so Miri's value here is catching UB triggered
  # indirectly through a DEPENDENCY's own `unsafe` (interning/IR/union-find
  # data structures are exactly the kind of code that leans on library
  # invariants) plus Stacked/Tree-Borrows aliasing violations, not scanning
  # for a nonexistent `unsafe` block of ours. `ipe_db` (the salsa
  # incremental-compilation database — the other candidate with genuinely
  # complex invariants, per docs/architecture/ci-and-hosting.md §3.5) was
  # evaluated and rejected: `cargo +nightly miri test -p ipe_db` timed out
  # after 280s on the FIRST of 3 tests (salsa's internal thread-pool/
  # generation-counter machinery is impractical under Miri's interpretation
  # overhead). `ipe`/`ipe_canon`/`ipe_parse`/`ipe_backend_rust`/`runtime` are
  # out of scope for a different reason: they spawn real subprocesses / do
  # real I/O (E2E tests, `ipe_backend_rust::project`'s `rustfmt` spawn, the
  # runtime's HTTP/DB/websocket kernels), which Miri can't interpret at all —
  # `posix_spawn` is an unsupported foreign call under Miri.
  miri:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'   # slow: push/nightly only, off the required PR gate
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
      - run: cargo +nightly miri test -p ipe_intern -p ipe_ir -p ipe_types -p ipe_lower -p ipe_diagnostics
        env:
          MIRIFLAGS: -Zmiri-disable-isolation

  # E2E builds+runs the emitted Rust per golden (THE SEAL — the soundness floor:
  # every `ipe`-exit-0 golden's emitted Cargo project must `cargo build` + run).
  # Sharded across 6 runners via nextest partitioning. Each golden self-anchors
  # its behaviour against a captured `expected.txt` (the Ipê-native regression
  # anchor). The cached expected_go.txt / oracle.meta Go oracle is retired.
  #
  # The Ipê runtime lives IN-REPO at src/runtime/rust/src (the `ipe-runtime-rust`
  # crate); `ipe::resolve_runtime()` finds it by walking up from the repo root, so
  # no separate vendoring step is required. IPE_RUNTIME_DIR is set explicitly as a
  # belt-and-braces (CWD-independent under nextest).
  #
  # Per-test timeout: the `ci` nextest profile (.config/nextest.toml) sets a 600s
  # terminate budget per test. Tests that drive a real `cargo build` with no shared
  # target (watch_integration, webview_e2e) need up to 4 minutes for a cold build
  # on a loaded runner — the default 120s nextest-partition limit kills them on
  # scheduler contention, not on a real regression.
  #
  # GATING. The oracle.meta → expected.txt migration is complete: every golden
  # that calls assert_go_parity has a matching expected.txt, and the full E2E
  # suite passes locally (207 expected.txt files, 0 oracle.meta). A SEAL
  # regression now fails CI as it should.
  e2e:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'   # slow: push/nightly only (seal-smoke is the PR proxy)
    env:
      RUSTFLAGS: -C link-arg=-fuse-ld=mold
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: rui314/setup-mold@v1
      - uses: mozilla-actions/sccache-action@v0.0.9
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      # Reclaim runner disk before the E2E build: each emitted golden crate pulls
      # the full runtime dep tree (axum/tokio/sqlx/serde) into the shared target.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/share/swift || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL /opt/microsoft /opt/google/chrome /opt/az || true
          sudo swapoff -a || true; sudo rm -f /swapfile /mnt/swapfile || true
          sudo apt-get clean || true
          df -h /
      # wry 0.55 (Webview runtime) requires GLib/GTK/WebKitGTK on Linux.
      # Without these the `bare_html_view_cargo_builds` E2E golden fails when
      # cargo tries to link the emitted Webview project — pkg-config cannot find
      # gobject-2.0 and the build exits non-zero (THE SEAL breach in CI only,
      # not in the emitter). The same packages are already installed in the
      # examples-sweep job for the same reason.
      - name: Install webview link deps (wry/tao — GLib/GTK/WebKit)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev
      - name: E2E shard ${{ matrix.shard }}/6 (THE SEAL — build+run emitted Rust)
        env:
          IPE_E2E: "1"
          IPE_RUNTIME_DIR: ${{ github.workspace }}/src/runtime/rust/src
          # Without this, `tools/oracle`'s `resolve_emitted_target` fail-safe
          # default (isolate) means EVERY golden's emitted crate builds into its
          # own throwaway `target/` under `CARGO_TARGET_TMPDIR`, each compiling
          # the full runtime dep tree (tokio/hyper/rsa/chrono/…) from scratch —
          # the per-golden trees accumulate unbounded across a shard's ~100+
          # goldens and exhaust runner disk (regex-automata/zerocopy ENOSPC).
          # An absolute path here opts every emitted build in this shard into
          # ONE target, so the dep tree compiles once and every later golden
          # only links its own `main.rs`.
          IPE_ORACLE_SHARED_TARGET: ${{ github.workspace }}/.cache/oracle-shared-target
        run: cargo nextest run --workspace --profile ci --no-fail-fast --partition count:${{ matrix.shard }}/6


  # macOS Tier-2 native-code enforcement — the ONLY real verification of the
  # macOS jail's deny behaviour. The Rust unit tests prove the SBPL LOWERING on
  # any host, but only a real macOS runner exercises `sandbox-exec`. This job is
  # that proof, and it is fail-closed by design:
  #
  #   1. It asserts `sandbox-exec` is present and REFUSES to certify (exits non-
  #      zero) if it is absent — never a skip-green. An un-run jail is never
  #      counted as vouching (ADR 0046 refuse-to-certify).
  #   2. It runs the admission enforce-vs-control DUALITY: the forbidden net +
  #      fs-escape actions must SUCCEED outside the jail (positive control) and be
  #      DENIED inside it (enforce). The control proves a denial came from the
  #      jail, not from an unreachable host — so a "clean" Tier-2 result can never
  #      be a false pass from a broken/unreachable jail.
  #   3. It runs the `audit_native` E2E under `IPE_E2E=1`, which drives the real
  #      reconciler through the real `sandbox-exec` jail (the macOS `build_in_jail`
  #      path): a used-but-undeclared axis rejects naming the axis, and a benign
  #      package declaring exactly its axes certifies.
  macos-tier2:
    name: macos-tier2 (sandbox-exec — the real macOS jail proof)
    runs-on: macos-latest
    if: github.event_name != 'pull_request'   # slow: push/nightly only, off the required PR gate
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.9
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest

      # Fail-closed primitive check: an absent sandbox-exec is a hard failure, not
      # a skip — the macOS jail cannot be verified without it, and an unverified
      # platform is NEVER counted as admitted (refuse-to-certify).
      - name: Assert the macOS jail primitive is present (refuse-to-certify)
        run: |
          if ! command -v sandbox-exec >/dev/null 2>&1; then
            echo "ERROR: sandbox-exec absent on this macOS runner — the Tier-2 jail cannot be verified; refusing to certify (this is a hard failure, never a skip-green)." >&2
            exit 1
          fi
          echo "sandbox-exec present: $(command -v sandbox-exec)"

      - name: Make admission scripts executable
        run: chmod +x scripts/admission/jail-macos.sh tests/fixtures/admission/untrusted-build.sh

      # Positive control (OUTSIDE the jail): the same net + fs-escape actions must
      # SUCCEED, so a block under `enforce` below can only be the jail — not an
      # unreachable host or an already-unwritable path.
      - name: Admission positive control (no jail — forbidden actions must succeed)
        env:
          ESCAPE_PATH: ${{ github.workspace }}/admission-escape-probe
        run: PROBE_MODE=control ESCAPE_PATH="$ESCAPE_PATH" sh tests/fixtures/admission/untrusted-build.sh

      # Enforce (INSIDE the jail): net + fs-escape must be DENIED. Paired with the
      # control above, this is the duality that proves the denial is the jail's.
      - name: Admission enforce (jailed — forbidden actions must be blocked)
        env:
          ADMISSION_TIMEOUT_SECS: '60'
          ESCAPE_PATH: ${{ github.workspace }}/admission-escape-probe
        run: scripts/admission/jail-macos.sh tests/fixtures/admission/untrusted-build.sh

      # The real reconciler through the real sandbox-exec jail (the macOS
      # build_in_jail path): used-but-undeclared rejects, benign certifies.
      - name: audit_native E2E through the real macOS jail
        env:
          IPE_E2E: "1"
          IPE_RUNTIME_DIR: ${{ github.workspace }}/src/runtime/rust/src
        run: cargo nextest run -p ipe --test audit_native --profile ci

  # macOS RUN-jail enforcement — the ONLY real verification of the macOS run
  # jail's deny behaviour (the jail around the EMITTED app at `ipe run`, as
  # opposed to the Tier-2 build jail above). The Rust unit tests prove the SBPL
  # LOWERING on any host, but only a real macOS runner exercises the
  # `sandbox-exec` run jail. This job drives the RUN jail through the SAME
  # `sbpl_from_profile` the production `exec_in_run_jail` macOS arm uses (one SBPL
  # source, no fork), and is fail-closed by design:
  #
  #   1. It asserts `sandbox-exec` is present and REFUSES to certify (exits non-
  #      zero) if it is absent — never a skip-green. An un-run jail is never
  #      counted as vouching for the run-jail deny behaviour.
  #   2. It runs the run_jail_macos_e2e enforce-vs-control DUALITY: a net connect
  #      and an out-of-scratch write must SUCCEED unjailed (control) and be DENIED
  #      under the profile's run jail (enforce), so a denial can only be the jail's
  #      — never an unreachable host or an already-unwritable path.
  macos-run-jail:
    name: macos-run-jail (sandbox-exec — the real macOS run-jail proof)
    runs-on: macos-latest
    if: github.event_name != 'pull_request'   # slow: push/nightly only, off the required PR gate
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.9
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest

      # Fail-closed primitive check: an absent sandbox-exec is a hard failure, not
      # a skip — the run jail cannot be verified without it, and an unverified
      # platform is NEVER counted as jail-holds (refuse-to-certify).
      - name: Assert the macOS jail primitive is present (refuse-to-certify)
        run: |
          if ! command -v sandbox-exec >/dev/null 2>&1; then
            echo "ERROR: sandbox-exec absent on this macOS runner — the run jail cannot be verified; refusing to certify (this is a hard failure, never a skip-green)." >&2
            exit 1
          fi
          echo "sandbox-exec present: $(command -v sandbox-exec)"

      # The run jail's enforce-vs-control duality through the real sandbox-exec
      # jail: an undeclared net connect / out-of-scratch write is DENIED under the
      # jail while the same action SUCCEEDS under control, and a granted axis is
      # not false-denied. IPE_E2E=1 arms the real jailed runs.
      - name: run_jail_macos E2E through the real macOS run jail
        env:
          IPE_E2E: "1"
        run: cargo nextest run -p ipe_sandbox --test run_jail_macos_e2e --profile ci

  # ─── Windows run-jail proof (the RUNTIME jail, not the build jail) ───────────
  # The security half of the SEAL on Windows: a REAL proof of the Windows run
  # jail's deny behaviour (the jail around the EMITTED app at `ipe run`). The
  # Windows arm assembles its confinement from Win32 kernel primitives — a Job
  # Object (subprocess), an AppContainer lowbox token (filesystem + network), and
  # a launcher-side environment scrub (env). The Rust unit tests prove the pure
  # pieces (the env scrub, the UTF-16 block, the active-process cap) on any host;
  # only a real Windows runner exercises the kernel objects.
  #
  # Crucially this needs NO Docker Windows container daemon (unlike the separate
  # admission/build-jail windows-x64 job, which does and is a documented skip on
  # hosted runners): a Job Object / AppContainer / restricted token is a plain
  # Win32 API sequence, so the RUNTIME run jail is provable on a hosted
  # `windows-2022` runner. The job is fail-closed by design:
  #
  #   1. It asserts the run-jail primitives are constructible and REFUSES to
  #      certify (exits non-zero) if they are not — never a skip-green.
  #   2. It runs the run_jail_windows_e2e enforce-vs-control DUALITY per axis:
  #      a child spawn / out-of-scratch write / non-allowlisted env var / outbound
  #      connect must behave one way under the jail and the opposite under control,
  #      so a denial can only be the jail's — never an unreachable host or an
  #      already-unwritable path.
  #
  # Hosted-provable axes: subprocess, env, filesystem, and the ENFORCE half of
  # network. The network POSITIVE control (a connect that must succeed unjailed)
  # needs real outbound egress; if the hosted runner blocks egress the network
  # test skips its own control (design §5.2) and that axis's positive control
  # needs a self-hosted runner. The non-ACL-volume filesystem refuse-gap (design
  # §5.2) also needs a mounted FAT/exFAT volume a hosted image does not provide.
  windows-run-jail:
    name: windows-run-jail (Job Object + AppContainer — the real Windows run-jail proof)
    runs-on: windows-2022
    if: github.event_name != 'pull_request'   # slow: push/nightly only, off the required PR gate
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.9
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest

      # Fail-closed primitive check: assert the runtime-jail primitives are
      # constructible on this runner. A failure to build a Job Object /
      # AppContainer profile is a hard failure (refuse-to-certify), never a skip —
      # an unverified platform is NEVER counted as jail-holds. PowerShell is the
      # jailed probe host the E2E launches, so its presence is also asserted.
      - name: Assert the Windows run-jail primitives are present (refuse-to-certify)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # A Job Object must be creatable.
          $sig = @'
          using System;
          using System.Runtime.InteropServices;
          public static class J {
            [DllImport("kernel32.dll", SetLastError=true)]
            public static extern IntPtr CreateJobObjectW(IntPtr a, IntPtr b);
            [DllImport("kernel32.dll", SetLastError=true)]
            public static extern bool CloseHandle(IntPtr h);
          }
          '@
          Add-Type -TypeDefinition $sig
          $job = [J]::CreateJobObjectW([IntPtr]::Zero, [IntPtr]::Zero)
          if ($job -eq [IntPtr]::Zero) {
            Write-Error "CreateJobObjectW failed — the Windows run jail cannot be verified; refusing to certify (hard failure, never a skip-green)."
            exit 1
          }
          [void][J]::CloseHandle($job)
          # PowerShell (the jailed probe host) must resolve.
          if (-not (Get-Command powershell.exe -ErrorAction SilentlyContinue)) {
            Write-Error "powershell.exe absent — the run-jail E2E probe cannot run; refusing to certify."
            exit 1
          }
          Write-Output "Windows run-jail primitives present (Job Object creatable; powershell.exe resolved)."

      # The run jail's enforce-vs-control duality through the real Job Object +
      # AppContainer token: an undeclared child spawn / out-of-scratch write /
      # non-allowlisted env var / outbound connect is DENIED under the jail while
      # the same action SUCCEEDS under control, and a granted axis is not
      # false-denied. IPE_E2E=1 arms the real jailed runs.
      - name: run_jail_windows E2E through the real Windows run jail
        env:
          IPE_E2E: "1"
        run: cargo nextest run -p ipe_sandbox --test run_jail_windows_e2e --profile ci

  # ─── Windows Tier-2 BUILD-jail proof (the returning build jail, ADR 0051) ────
  # The differential-confinement half on Windows: a REAL proof of the Windows
  # returning build jail's deny behaviour (`build_in_jail`, not the run jail).
  # The arm reuses the SAME Job Object + AppContainer + launcher-scrub sequence
  # the run jail uses, but RETURNS a decoded `JailOutcome`. Like the run-jail
  # proof this needs NO Docker Windows daemon — a Job Object / AppContainer is a
  # plain Win32 sequence, provable on a hosted `windows-2022` runner. Fail-closed:
  #
  #   1. It asserts the build-jail primitives are constructible and REFUSES to
  #      certify (exits non-zero) if not — never a skip-green. Until this job is
  #      green on a real runner, Windows Tier-2 stays refuse-to-certify
  #      (`build_in_jail` returns `Unavailable`), never admitting unconfined.
  #   2. It runs the build_jail_windows_e2e RED-CANARY: a socket opened while the
  #      declared-scoped jail withholds `network` must decode to
  #      `Denied { axis: Network }` (a differentially-probed axis), an
  #      out-of-scratch write under a filesystem-withholding jail to
  #      `Denied { axis: Filesystem }`, and a benign in-scratch build to `Clean`.
  #      IPE_E2E=1 arms the real jailed runs.
  #
  # The non-ACL-volume filesystem refuse-gap (the `FILE_PERSISTENT_ACLS` probe)
  # is unit-tested host-independently; exercising it live needs a mounted
  # FAT/exFAT volume a hosted image does not provide (a self-hosted runner axis).
  #
  # This job ALSO runs the audit-layer `audit_native` E2E: the reconciler drives
  # the Windows `build_in_jail` through `JailProbeRunner` with a Windows-NATIVE
  # probe wrapper (tests/fixtures/admission/untrusted-build.ps1), invoked as
  # `powershell.exe -File ... -Tier2Axis <axis> ... -- <untrusted build>`
  # (PowerShell is the `CreateProcessW`-invokable interpreter, so the jail runs it
  # directly -- no shell). It certifies a benign package as `windows-x64` and
  # rejects a used-but-undeclared axis, so Windows is a real certifying platform
  # in the audit layer, not only a build-jail deny proof.
  windows-tier2:
    name: windows-tier2 (Job Object + AppContainer — the real Windows build-jail proof)
    runs-on: windows-2022
    if: github.event_name != 'pull_request'   # slow: push/nightly only, off the required PR gate
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.9
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest

      # Fail-closed primitive check: a Job Object must be creatable and PowerShell
      # (the jailed probe host) must resolve. A failure is refuse-to-certify (hard
      # failure, never a skip-green) — an unverified platform is never admitted.
      - name: Assert the Windows build-jail primitives are present (refuse-to-certify)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sig = @'
          using System;
          using System.Runtime.InteropServices;
          public static class J {
            [DllImport("kernel32.dll", SetLastError=true)]
            public static extern IntPtr CreateJobObjectW(IntPtr a, IntPtr b);
            [DllImport("kernel32.dll", SetLastError=true)]
            public static extern bool CloseHandle(IntPtr h);
          }
          '@
          Add-Type -TypeDefinition $sig
          $job = [J]::CreateJobObjectW([IntPtr]::Zero, [IntPtr]::Zero)
          if ($job -eq [IntPtr]::Zero) {
            Write-Error "CreateJobObjectW failed — the Windows build jail cannot be verified; refusing to certify (hard failure, never a skip-green)."
            exit 1
          }
          [void][J]::CloseHandle($job)
          if (-not (Get-Command powershell.exe -ErrorAction SilentlyContinue)) {
            Write-Error "powershell.exe absent — the build-jail E2E probe cannot run; refusing to certify."
            exit 1
          }
          Write-Output "Windows build-jail primitives present (Job Object creatable; powershell.exe resolved)."

      # The build jail's red-canary through the real Job Object + AppContainer
      # token: a socket under a network-withholding jail decodes to
      # Denied { Network }, an out-of-scratch write to Denied { Filesystem }, and a
      # benign in-scratch build to Clean. IPE_E2E=1 arms the real jailed runs.
      - name: build_jail_windows E2E through the real Windows build jail
        env:
          IPE_E2E: "1"
        run: cargo nextest run -p ipe_sandbox --test build_jail_windows_e2e --profile ci

      # The real reconciler through the real Windows build jail (the audit-layer
      # certify path): the reconciler drives build_in_jail via JailProbeRunner
      # with the Windows-native PowerShell probe wrapper. A used-but-undeclared
      # axis rejects naming the axis, and a benign package declaring exactly its
      # axes certifies as windows-x64 (the certify+reject the macos/freebsd jobs
      # prove on their platforms). IPE_E2E=1 arms the real jailed runs.
      - name: audit_native E2E through the real Windows jail
        env:
          IPE_E2E: "1"
          IPE_RUNTIME_DIR: ${{ github.workspace }}/src/runtime/rust/src
        run: cargo nextest run -p ipe --test audit_native --profile ci

  # ─── FreeBSD Tier-2 BUILD-jail proof (the returning build jail, ADR 0051) ────
  # FreeBSD's differential-confinement half: a REAL proof of the FreeBSD returning
  # build jail (`build_in_jail`), which lowers the axes onto a scratch-rooted
  # jail(2) established via the jail(8) CLI (ip4/ip6=disable for network, an
  # unprivileged jail user over a chowned scratch for filesystem, an rctl
  # maxproc:deny rule for a withheld subprocess axis). No native FreeBSD GitHub
  # runner exists, so this runs inside a vmactions/freebsd-vm VM (root by default,
  # required to create jails), reusing the admission-sandbox freebsd infra.
  # Fail-closed: until this job is green on a real runner, FreeBSD Tier-2 stays
  # refuse-to-certify (`build_in_jail` returns `Unavailable`), never admitting
  # unconfined. The red-canary demands a differentially-probed axis
  # (Denied { Network } / Denied { Filesystem }); a benign build is Clean.
  #
  # This job ALSO runs the audit-layer `audit_native` E2E inside the VM: the
  # reconciler drives the FreeBSD `build_in_jail` through `JailProbeRunner` (the
  # SAME POSIX-shell probe wrapper the Linux/macOS jobs use — FreeBSD has
  # `/bin/sh`), certifying a benign package as `freebsd-x64` and rejecting a
  # used-but-undeclared axis. So FreeBSD is a real certifying platform in the
  # audit layer, not only a build-jail deny proof.
  freebsd-tier2:
    name: freebsd-tier2 (jail(8) inside vmactions VM — the real FreeBSD build-jail proof)
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'   # slow VM boot: push/nightly only
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: build_jail_freebsd E2E through the real FreeBSD build jail
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: |
            pkg install -y rust python3
          run: |
            # Fail-closed primitive check: jail(8) and rctl(8) must be present, or
            # the FreeBSD build jail cannot be verified — refuse to certify (hard
            # failure, never a skip-green).
            if ! command -v jail >/dev/null 2>&1; then
              echo "ERROR: jail(8) absent — the FreeBSD build jail cannot be verified; refusing to certify." >&2
              exit 1
            fi
            if ! command -v rctl >/dev/null 2>&1; then
              echo "ERROR: rctl(8) absent — a withheld-subprocess jail cannot deny process creation; refusing to certify." >&2
              exit 1
            fi
            # The red-canary through the real jail(8): IPE_E2E=1 arms the runs.
            IPE_E2E=1 cargo test -p ipe_sandbox --test build_jail_freebsd_e2e -- --nocapture
            # The audit-layer certify path through the real jail(8): the reconciler
            # drives the FreeBSD build_in_jail via JailProbeRunner. A used-but-
            # undeclared axis rejects naming the axis (the red-canary), and a benign
            # package declaring exactly its axes certifies as freebsd-x64. IPE_E2E=1
            # arms the real jailed runs; this exercises the certify+reject the
            # windows-2022/macos jobs prove on their platforms.
            IPE_E2E=1 IPE_RUNTIME_DIR="$GITHUB_WORKSPACE/src/runtime/rust/src" \
              cargo test -p ipe --test audit_native -- --nocapture
