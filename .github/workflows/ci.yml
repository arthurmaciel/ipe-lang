name: Build & test

# GitHub-hosted runners (4-core/16GB, ephemeral) with matrix parallelism.
#
# Split by trigger so `main` is green by construction:
#   • PULL REQUEST — the FAST required gate (target: minutes). fmt, clippy,
#     test (nextest unit/integration), cargo-deny (in security.yml), and
#     seal-smoke (build+run ONE emitted example, a fast proxy for THE SEAL).
#     A PR merges only when these pass; branch protection lists them as the
#     required checks.
#   • PUSH to main + nightly SCHEDULE — the SLOW non-blocking checks: the full
#     6-shard e2e (THE SEAL in full), miri, and the runtime
#     feature-combo / full-feature builds. These never gate a PR; they catch
#     regressions post-merge and on the nightly dep/upstream-drift sweep.
#   • wasm-floor runs on PRs only when wasm-relevant paths change (paths: filter
#     below), plus nightly — it is OFF the always-required PR path.
#
# Job-level `if:` keys on github.event_name: the slow jobs self-skip on
# pull_request. E2E is sharded across 6 runners; sccache (GHA backend) keeps
# builds warm across runs.

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: '0 4 * * *'        # nightly full sweep (catches dep/upstream drift)
  workflow_dispatch: {}

concurrency:
  # On pull requests, cancel the previous run for the same ref so devs get fast
  # feedback without wasting runner minutes. On direct pushes to the default
  # branch (main) and on tags, never cancel: the slow Tier-2 jobs
  # (windows-run-jail, windows-tier2, freebsd-tier2) only run on push and would
  # be killed before they complete, making them permanently red.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  # Path filters. On a PR each filter's output gates whether its dependent jobs
  # run; on push/schedule the jobs always run (see each job's `if:`).
  #   • wasm  — keeps the wasm build OFF the required PR path for non-wasm changes.
  #   • code  — a conservative SUPERSET of every build input. When it is false a
  #     PR touches only docs/prose that NO test reads at runtime, so `test`,
  #     `clippy`, and `seal-smoke` are safe to skip. When in doubt it runs: the
  #     filter lists all source/manifest/workflow paths, and the ONE prose-file
  #     build-input gotcha `AGENTS.md` — it is `include_str!("../../../AGENTS.md")`
  #     into ipe-cli's init.rs, and the `init_subcommand` test asserts on its
  #     bytes, so a change to it MUST re-run the gates. (The explain/*.md
  #     diagnostic pages live under src/** already, so they need no special case.)
  changes:
    runs-on: ubuntu-latest
    outputs:
      wasm: ${{ steps.filter.outputs.wasm }}
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            wasm:
              - 'src/runtime/**'
              - 'src/compiler/backend/**'
              - 'src/wasm/**'
              - 'runtime/**'
              - 'crates/ipe_backend_rust/**'
              - '**/*wasm*'
              - '.github/workflows/ci.yml'
            code:
              - 'src/**'
              - 'crates/**'
              - 'runtime/**'
              - 'tests/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '**/Cargo.toml'
              - '.github/workflows/**'
              # AGENTS.md is a BUILD input: include_str!'d into ipe-cli's init.rs
              # and asserted by the init_subcommand test. Every other root *.md /
              # docs/** / misc/** file is prose no test reads — safe to skip.
              - 'AGENTS.md'

  # Fail-closed guard against clone bloat: a commit that tracks a build artifact
  # (a target/ directory, an .rlib/.rmeta/.o/.a/.so/.dylib/.wasm blob) or any file
  # over 5 MiB turns this red. Regenerable build output committed once bloats every
  # future clone and can only be purged from history by a human-run rewrite;
  # this keeps the tree clean going forward. No toolchain needed — pure git +
  # shell, so it stays on the
  # fast required PR path.
  artifact-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: ./tools/scripts/ci/artifact-guard.sh

  # Fail-closed guard: shipped source must not name the private reference
  # implementation.  Pure rg + shell, no toolchain needed — stays on the
  # fast required PR path.  SSOT: tools/scripts/no-reference-impl-leak.sh.
  no-reference-impl-leak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash tools/scripts/no-reference-impl-leak.sh

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    needs: changes
    # Change-gated: a docs-only PR (no code path in the `code` filter) skips
    # clippy; it always runs on push/nightly.
    if: needs.changes.outputs.code == 'true' || github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: mozilla-actions/sccache-action@v0.0.9
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --workspace -- -D warnings

  # No compiler-internal jargon or raw Rust types leak into user-facing text
  # (rendered diagnostic goldens + `ipe explain` pages). Pure git + ripgrep, no
  # toolchain, so it stays on the fast required PR path.
  diagnostic-tone:
    runs-on: ubuntu-latest
    needs: changes
    # Change-gated like clippy: a PR that touches no code path skips it; it
    # always runs on push/nightly.
    if: needs.changes.outputs.code == 'true' || github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - run: bash tools/scripts/lint-diagnostic-tone.sh

  # Doctest-style gate: every unmarked ```ipe block in src/compiler/diagnostics/explain/*.md
  # must type-check. A page that teaches broken syntax is worse than no page (ADR 0059).
  # Requires `ipe` binary (type-check only — no emit, no cargo, no IPE_E2E).
  # Fence-marker convention:
  #   ```ipe            default — MUST type-check
  #   ```ipe ipe:error  intentional bad example — gate fails if it compiles
  #   ```ipe ipe:skip   pseudocode / FFI / multi-file — skipped entirely
  # Change-gated: explain pages live under src/** (already in the `code` filter),
  # so a docs-only PR that touches nothing in src/** legitimately skips this gate.
  explain-examples:
    name: explain-page example gate (ADR 0059)
    runs-on: ubuntu-latest
    needs: [changes, quick-check]
    if: needs.changes.outputs.code == 'true' || github.event_name != 'pull_request'
    env:
      RUSTFLAGS: -C link-arg=-fuse-ld=mold
      IPE_RUNTIME_DIR: ${{ github.workspace }}/src/runtime/rust/src
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: rui314/setup-mold@v1
      - uses: mozilla-actions/sccache-action@v0.0.9
      - uses: Swatinem/rust-cache@v2
      - name: Build ipe
        run: cargo build --release -p ipe
      - name: Compile every explain-page example
        env:
          IPE_BIN: ${{ github.workspace }}/target/release/ipe
        run: bash tools/scripts/check-explain-examples.sh

  # Every fenced ```ipe block in every {-| … -} doc-string in the standard
  # library must type-check. A doc-string edit that introduces a broken example
  # (wrong name, wrong type) reddens this gate. Change-gated on `code` (stdlib
  # sources live under src/**) so a prose-only PR legitimately skips it.
  doc-examples:
    name: doc-string example gate
    runs-on: ubuntu-latest
    needs: [changes, quick-check]
    if: needs.changes.outputs.code == 'true' || github.event_name != 'pull_request'
    env:
      RUSTFLAGS: -C link-arg=-fuse-ld=mold
      IPE_RUNTIME_DIR: ${{ github.workspace }}/src/runtime/rust/src
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: rui314/setup-mold@v1
      - uses: mozilla-actions/sccache-action@v0.0.9
      - uses: Swatinem/rust-cache@v2
      - name: Build ipe
        run: cargo build --release -p ipe
      - name: Type-check every doc-string example
        env:
          IPE_BIN: ${{ github.workspace }}/target/release/ipe
        run: bash tools/scripts/check-doc-examples.sh

  # Fast fail-fast compile check. A non-compiling PR turns this red in ~a minute
  # (no test link, no emit), so the expensive downstream jobs (seal-smoke and the
  # push-only e2e/miri) never start behind broken code — they `needs: quick-check`.
  # `test` deliberately does NOT gate on this: it runs in parallel for fastest
  # feedback, and its own compile subsumes the check.
  quick-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.9
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace

  # Guards the ipe-runtime-rust feature graph against silent coupling. The
  # workspace jobs above build the runtime with its DEFAULT features (`[]`), so
  # narrow subsets are otherwise unexercised. In particular a DB-only server /
  # CLI app must compile WITHOUT `live` (Ipe.Web) — if a future change adds an
  # ungated reference to a `live`-only item (e.g. `super::LiveReq`) from
  # `db`-gated code, or pulls `live` into the `db` feature list, this job fails.
  # Keep `db` and `live` independently buildable; gate cross-feature items with
  # `#[cfg(feature = "live")]`.
  runtime-feature-combos:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'   # off the PR gate; runs on push, nightly
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: mozilla-actions/sccache-action@v0.0.9
      - uses: Swatinem/rust-cache@v2
      # db WITHOUT web — the load-bearing invariant.
      - run: cargo clippy -p ipe-runtime-rust --no-default-features --features db --all-targets -- -D warnings
      # db WITH web — the pair must also stay co-buildable.
      - run: cargo clippy -p ipe-runtime-rust --no-default-features --features db,web --all-targets -- -D warnings

  # WASM floor: the pure kernel set (incl. the whole Ipe.Ui render surface) and
  # the json leg must keep compiling to wasm32-unknown-unknown — the substrate
  # of the browser target (docs/architecture/wasm-target.md).
  wasm-floor:
    runs-on: ubuntu-latest
    # OFF the required PR path: on a PR it runs only when wasm-relevant files
    # change (the `changes` job's filter); on push/schedule it always runs.
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.wasm == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: mozilla-actions/sccache-action@v0.0.9
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p ipe-runtime-rust --target wasm32-unknown-unknown
      - run: cargo build -p ipe-runtime-rust --target wasm32-unknown-unknown --features json
      # The development-only debugger must not drag tokio onto wasm: `debugger`
      # implies `async`, but tokio is native-only, so `wasm-client,debugger`
      # links the recorder over the closed browser floor without a tokio graph.
      - run: cargo build -p ipe-runtime-rust --target wasm32-unknown-unknown --no-default-features --features wasm-client,debugger

  # ── test: build-once, shard-run ──────────────────────────────────────────────
  # The workspace's ~170 test binaries each statically link the full compiler
  # rlib set, so the COMPILE dominates. `test-prep` compiles them exactly once
  # (`nextest archive` → a self-contained archive of every test binary) and the
  # `test-run` matrix downloads that archive and runs a disjoint partition on
  # each of 4 runners — one compile, 4-way parallel run. The required gate is the
  # `test` aggregation job below; branch protection lists `test`, which stays
  # green only if every shard AND the doctest job passed.
  #
  # Two independent guards keep the per-binary link inside runner memory: the
  # root `[profile.test] debug = 0` (no debug-symbol table to relocate per
  # binary) and mold (a memory-frugal linker vs the default GNU `ld`, which OOMs
  # here as `ld terminated with signal 7 [Bus error]`).
  test-prep:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name != 'pull_request'
    env:
      RUSTFLAGS: -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: rui314/setup-mold@v1
      - uses: mozilla-actions/sccache-action@v0.0.9
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      # Compile every test binary ONCE into a self-contained archive.
      - run: cargo nextest archive --workspace --archive-file nextest.tar.zst
      - uses: actions/upload-artifact@v7
        with:
          name: nextest-archive
          path: nextest.tar.zst
          retention-days: 1
      # Doctests can't be archived/partitioned by nextest, so they run here once
      # against the just-warmed target (rustdoc drives them separately).
      - run: cargo test --doc --workspace

  test-run:
    runs-on: ubuntu-latest
    needs: test-prep
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      - uses: actions/download-artifact@v7
        with:
          name: nextest-archive
      # Run this shard's disjoint partition from the prebuilt archive — no
      # recompile. `--workspace-remap .` re-roots the archived paths at this
      # checkout. E2E tests no-op without IPE_E2E.
      - run: cargo nextest run --archive-file nextest.tar.zst --workspace-remap . --partition count:${{ matrix.shard }}/4 --profile ci

  # Required aggregation gate for `test`: green only when every shard and the
  # doctest job (in test-prep) passed. Branch protection lists this job, so a
  # matrix expansion never silently drops a required check. The `always()` guard
  # makes a skipped/failed dependency a FAILURE here, never a false green.
  test:
    runs-on: ubuntu-latest
    needs: [changes, test-prep, test-run]
    if: always()
    steps:
      - name: Gate on shard + doctest results
        run: |
          # A skipped `test-prep`/`test-run` is legitimate ONLY when the change
          # gate deliberately skipped them (docs-only PR); in that case `test`
          # passes vacuously. Any failure/cancellation is a hard stop.
          prep='${{ needs.test-prep.result }}'
          run='${{ needs.test-run.result }}'
          code='${{ needs.changes.outputs.code }}'
          event='${{ github.event_name }}'
          if [ "$prep" = failure ] || [ "$prep" = cancelled ] \
             || [ "$run" = failure ] || [ "$run" = cancelled ]; then
            echo "test gate FAILED (test-prep=$prep test-run=$run)" >&2
            exit 1
          fi
          if [ "$prep" = skipped ] && [ "$code" != true ] && [ "$event" = pull_request ]; then
            echo "docs-only PR: no code paths changed, test suite skipped vacuously."
            exit 0
          fi
          if [ "$prep" != success ] || [ "$run" != success ]; then
            echo "test gate FAILED: expected all shards to succeed (test-prep=$prep test-run=$run)" >&2
            exit 1
          fi
          echo "test gate PASSED (all shards + doctests green)."

  # SEAL smoke — the fast required proxy for THE SEAL. Build the compiler, then
  # take ONE small `cli` example end to end: `ipe build` → `cargo build` the
  # emitted crate → run it → assert its expected stdout. This proves the
  # emit→build→run floor holds on every PR in ~a couple of minutes, without the
  # full 6-shard `e2e` (which stays on push/nightly below). A break here means
  # the compiler emits a crate that no longer builds or runs — a hard stop.
  seal-smoke:
    runs-on: ubuntu-latest
    needs: [changes, quick-check]
    if: needs.changes.outputs.code == 'true' || github.event_name != 'pull_request'
    env:
      RUSTFLAGS: -C link-arg=-fuse-ld=mold
      IPE_RUNTIME_DIR: ${{ github.workspace }}/src/runtime/rust/src
      # One shared cargo target for the EMITTED crates (kept out of the default
      # workspace target/ so the ipe compiler build above still caches normally):
      # the runtime dep tree compiles into it once and later emitted builds go
      # incremental instead of cold-building axum/tokio/serde per example.
      IPE_SEAL_TARGET: ${{ github.workspace }}/.cache/seal-shared-target
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: rui314/setup-mold@v1
      - uses: mozilla-actions/sccache-action@v0.0.9
      # Cache the shared emitted-crate target too (keyed on this job), so the
      # runtime + its deps stay warm across runs and later emitted builds are
      # incremental. The default workspace target is cached by the entry above.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-directories: ${{ github.workspace }}/.cache/seal-shared-target
      - name: Build ipe
        run: cargo build --release -p ipe
      # Pre-warm the shared emitted-crate target with the runtime + a trivial
      # emitted crate BEFORE the per-example build below, so the cold runtime dep
      # build lands once (and in cache) rather than on the tested hot path. Does
      # not change WHAT is tested.
      - name: Pre-warm the shared emitted-crate target (runtime + deps)
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/.cache/seal-shared-target
        run: |
          set -euo pipefail
          IPE="$PWD/target/release/ipe"
          WARM="$(mktemp -d)"
          cd "$WARM"
          "$IPE" build "$GITHUB_WORKSPACE/examples/shapes/non-tea/hello-world/package.ipe" --out out/rust
          cd out/rust
          cargo build --release   # compiles the runtime dep tree into the shared target
      - name: Emit + build + run (examples/shapes/non-tea/hello-world)
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/.cache/seal-shared-target
        run: |
          set -euo pipefail
          IPE="$PWD/target/release/ipe"
          cd examples/shapes/non-tea/hello-world
          "$IPE" build package.ipe --out out/rust
          cd out/rust
          cargo build --release   # incremental: deps already in the shared target
          OUT="$(cargo run --release --quiet)"
          echo "emitted-binary output: $OUT"
          echo "$OUT" | grep -q 'Hello, Ipê!'

  # First-party shape examples — the representative user-facing gate. Every
  # committed example under examples/shapes/ (one per shape: script, terminal,
  # web) must `ipe type-check`, `ipe build`, and cargo-build its emitted crate on
  # every PR. This is the fast, non-flaky core of the examples proof: it catches
  # a compiler change that makes a shipped example stop type-checking or emit a
  # crate that no longer compiles — the two ways a user first feels a regression.
  # Interactive RUN coverage (browser round-trips, pty-driven tui) is outside
  # this build gate.
  shapes-examples:
    name: first-party shapes (build gate)
    runs-on: ubuntu-latest
    needs: [changes, quick-check]
    if: needs.changes.outputs.code == 'true' || github.event_name != 'pull_request'
    env:
      RUSTFLAGS: -C link-arg=-fuse-ld=mold
      IPE_RUNTIME_DIR: ${{ github.workspace }}/src/runtime/rust/src
      # Shared emitted-crate target (kept out of the workspace target/): the
      # runtime dep tree compiles once, later shape builds go incremental.
      IPE_SHAPES_TARGET: ${{ github.workspace }}/.cache/shapes-shared-target
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: rui314/setup-mold@v1
      - uses: mozilla-actions/sccache-action@v0.0.9
      - uses: Swatinem/rust-cache@v2
        with:
          cache-directories: ${{ github.workspace }}/.cache/shapes-shared-target
      - name: Build ipe
        run: cargo build --release -p ipe
      # Pre-warm the shared target with the runtime dep tree (via the lightest
      # shape) so the first heavy shape build goes incremental instead of cold.
      - name: Pre-warm the shared emitted-crate target
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/.cache/shapes-shared-target
        run: |
          set -euo pipefail
          IPE="$PWD/target/release/ipe"
          WARM="$(mktemp -d)"; cd "$WARM"
          "$IPE" build "$GITHUB_WORKSPACE/examples/shapes/script/release-preflight/package.ipe" --out out/rust
          cd out/rust && cargo build
      - name: Check + emit + build every first-party shape
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/.cache/shapes-shared-target
        run: |
          set -uo pipefail
          IPE="$PWD/target/release/ipe"
          fail=0
          for toml in examples/shapes/*/*/package.ipe; do
            dir="$(dirname "$toml")"
            entry="$dir/src/Main.ipe"
            echo "::group::$dir"
            if ! "$IPE" type-check "$entry"; then
              echo "::error::ipe type-check regressed: $dir"; fail=1; echo "::endgroup::"; continue
            fi
            if ! "$IPE" build "$toml" --out "$dir/out/rust"; then
              echo "::error::ipe build regressed: $dir"; fail=1; echo "::endgroup::"; continue
            fi
            # A debug build proves the emitted crate compiles and links — the two
            # ways a user first feels an emit regression. Release optimisation adds
            # minutes here without strengthening that proof; the full release SEAL
            # (the e2e goldens) stays on push/nightly.
            if ! ( cd "$dir/out/rust" && cargo build ); then
              echo "::error::emitted cargo build regressed: $dir"; fail=1
            fi
            echo "::endgroup::"
          done
          if [ "$fail" != 0 ]; then
            echo "one or more first-party shape examples regressed — a user-facing break" >&2
            exit 1
          fi
          echo "all first-party shape examples check + build + emit cleanly."

  # `ipe type-check`-only FLOOR over the WHOLE first-party example set — the cheap,
  # gating compile floor (scripts/first-party-check-floor.sh, set derived in
  # scripts/lib/examples.sh `first_party_check_set`). It type-checks every shipped
  # examples/shapes/** and examples/wasm/** entry (FFI-gated examples excluded)
  # and fails loud, naming each that does not `ipe type-check` clean.
  #
  # Complementary, not redundant, to `shapes-examples` above: that job BUILDS +
  # cargo-compiles the 4 shapes; this floor is check-only (no cargo) but WIDER —
  # it also covers examples/wasm/**, which no other required gate type-checks.
  # So a wasm example that stops
  # type-checking (e.g. a pub/sub contract change) breaks a PR here instead of
  # rotting in the tree.
  first-party-check-floor:
    name: first-party check floor (ipe type-check only)
    runs-on: ubuntu-latest
    needs: [changes, quick-check]
    if: needs.changes.outputs.code == 'true' || github.event_name != 'pull_request'
    env:
      RUSTFLAGS: -C link-arg=-fuse-ld=mold
      IPE_RUNTIME_DIR: ${{ github.workspace }}/src/runtime/rust/src
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: rui314/setup-mold@v1
      - uses: mozilla-actions/sccache-action@v0.0.9
      - uses: Swatinem/rust-cache@v2
      # ripgrep — scripts/lib/examples.sh's classification helpers require it.
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Build ipe
        run: cargo build --release -p ipe
      - name: Type-check every first-party example
        env:
          IPE_BIN: ${{ github.workspace }}/target/release/ipe
        run: bash tools/scripts/first-party-check-floor.sh

  # `ipe-runtime-rust`'s `default = []` leaves `compression`/`csv`/`config`/
  # `tokio` (and every other optional feature) OFF, so the `test` job above
  # never compiles the `#[cfg(feature = "...")]`-gated unit tests that live
  # behind those flags — including #129's 7 `*_spawn_blocking_tests` modules
  # in `file`/`compression`/`config_decode`/`csv`/`system.rs`, which prove a
  # blocking kernel actually offloads onto tokio's blocking pool (a future
  # refactor that silently dropped `spawn_blocking` would pass the default
  # gate untouched), AND the ENTIRE `ipe_runtime::live::*` test surface —
  # the `style_inject` CSS-injection sink-forgery gates, SSE/session/dispatch
  # (gate blind spot, 2026-07-11: `full` ⊇ `live`; a default-only gate shows
  # green while these are red). `full` turns on every optional feature so
  # this job is the one place those regression tests run in CI. The local
  # gate recipes (misc/scripts/progressive-development/context.md +
  # autopilot.sh) carry the mirroring
  # `cargo nextest run -p ipe-runtime-rust --features full` lane — keep them
  # in sync with this job.
  runtime-full-features:
    runs-on: ubuntu-latest
    needs: changes
    # Runs on code PRs (so it can be a required status check), plus push and
    # nightly. `full` ⊇ `live`, so a default-only PR gate goes green while
    # feature-gated regressions (e.g. a workspace-wide serde_json flag flip
    # changing signed-token bytes) stay red here — that class must block a PR.
    if: needs.changes.outputs.code == 'true' || github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.9
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run -p ipe-runtime-rust --features full --profile ci

  # Scoped deliberately, not exhaustively. All 5 targets are
  # `#![forbid(unsafe_code)]`, so Miri's value here is catching UB triggered
  # indirectly through a DEPENDENCY's own `unsafe` (interning/IR/union-find
  # data structures are exactly the kind of code that leans on library
  # invariants) plus Stacked/Tree-Borrows aliasing violations, not scanning
  # for a nonexistent `unsafe` block of ours. `ipe_db` (the salsa
  # incremental-compilation database — the other candidate with genuinely
  # complex invariants, per docs/architecture/ci-and-hosting.md §3.5) was
  # evaluated and rejected: `cargo +nightly miri test -p ipe_db` timed out
  # after 280s on the FIRST of 3 tests (salsa's internal thread-pool/
  # generation-counter machinery is impractical under Miri's interpretation
  # overhead). `ipe`/`ipe_canon`/`ipe_parse`/`ipe_backend_rust`/`runtime` are
  # out of scope for a different reason: they spawn real subprocesses / do
  # real I/O (E2E tests, `ipe_backend_rust::project`'s `rustfmt` spawn, the
  # runtime's HTTP/DB/websocket kernels), which Miri can't interpret at all —
  # `posix_spawn` is an unsupported foreign call under Miri.
  miri:
    runs-on: ubuntu-latest
    # Fail-fast: don't start the slow miri interpretation if the workspace does
    # not even compile (quick-check is red). Only reachable off the PR path.
    needs: [changes, quick-check]
    if: github.event_name != 'pull_request'   # off the PR gate; runs on push, nightly
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
      - run: cargo +nightly miri test -p ipe_intern -p ipe_ir -p ipe_types -p ipe_lower -p ipe_diagnostics
        env:
          MIRIFLAGS: -Zmiri-disable-isolation

  # E2E builds+runs the emitted Rust per golden (THE SEAL — the soundness floor:
  # every `ipe`-exit-0 golden's emitted Cargo project must `cargo build` + run).
  # Sharded across 6 runners via nextest partitioning. Each golden self-anchors
  # its behaviour against a captured `expected.txt` (the Ipê-native regression
  # anchor). The cached expected_go.txt / oracle.meta Go oracle is retired.
  #
  # The Ipê runtime lives IN-REPO at src/runtime/rust/src (the `ipe-runtime-rust`
  # crate); `ipe::resolve_runtime()` finds it by walking up from the repo root, so
  # no separate vendoring step is required. IPE_RUNTIME_DIR is set explicitly as a
  # belt-and-braces (CWD-independent under nextest).
  #
  # Per-test timeout: the `ci` nextest profile (.config/nextest.toml) sets a 600s
  # terminate budget per test. Tests that drive a real `cargo build` with no shared
  # target (watch_integration, webview_e2e) need up to 4 minutes for a cold build
  # on a loaded runner — the default 120s nextest-partition limit kills them on
  # scheduler contention, not on a real regression.
  #
  # GATING. The oracle.meta → expected.txt migration is complete: every golden
  # that calls assert_go_parity has a matching expected.txt, and the full E2E
  # suite passes locally (207 expected.txt files, 0 oracle.meta). A SEAL
  # regression now fails CI as it should.
  e2e:
    runs-on: ubuntu-latest
    # off the PR gate (seal-smoke is the PR proxy); runs on push, nightly, and
    # push/nightly gate. Fail-fast on a non-compiling tree.
    needs: [changes, quick-check]
    if: github.event_name != 'pull_request'
    env:
      RUSTFLAGS: -C link-arg=-fuse-ld=mold
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: rui314/setup-mold@v1
      # The shard driver is `cargo nextest run`; the runner has no nextest unless
      # this installs it (every other nextest-driven job installs it too).
      - uses: taiki-e/install-action@nextest
      - uses: mozilla-actions/sccache-action@v0.0.9
      # Cache the shared emitted-crate target across runs so the runtime dep tree
      # (axum/tokio/sqlx/serde) stays warm and each shard's goldens link
      # incrementally instead of cold-building it. Keyed per shard by rust-cache.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-directories: ${{ github.workspace }}/.cache/oracle-shared-target
      # Reclaim runner disk before the E2E build: each emitted golden crate pulls
      # the full runtime dep tree (axum/tokio/sqlx/serde) into the shared target.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/share/swift || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL /opt/microsoft /opt/google/chrome /opt/az || true
          sudo swapoff -a || true; sudo rm -f /swapfile /mnt/swapfile || true
          sudo apt-get clean || true
          df -h /
      # wry 0.55 (Webview runtime) requires GLib/GTK/WebKitGTK on Linux.
      # Without these the `bare_html_view_cargo_builds` E2E golden fails when
      # cargo tries to link the emitted Webview project — pkg-config cannot find
      # gobject-2.0 and the build exits non-zero (THE SEAL breach in CI only,
      # not in the emitter).
      - name: Install webview link deps (wry/tao — GLib/GTK/WebKit)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev
      - name: E2E shard ${{ matrix.shard }}/6 (THE SEAL — build+run emitted Rust)
        env:
          IPE_E2E: "1"
          IPE_RUNTIME_DIR: ${{ github.workspace }}/src/runtime/rust/src
          # Without this, `tools/oracle`'s `resolve_emitted_target` fail-safe
          # default (isolate) means EVERY golden's emitted crate builds into its
          # own throwaway `target/` under `CARGO_TARGET_TMPDIR`, each compiling
          # the full runtime dep tree (tokio/hyper/rsa/chrono/…) from scratch —
          # the per-golden trees accumulate unbounded across a shard's ~100+
          # goldens and exhaust runner disk (regex-automata/zerocopy ENOSPC).
          # An absolute path here opts every emitted build in this shard into
          # ONE target, so the dep tree compiles once and every later golden
          # only links its own `main.rs`.
          IPE_ORACLE_SHARED_TARGET: ${{ github.workspace }}/.cache/oracle-shared-target
        run: cargo nextest run --workspace --profile ci --no-fail-fast --partition count:${{ matrix.shard }}/6

  # Stable aggregation gate for the sharded SEAL. The `e2e` matrix expands to six
  # shard-named jobs, so no single shard name is a durable required-check target
  # and a `fail-fast: false` shard failure is easy to miss. This job depends on
  # every shard and is GREEN only when all six passed — one stable context name
  # (`e2e-all`) branch protection can require so a SEAL regression blocks a
  # landing. The `always()` guard makes a skipped/failed/cancelled shard a
  # FAILURE here, never a false green; a legitimate skip (the `e2e` matrix itself
  # self-skips on pull_request) passes vacuously so the PR path is unaffected.
  # A bare, stable `name` so the required-check context is exactly `e2e-all`
  # (branch protection matches the check name literally; a parenthetical would
  # make the required-context string brittle).
  e2e-all:
    name: e2e-all
    runs-on: ubuntu-latest
    needs: e2e
    if: always()
    steps:
      - name: Gate on every e2e shard result
        run: |
          result='${{ needs.e2e.result }}'
          case "$result" in
            success)
              echo "e2e-all: every shard passed — THE SEAL holds."
              ;;
            skipped)
              # The e2e matrix self-skips on pull_request (seal-smoke is the PR
              # proxy); nothing to aggregate, so this passes vacuously.
              echo "e2e-all: e2e shards skipped for this event — vacuously green."
              ;;
            *)
              echo "e2e-all FAILED: e2e shards result=$result (a SEAL regression or an infra failure)" >&2
              exit 1
              ;;
          esac

  # ── PR anti-rot SEAL slice ────────────────────────────────────────────────
  # The full `e2e` matrix (THE SEAL — build+run every emitted golden) runs only
  # on push, so a golden or seal that an `ipe`-accepted program no
  # longer cargo-builds could merge green and only redden main after the fact.
  # This job runs ONE representative slice of THE SEAL on every code PR: the
  # `seal_modset` binary (the compact per-shape emit→build proof) plus a single
  # 1/6 partition of the golden E2E suite. That is enough surface to catch an
  # emit/const-fold/golden regression pre-merge (the classes this guard exists
  # for), while a single shard bounds PR wall-clock — the full 6-shard matrix +
  # tier2 jails stay on push where wall-clock is not on the developer's critical
  # path. Change-gated on `code`; always runs on push/nightly.
  seal-slice:
    name: seal-slice (PR SEAL anti-rot — one e2e shard)
    runs-on: ubuntu-latest
    needs: [changes, quick-check]
    if: needs.changes.outputs.code == 'true' || github.event_name != 'pull_request'
    env:
      RUSTFLAGS: -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: rui314/setup-mold@v1
      - uses: taiki-e/install-action@nextest
      - uses: mozilla-actions/sccache-action@v0.0.9
      - uses: Swatinem/rust-cache@v2
        with:
          cache-directories: ${{ github.workspace }}/.cache/oracle-shared-target
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/share/swift || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL /opt/microsoft /opt/google/chrome /opt/az || true
          sudo swapoff -a || true; sudo rm -f /swapfile /mnt/swapfile || true
          sudo apt-get clean || true
      # The webview goldens link wry/tao; without GTK/WebKit the emitted Webview
      # project fails to cargo-build (a CI-only SEAL breach).
      - name: Install webview link deps (wry/tao — GLib/GTK/WebKit)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev
      - name: SEAL slice (seal_modset + golden e2e shard 1/6)
        env:
          IPE_E2E: "1"
          IPE_RUNTIME_DIR: ${{ github.workspace }}/src/runtime/rust/src
          IPE_ORACLE_SHARED_TARGET: ${{ github.workspace }}/.cache/oracle-shared-target
        run: |
          cargo nextest run -p ipe -E 'binary(seal_modset)' --profile ci
          cargo nextest run --workspace --profile ci --no-fail-fast --partition count:1/6 \
            -E 'not test(build_run_column_over_a_representative_slice)'

  # Vendored-emit SEAL gate: runs the `seal_modset` suite under the vendored
  # runtime-source emit model (`IPE_RUNTIME_VENDORED=1`). The normal e2e shards
  # always use the dependency model, so a missing Cargo feature flag in the
  # vendored manifest (e.g. `"jwt"` absent from `default = [...]`) silently
  # compiles out `#[cfg(feature = "jwt")]`-gated items and causes E0425 at cargo
  # build — a SEAL breach invisible to the dep-model gate. This job makes that
  # class of break visible and blocking.
  #
  # Runs on push/nightly (like `e2e`); off the PR gate since each
  # shape does a full `cargo build`. `seal-smoke` is the fast PR proxy.
  seal-modset-vendored:
    name: seal-modset (vendored emit model)
    runs-on: ubuntu-latest
    needs: [changes, quick-check]
    if: github.event_name != 'pull_request'
    env:
      RUSTFLAGS: -C link-arg=-fuse-ld=mold
      IPE_RUNTIME_DIR: ${{ github.workspace }}/src/runtime/rust/src
      IPE_E2E: "1"
      IPE_RUNTIME_VENDORED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: rui314/setup-mold@v1
      - uses: mozilla-actions/sccache-action@v0.0.9
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: Run seal_modset under the vendored emit model
        run: |
          cargo nextest run -p ipe \
            -E 'binary(seal_modset)' \
            --profile ci

  # macOS Tier-2 native-code enforcement — the ONLY real verification of the
  # macOS jail's deny behaviour. The Rust unit tests prove the SBPL LOWERING on
  # any host, but only a real macOS runner exercises `sandbox-exec`. This job is
  # that proof, and it is fail-closed by design:
  #
  #   1. It asserts `sandbox-exec` is present and REFUSES to certify (exits non-
  #      zero) if it is absent — never a skip-green. An un-run jail is never
  #      counted as vouching (ADR 0046 refuse-to-certify).
  #   2. It runs the admission enforce-vs-control DUALITY: the forbidden net +
  #      fs-escape actions must SUCCEED outside the jail (positive control) and be
  #      DENIED inside it (enforce). The control proves a denial came from the
  #      jail, not from an unreachable host — so a "clean" Tier-2 result can never
  #      be a false pass from a broken/unreachable jail.
  #   3. It runs the `audit_native` E2E under `IPE_E2E=1`, which drives the real
  #      reconciler through the real `sandbox-exec` jail (the macOS `build_in_jail`
  #      path): a used-but-undeclared axis rejects naming the axis, and a benign
  #      package declaring exactly its axes certifies.
  macos-tier2:
    name: macos-tier2 (sandbox-exec — the real macOS jail proof)
    runs-on: macos-latest
    if: github.event_name != 'pull_request'   # off the PR gate; runs on push, nightly
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.9
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest

      # Fail-closed primitive check: an absent sandbox-exec is a hard failure, not
      # a skip — the macOS jail cannot be verified without it, and an unverified
      # platform is NEVER counted as admitted (refuse-to-certify).
      - name: Assert the macOS jail primitive is present (refuse-to-certify)
        run: |
          if ! command -v sandbox-exec >/dev/null 2>&1; then
            echo "ERROR: sandbox-exec absent on this macOS runner — the Tier-2 jail cannot be verified; refusing to certify (this is a hard failure, never a skip-green)." >&2
            exit 1
          fi
          echo "sandbox-exec present: $(command -v sandbox-exec)"

      - name: Make admission scripts executable
        run: chmod +x tools/scripts/admission/jail-macos.sh tests/fixtures/admission/untrusted-build.sh

      # Positive control (OUTSIDE the jail): the same net + fs-escape actions must
      # SUCCEED, so a block under `enforce` below can only be the jail — not an
      # unreachable host or an already-unwritable path.
      - name: Admission positive control (no jail — forbidden actions must succeed)
        env:
          ESCAPE_PATH: ${{ github.workspace }}/admission-escape-probe
        run: PROBE_MODE=control ESCAPE_PATH="$ESCAPE_PATH" sh tests/fixtures/admission/untrusted-build.sh

      # Enforce (INSIDE the jail): net + fs-escape must be DENIED. Paired with the
      # control above, this is the duality that proves the denial is the jail's.
      - name: Admission enforce (jailed — forbidden actions must be blocked)
        env:
          ADMISSION_TIMEOUT_SECS: '60'
          ESCAPE_PATH: ${{ github.workspace }}/admission-escape-probe
        run: tools/scripts/admission/jail-macos.sh tests/fixtures/admission/untrusted-build.sh

      # The real reconciler through the real sandbox-exec jail (the macOS
      # build_in_jail path): used-but-undeclared rejects, benign certifies.
      - name: audit_native E2E through the real macOS jail
        env:
          IPE_E2E: "1"
          IPE_RUNTIME_DIR: ${{ github.workspace }}/src/runtime/rust/src
        run: cargo nextest run -p ipe --test audit_native --profile ci

  # ─── Linux x64 Tier-2 proof (the bwrap+seccomp build jail) ───────────────────
  # linux-x64 is a wired, CERTIFYING Tier-2 platform: the Linux bwrap+seccomp
  # build jail is `target_arch = "x86_64"`-gated (the seccomp BPF encodes the
  # x86_64 syscall-number ABI), so this is the arch that genuinely confines and
  # certifies a native package. The reconciler's linux-x64 audit_native E2E runs
  # inside the sharded `e2e` job, but only as part of a `--workspace` sweep — it
  # is not a named, dedicated, fail-closed Tier-2 job the way every OTHER shipped
  # platform (macos, freebsd, arm64) has. That asymmetry is a blind spot against
  # the "a platform not run is never admitted" invariant (ADR 0046 refuse-to-
  # certify): a change that silently stopped exercising the linux-x64 jail would
  # not redden a platform-named check. This job closes it, mirroring macos-tier2,
  # and is fail-closed by design:
  #
  #   1. It asserts the jail primitives (bwrap + python3 for the seccomp filter)
  #      are present and REFUSES to certify (exits non-zero) if either is absent —
  #      never a skip-green. An un-run jail is never counted as admitting.
  #   2. It runs the admission enforce-vs-control DUALITY: the forbidden net +
  #      fs-escape actions must SUCCEED outside the jail (positive control) and be
  #      DENIED inside the seccomp+bwrap jail (enforce). The control proves a
  #      denial came from the jail, not from an unreachable host.
  #   3. It runs the `audit_native` E2E under `IPE_E2E=1`, which drives the real
  #      reconciler through the real bwrap+seccomp jail (the linux-x64
  #      build_in_jail path): a used-but-undeclared axis rejects, and a benign
  #      package declaring exactly its axes certifies as linux-x64.
  linux-x64-tier2:
    name: linux-x64-tier2 (bwrap+seccomp — the real Linux jail proof)
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'   # off the PR gate; runs on push, nightly
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.9
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest

      - name: Install the Linux jail primitives (bubblewrap + python3)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap python3

      # Fail-closed primitive check: an absent bwrap or python3 is a hard failure,
      # not a skip — the seccomp+bwrap jail cannot be verified without them, and an
      # unverified platform is NEVER counted as admitted (refuse-to-certify).
      - name: Assert the Linux jail primitives are present (refuse-to-certify)
        run: |
          if ! command -v bwrap >/dev/null 2>&1; then
            echo "ERROR: bubblewrap (bwrap) absent on this runner — the Tier-2 jail cannot be verified; refusing to certify (this is a hard failure, never a skip-green)." >&2
            exit 1
          fi
          if ! command -v python3 >/dev/null 2>&1; then
            echo "ERROR: python3 absent — the seccomp BPF filter cannot be generated, so the network-denial layer cannot be established; refusing to certify (hard failure, never a skip-green)." >&2
            exit 1
          fi
          echo "bwrap present: $(command -v bwrap); python3 present: $(command -v python3)"

      - name: Make admission scripts executable
        run: chmod +x tools/scripts/admission/jail-linux.sh tests/fixtures/admission/untrusted-build.sh

      # Positive control (OUTSIDE the jail): the same net + fs-escape actions must
      # SUCCEED, so a block under `enforce` below can only be the jail — not an
      # unreachable host or an already-unwritable path.
      - name: Admission positive control (no jail — forbidden actions must succeed)
        env:
          ESCAPE_PATH: ${{ github.workspace }}/admission-escape-probe
        run: PROBE_MODE=control ESCAPE_PATH="$ESCAPE_PATH" sh tests/fixtures/admission/untrusted-build.sh

      # Enforce (INSIDE the jail): net + fs-escape must be DENIED. Paired with the
      # control above, this is the duality that proves the denial is the jail's.
      # `sudo -E` matches the admission-sandbox linux invocation (bwrap needs the
      # user-namespace setup the hosted runner grants under sudo); -E forwards the
      # ESCAPE_PATH/timeout env into the jail wrapper.
      - name: Admission enforce (jailed — forbidden actions must be blocked)
        env:
          ADMISSION_TIMEOUT_SECS: '60'
          ESCAPE_PATH: ${{ github.workspace }}/admission-escape-probe
        run: sudo -E tools/scripts/admission/jail-linux.sh tests/fixtures/admission/untrusted-build.sh

      # The real reconciler through the real bwrap+seccomp jail (the linux-x64
      # build_in_jail path): used-but-undeclared rejects, benign certifies.
      - name: audit_native E2E through the real Linux jail
        env:
          IPE_E2E: "1"
          IPE_RUNTIME_DIR: ${{ github.workspace }}/src/runtime/rust/src
        run: cargo nextest run -p ipe --test audit_native --profile ci

  # macOS RUN-jail enforcement — the ONLY real verification of the macOS run
  # jail's deny behaviour (the jail around the EMITTED app at `ipe run`, as
  # opposed to the Tier-2 build jail above). The Rust unit tests prove the SBPL
  # LOWERING on any host, but only a real macOS runner exercises the
  # `sandbox-exec` run jail. This job drives the RUN jail through the SAME
  # `sbpl_from_profile` the production `exec_in_run_jail` macOS arm uses (one SBPL
  # source, no fork), and is fail-closed by design:
  #
  #   1. It asserts `sandbox-exec` is present and REFUSES to certify (exits non-
  #      zero) if it is absent — never a skip-green. An un-run jail is never
  #      counted as vouching for the run-jail deny behaviour.
  #   2. It runs the run_jail_macos_e2e enforce-vs-control DUALITY: a net connect
  #      and an out-of-scratch write must SUCCEED unjailed (control) and be DENIED
  #      under the profile's run jail (enforce), so a denial can only be the jail's
  #      — never an unreachable host or an already-unwritable path.
  macos-run-jail:
    name: macos-run-jail (sandbox-exec — the real macOS run-jail proof)
    runs-on: macos-latest
    if: github.event_name != 'pull_request'   # off the PR gate; runs on push, nightly
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.9
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest

      # Fail-closed primitive check: an absent sandbox-exec is a hard failure, not
      # a skip — the run jail cannot be verified without it, and an unverified
      # platform is NEVER counted as jail-holds (refuse-to-certify).
      - name: Assert the macOS jail primitive is present (refuse-to-certify)
        run: |
          if ! command -v sandbox-exec >/dev/null 2>&1; then
            echo "ERROR: sandbox-exec absent on this macOS runner — the run jail cannot be verified; refusing to certify (this is a hard failure, never a skip-green)." >&2
            exit 1
          fi
          echo "sandbox-exec present: $(command -v sandbox-exec)"

      # The run jail's enforce-vs-control duality through the real sandbox-exec
      # jail: an undeclared net connect / out-of-scratch write is DENIED under the
      # jail while the same action SUCCEEDS under control, and a granted axis is
      # not false-denied. IPE_E2E=1 arms the real jailed runs.
      - name: run_jail_macos E2E through the real macOS run jail
        env:
          IPE_E2E: "1"
        run: cargo nextest run -p ipe_sandbox --test run_jail_macos_e2e --profile ci

  # ─── Windows run-jail proof (the RUNTIME jail, not the build jail) ───────────
  # The security half of the SEAL on Windows: a REAL proof of the Windows run
  # jail's deny behaviour (the jail around the EMITTED app at `ipe run`). The
  # Windows arm assembles its confinement from Win32 kernel primitives — a Job
  # Object (subprocess), an AppContainer lowbox token (filesystem + network), and
  # a launcher-side environment scrub (env). The Rust unit tests prove the pure
  # pieces (the env scrub, the UTF-16 block, the active-process cap) on any host;
  # only a real Windows runner exercises the kernel objects.
  #
  # Crucially this needs NO Docker Windows container daemon (unlike the separate
  # admission/build-jail windows-x64 job, which does and is a documented skip on
  # hosted runners): a Job Object / AppContainer / restricted token is a plain
  # Win32 API sequence, so the RUNTIME run jail is provable on a hosted
  # `windows-2022` runner. The job is fail-closed by design:
  #
  #   1. It asserts the run-jail primitives are constructible and REFUSES to
  #      certify (exits non-zero) if they are not — never a skip-green.
  #   2. It runs the run_jail_windows_e2e enforce-vs-control DUALITY per axis:
  #      a child spawn / out-of-scratch write / non-allowlisted env var / outbound
  #      connect must behave one way under the jail and the opposite under control,
  #      so a denial can only be the jail's — never an unreachable host or an
  #      already-unwritable path.
  #
  # Hosted-provable axes: subprocess, env, filesystem, and the ENFORCE half of
  # network. The network POSITIVE control (a connect that must succeed unjailed)
  # needs real outbound egress; if the hosted runner blocks egress the network
  # test skips its own control (design §5.2) and that axis's positive control
  # needs a self-hosted runner. The non-ACL-volume filesystem refuse-gap (design
  # §5.2) also needs a mounted FAT/exFAT volume a hosted image does not provide.
  windows-run-jail:
    name: windows-run-jail (Job Object + AppContainer — the real Windows run-jail proof)
    runs-on: windows-2022
    if: github.event_name != 'pull_request'   # off the PR gate; runs on push, nightly
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.9
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest

      # Fail-closed primitive check: assert the runtime-jail primitives are
      # constructible on this runner. A failure to build a Job Object /
      # AppContainer profile is a hard failure (refuse-to-certify), never a skip —
      # an unverified platform is NEVER counted as jail-holds. PowerShell is the
      # jailed probe host the E2E launches, so its presence is also asserted.
      - name: Assert the Windows run-jail primitives are present (refuse-to-certify)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # A Job Object must be creatable.
          $sig = @'
          using System;
          using System.Runtime.InteropServices;
          public static class J {
            [DllImport("kernel32.dll", SetLastError=true)]
            public static extern IntPtr CreateJobObjectW(IntPtr a, IntPtr b);
            [DllImport("kernel32.dll", SetLastError=true)]
            public static extern bool CloseHandle(IntPtr h);
          }
          '@
          Add-Type -TypeDefinition $sig
          $job = [J]::CreateJobObjectW([IntPtr]::Zero, [IntPtr]::Zero)
          if ($job -eq [IntPtr]::Zero) {
            Write-Error "CreateJobObjectW failed — the Windows run jail cannot be verified; refusing to certify (hard failure, never a skip-green)."
            exit 1
          }
          [void][J]::CloseHandle($job)
          # PowerShell (the jailed probe host) must resolve.
          if (-not (Get-Command powershell.exe -ErrorAction SilentlyContinue)) {
            Write-Error "powershell.exe absent — the run-jail E2E probe cannot run; refusing to certify."
            exit 1
          }
          Write-Output "Windows run-jail primitives present (Job Object creatable; powershell.exe resolved)."

      # The run jail's enforce-vs-control duality through the real Job Object +
      # AppContainer token: an undeclared child spawn / out-of-scratch write /
      # non-allowlisted env var / outbound connect is DENIED under the jail while
      # the same action SUCCEEDS under control, and a granted axis is not
      # false-denied. IPE_E2E=1 arms the real jailed runs.
      - name: run_jail_windows E2E through the real Windows run jail
        env:
          IPE_E2E: "1"
        run: cargo nextest run -p ipe_sandbox --test run_jail_windows_e2e --profile ci

  # ─── Windows Tier-2 BUILD-jail proof (the returning build jail, ADR 0051) ────
  # The differential-confinement half on Windows: a REAL proof of the Windows
  # returning build jail's deny behaviour (`build_in_jail`, not the run jail).
  # The arm reuses the SAME Job Object + AppContainer + launcher-scrub sequence
  # the run jail uses, but RETURNS a decoded `JailOutcome`. Like the run-jail
  # proof this needs NO Docker Windows daemon — a Job Object / AppContainer is a
  # plain Win32 sequence, provable on a hosted `windows-2022` runner. Fail-closed:
  #
  #   1. It asserts the build-jail primitives are constructible and REFUSES to
  #      certify (exits non-zero) if not — never a skip-green. Until this job is
  #      green on a real runner, Windows Tier-2 stays refuse-to-certify
  #      (`build_in_jail` returns `Unavailable`), never admitting unconfined.
  #   2. It runs the build_jail_windows_e2e RED-CANARY: a socket opened while the
  #      declared-scoped jail withholds `network` must decode to
  #      `Denied { axis: Network }` (a differentially-probed axis), an
  #      out-of-scratch write under a filesystem-withholding jail to
  #      `Denied { axis: Filesystem }`, and a benign in-scratch build to `Clean`.
  #      IPE_E2E=1 arms the real jailed runs.
  #
  # The non-ACL-volume filesystem refuse-gap (the `FILE_PERSISTENT_ACLS` probe)
  # is unit-tested host-independently; exercising it live needs a mounted
  # FAT/exFAT volume a hosted image does not provide (a self-hosted runner axis).
  #
  # This job ALSO runs the audit-layer `audit_native` E2E: the reconciler drives
  # the Windows `build_in_jail` through `JailProbeRunner` with a Windows-NATIVE
  # probe wrapper (tests/fixtures/admission/untrusted-build.ps1), invoked as
  # `powershell.exe -File ... -Tier2Axis <axis> ... -- <untrusted build>`
  # (PowerShell is the `CreateProcessW`-invokable interpreter, so the jail runs it
  # directly -- no shell). It certifies a benign package as `windows-x64` and
  # rejects a used-but-undeclared axis, so Windows is a real certifying platform
  # in the audit layer, not only a build-jail deny proof.
  windows-tier2:
    name: windows-tier2 (Job Object + AppContainer — the real Windows build-jail proof)
    runs-on: windows-2022
    if: github.event_name != 'pull_request'   # off the PR gate; runs on push, nightly
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.9
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest

      # Fail-closed primitive check: a Job Object must be creatable and PowerShell
      # (the jailed probe host) must resolve. A failure is refuse-to-certify (hard
      # failure, never a skip-green) — an unverified platform is never admitted.
      - name: Assert the Windows build-jail primitives are present (refuse-to-certify)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sig = @'
          using System;
          using System.Runtime.InteropServices;
          public static class J {
            [DllImport("kernel32.dll", SetLastError=true)]
            public static extern IntPtr CreateJobObjectW(IntPtr a, IntPtr b);
            [DllImport("kernel32.dll", SetLastError=true)]
            public static extern bool CloseHandle(IntPtr h);
          }
          '@
          Add-Type -TypeDefinition $sig
          $job = [J]::CreateJobObjectW([IntPtr]::Zero, [IntPtr]::Zero)
          if ($job -eq [IntPtr]::Zero) {
            Write-Error "CreateJobObjectW failed — the Windows build jail cannot be verified; refusing to certify (hard failure, never a skip-green)."
            exit 1
          }
          [void][J]::CloseHandle($job)
          if (-not (Get-Command powershell.exe -ErrorAction SilentlyContinue)) {
            Write-Error "powershell.exe absent — the build-jail E2E probe cannot run; refusing to certify."
            exit 1
          }
          Write-Output "Windows build-jail primitives present (Job Object creatable; powershell.exe resolved)."

      # The build jail's red-canary through the real Job Object + AppContainer
      # token: a socket under a network-withholding jail decodes to
      # Denied { Network }, an out-of-scratch write to Denied { Filesystem }, and a
      # benign in-scratch build to Clean. IPE_E2E=1 arms the real jailed runs.
      - name: build_jail_windows E2E through the real Windows build jail
        env:
          IPE_E2E: "1"
        run: cargo nextest run -p ipe_sandbox --test build_jail_windows_e2e --profile ci

      # The real reconciler through the real Windows build jail (the audit-layer
      # certify path): the reconciler drives build_in_jail via JailProbeRunner
      # with the Windows-native PowerShell probe wrapper. A used-but-undeclared
      # axis rejects naming the axis, and a benign package declaring exactly its
      # axes certifies as windows-x64 (the certify+reject the macos/freebsd jobs
      # prove on their platforms). IPE_E2E=1 arms the real jailed runs.
      - name: audit_native E2E through the real Windows jail
        env:
          IPE_E2E: "1"
          IPE_RUNTIME_DIR: ${{ github.workspace }}/src/runtime/rust/src
        run: cargo nextest run -p ipe --test audit_native --profile ci

  # ─── FreeBSD Tier-2 BUILD-jail proof (the returning build jail, ADR 0051) ────
  # FreeBSD's differential-confinement half: a REAL proof of the FreeBSD returning
  # build jail (`build_in_jail`), which lowers the axes onto a scratch-rooted
  # jail(2) established via the jail(8) CLI (ip4/ip6=disable for network, an
  # unprivileged jail user over a chowned scratch for filesystem, an rctl
  # maxproc:deny rule for a withheld subprocess axis). No native FreeBSD GitHub
  # runner exists, so this runs inside a vmactions/freebsd-vm VM (root by default,
  # required to create jails), reusing the admission-sandbox freebsd infra.
  # Fail-closed: until this job is green on a real runner, FreeBSD Tier-2 stays
  # refuse-to-certify (`build_in_jail` returns `Unavailable`), never admitting
  # unconfined. The red-canary demands a differentially-probed axis
  # (Denied { Network } / Denied { Filesystem }); a benign build is Clean.
  #
  # This job ALSO runs the audit-layer `audit_native` E2E inside the VM: the
  # reconciler drives the FreeBSD `build_in_jail` through `JailProbeRunner` (the
  # SAME POSIX-shell probe wrapper the Linux/macOS jobs use — FreeBSD has
  # `/bin/sh`), certifying a benign package as `freebsd-x64` and rejecting a
  # used-but-undeclared axis. So FreeBSD is a real certifying platform in the
  # audit layer, not only a build-jail deny proof.
  freebsd-tier2:
    name: freebsd-tier2 (jail(8) inside vmactions VM — the real FreeBSD build-jail proof)
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'   # slow VM boot: push/nightly only
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: build_jail_freebsd E2E through the real FreeBSD build jail
        uses: vmactions/freebsd-vm@v1.5.4
        with:
          usesh: true
          # synctime=false skips the NTP sync that can stall the VM boot on
          # congested GHA runners; clock drift is irrelevant for build-jail proofs.
          synctime: false
          prepare: |
            # Retry pkg install up to 3 times to ride out transient mirror flaps.
            i=0; until pkg install -y rust python3; do
              i=$((i+1)); [ $i -ge 3 ] && exit 1; echo "pkg retry $i/3"; sleep 10
            done
          run: |
            # The vmactions SSH environment does not include /sbin or /usr/sbin in
            # PATH, so FreeBSD system binaries (mount, jail, rctl, mount_nullfs, …)
            # are invisible to `find_in_path()` (which searches PATH only). Prepend
            # the standard FreeBSD sysadmin directories before any Rust code runs.
            export PATH="/sbin:/bin:/usr/sbin:/usr/bin:$PATH"
            # Fail-closed primitive check: jail(8) and rctl(8) must be present, or
            # the FreeBSD build jail cannot be verified — refuse to certify (hard
            # failure, never a skip-green).
            if ! command -v jail >/dev/null 2>&1; then
              echo "ERROR: jail(8) absent — the FreeBSD build jail cannot be verified; refusing to certify." >&2
              exit 1
            fi
            if ! command -v rctl >/dev/null 2>&1; then
              echo "ERROR: rctl(8) absent — a withheld-subprocess jail cannot deny process creation; refusing to certify." >&2
              exit 1
            fi
            # The red-canary through the real jail(8): IPE_E2E=1 arms the runs.
            IPE_E2E=1 cargo test -p ipe_sandbox --test build_jail_freebsd_e2e -- --nocapture
            # The audit-layer certify path through the real jail(8): the reconciler
            # drives the FreeBSD build_in_jail via JailProbeRunner. A used-but-
            # undeclared axis rejects naming the axis (the red-canary), and a benign
            # package declaring exactly its axes certifies as freebsd-x64. IPE_E2E=1
            # arms the real jailed runs; this exercises the certify+reject the
            # windows-2022/macos jobs prove on their platforms.
            IPE_E2E=1 IPE_RUNTIME_DIR="$GITHUB_WORKSPACE/src/runtime/rust/src" \
              cargo test -p ipe --test audit_native -- --nocapture

  # ── Linux arm64 Tier-2 (the fifth shipped platform) ────────────────────────
  # We ship a linux-arm64 binary, but the Linux bwrap+seccomp Tier-2 build-jail
  # arm is `target_arch = "x86_64"`-gated: the seccomp BPF program encodes the
  # x86_64 syscall-number ABI (`subprocess_deny_program` returns `None` on any
  # other arch → fail-closed), so on aarch64 `build_in_jail` falls to the
  # refuse-arm (`JailOutcome::Unavailable`) and `CERTIFIED_PLATFORM` is the
  # `unwired` sentinel. That is SAFE (a native package is never admitted
  # un-confined on arm64), but nothing proved it — the arm64 Tier-2 path was the
  # one shipped platform with no CI at all (the admission-sandbox matrix proves
  # the substrate JAIL SCRIPT on arm64, never the reconciler). ADR 0040 names
  # exactly this "admit for a platform we never exercised" blind spot.
  #
  # This job runs the reconciler's own tests on a NATIVE aarch64 runner and
  # asserts the fail-closed guarantee holds there: the sandbox crate's own unit
  # tests (the pure decode/lowering matrix) pass, and the CLI-level `audit_native`
  # tests confirm a native-bearing package is REFUSED (never silently admitted)
  # on an arch whose jail is unwired. It is NOT an `IPE_E2E` real-jail run — there
  # is deliberately no wired jail to exercise on arm64; the point is to prove the
  # refuse-to-certify path, so a future aarch64 seccomp arm (which would flip this
  # to a real certifying platform) cannot land un-proven.
  linux-arm64-tier2:
    name: linux-arm64-tier2 (fifth platform — fail-closed refuse-to-certify proof)
    runs-on: ubuntu-24.04-arm
    if: github.event_name != 'pull_request'   # off the PR gate; push/nightly
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.9
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest

      # Assert we really are on aarch64 — the whole point is proving the UNWIRED
      # arch's fail-closed path, so a silent runner-arch drift to x86_64 (where a
      # wired jail exists) would defeat the proof. Hard-fail if not aarch64.
      - name: Assert the runner is aarch64 (the unwired Tier-2 arch under test)
        run: |
          arch="$(uname -m)"
          echo "runner arch: $arch"
          if [ "$arch" != "aarch64" ] && [ "$arch" != "arm64" ]; then
            echo "ERROR: expected an aarch64 runner to prove the arm64 fail-closed Tier-2 path, got '$arch'." >&2
            exit 1
          fi

      # The sandbox crate's pure decode/lowering matrix compiles and passes on
      # aarch64 (the returning build jail's typed-outcome + fail-closed decode are
      # arch-independent; the bwrap+seccomp establishment is x86_64-gated and
      # simply refuses here).
      - name: ipe_sandbox unit tests on aarch64
        run: cargo nextest run -p ipe_sandbox --profile ci

      # The CLI-level Tier-2 fail-closed proof: a native-bearing package is
      # REFUSED (never silently admitted) on this unwired arch. NOT IPE_E2E —
      # there is no wired jail to exercise on arm64; this proves the reconciler's
      # refuse-to-certify path holds for the fifth shipped platform.
      - name: audit_native fail-closed refuse-to-certify on aarch64
        env:
          IPE_RUNTIME_DIR: ${{ github.workspace }}/src/runtime/rust/src
        run: cargo nextest run -p ipe --test audit_native --profile ci

  # Drift gate for docs/reference/stdlib.md + docs/reference/stdlib/<Module>.md.
  #
  # Runs the gen-stdlib-docs generator against the committed `.md` files and
  # fails when the output differs, so a doc-string edit that is not reflected
  # in the committed generated docs reddens the build (no silent drift).
  #
  # Change-gated: the `.ipe` veneers live under src/** (already in the `code`
  # filter), so a pure prose-only PR skips this vacuously; it always runs on
  # push/nightly.
  stdlib-docs-drift:
    runs-on: ubuntu-latest
    needs: [changes, quick-check]
    if: needs.changes.outputs.code == 'true' || github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.9
      - uses: Swatinem/rust-cache@v2
      - name: Regenerate docs/reference/stdlib.md and docs/reference/stdlib/
        run: cargo run -p ipe_docs --bin gen-stdlib-docs -- --repo-root "${{ github.workspace }}"
      - name: Fail if generated docs differ from committed files
        run: git diff --exit-code docs/reference/stdlib.md docs/reference/stdlib/

  # Drift gate for docs/reference/env.md.
  #
  # Runs the gen-env-docs generator against the committed file and fails when
  # the output differs, so an env-var read-site change that is not reflected
  # in the committed reference reddens the build (no silent drift).
  #
  # Change-gated: env-var reads live under src/** (already in the `code`
  # filter), so a pure prose-only PR skips this vacuously; it always runs on
  # push/nightly.
  env-docs-drift:
    runs-on: ubuntu-latest
    needs: [changes, quick-check]
    if: needs.changes.outputs.code == 'true' || github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.9
      - uses: Swatinem/rust-cache@v2
      - name: Regenerate docs/reference/env.md
        run: cargo run -p ipe_docs --bin gen-env-docs -- --repo-root "${{ github.workspace }}"
      - name: Fail if generated docs differ from committed files
        run: git diff --exit-code docs/reference/env.md

  # Drift gate for docs/reference/capabilities.md.
  #
  # Runs the gen-capabilities-docs generator against the committed file and
  # fails when the output differs, so a new Capability variant that is not
  # reflected in the committed reference reddens the build (no silent drift).
  #
  # Change-gated: capability.rs lives under src/** (already in the `code`
  # filter), so a pure prose-only PR skips this vacuously; it always runs on
  # push/nightly.
  capabilities-docs-drift:
    runs-on: ubuntu-latest
    needs: [changes, quick-check]
    if: needs.changes.outputs.code == 'true' || github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.9
      - uses: Swatinem/rust-cache@v2
      - name: Regenerate docs/reference/capabilities.md
        run: cargo run -p ipe_docs --bin gen-capabilities-docs -- --repo-root "${{ github.workspace }}"
      - name: Fail if generated docs differ from committed files
        run: git diff --exit-code docs/reference/capabilities.md

  # Headless-browser behaviour gate for Ipe.Browser.Geolocation +
  # Ipe.Browser.Clipboard — the three flows a raw TcpStream HTTP test cannot
  # exercise (browser permission grant/deny + JS API round-trips):
  #
  #   1. Geo GRANT  — grantPermissions(['geolocation']) + setGeolocation →
  #      click "Locate" → model renders "location: <lat>, <lng>" (Ok path).
  #   2. Geo DENY   — no permission grant → click "Locate" → model renders
  #      "location: error: ..." (typed Err, not a blank or crash).
  #   3. Clipboard  — grantPermissions(['clipboard-read','clipboard-write']) →
  #      Locate → "Copy location" → "Paste" → model renders the same coords
  #      on the "clipboard:" line (write+read round-trip).
  #
  # Off the PR gate (like `e2e`); runs on push to main and nightly.
  # The `browser-e2e` job is the ONLY gate that proves the Ipe.Browser.*
  # port-glue JS actually drives the browser APIs end-to-end — the Rust
  # build-only test in live_e2e.rs (`geo_clipboard_browser_build_only`) proves
  # the emit pipeline, but not the runtime JS behaviour.
  browser-e2e:
    name: browser-e2e (Ipe.Browser geo+clipboard — headless Playwright)
    runs-on: ubuntu-latest
    needs: [changes, quick-check]
    if: github.event_name != 'pull_request'
    env:
      RUSTFLAGS: -C link-arg=-fuse-ld=mold
      IPE_RUNTIME_DIR: ${{ github.workspace }}/src/runtime/rust/src
      IPE_GEO_CLIPBOARD_PORT: "18080"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: rui314/setup-mold@v1
      - uses: mozilla-actions/sccache-action@v0.0.9
      - uses: Swatinem/rust-cache@v2
        with:
          cache-directories: ${{ github.workspace }}/.cache/browser-e2e-target
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Playwright + Chromium
        working-directory: tools/scripts/browser-e2e
        run: |
          npm install --save-dev @playwright/test
          npx playwright install --with-deps chromium
      - name: Build ipe compiler
        run: cargo build --release -p ipe
      - name: Compile geo-clipboard example
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/.cache/browser-e2e-target
        run: |
          set -euo pipefail
          IPE="$PWD/target/release/ipe"
          OUT="${{ runner.temp }}/geo-clipboard-emitted"
          "$IPE" build examples/shapes/web/geo-clipboard/package.ipe --out "$OUT"
          echo "IPE_GEO_CLIPBOARD_EMITTED=$OUT" >> "$GITHUB_ENV"
      - name: Cargo-build emitted project
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/.cache/browser-e2e-target
        run: |
          set -euo pipefail
          cd "$IPE_GEO_CLIPBOARD_EMITTED"
          cargo build --release
          BIN="$(find target/release -maxdepth 1 -type f -perm /111 ! -name '*.d' | head -1)"
          echo "GEO_CLIPBOARD_BIN=$BIN" >> "$GITHUB_ENV"
      - name: Spawn geo-clipboard server
        run: |
          set -euo pipefail
          IPE_WEB_PORT="$IPE_GEO_CLIPBOARD_PORT" \
          IPE_CSRF=off \
          IPE_CONSOLE_EMBED=off \
          "$GEO_CLIPBOARD_BIN" &
          echo "GEO_SERVER_PID=$!" >> "$GITHUB_ENV"
          for i in $(seq 1 20); do
            if curl -sf "http://127.0.0.1:$IPE_GEO_CLIPBOARD_PORT/" >/dev/null 2>&1; then
              echo "server ready (attempt $i)"; break
            fi
            sleep 0.5
          done
      - name: Run Playwright spec (geo + clipboard)
        working-directory: tools/scripts/browser-e2e
        run: npx playwright test --config playwright.config.mjs
      - name: Kill server
        if: always()
        run: kill "$GEO_SERVER_PID" 2>/dev/null || true
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-e2e-screenshots
          path: tools/scripts/browser-e2e/artifacts/
          if-no-files-found: warn
          retention-days: 7
