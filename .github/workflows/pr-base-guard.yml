name: PR base guard

# Contributor PRs must integrate through `development`, never straight into
# `main`. `main` accepts only the deliberate promotion PR (head=development)
# and release-please PRs. Any other PR based on `main` is auto-retargeted to
# `development`; if retarget fails the check fails closed, blocking the merge.
on:
  pull_request_target:
    types: [opened, reopened, edited]
    branches: [main]

permissions:
  pull-requests: write

concurrency:
  group: pr-base-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  guard:
    name: pr-base-guard
    runs-on: ubuntu-latest
    steps:
      - name: Enforce PR base
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          NUM: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail

          # Allowlist: promotion PR + release-please, both same-repo.
          if [ "$HEAD_REPO" = "$REPO" ]; then
            case "$HEAD" in
              development|release-please--*)
                echo "Allowed base=main for head '$HEAD'."
                exit 0 ;;
            esac
          fi

          echo "PR #$NUM (head '$HEAD') targets main — retargeting to development."
          if gh api -X PATCH "repos/$REPO/pulls/$NUM" -f base=development >/dev/null; then
            gh pr comment "$NUM" --repo "$REPO" --body \
              "Auto-retargeted this PR from \`main\` to \`development\`. Everyday work integrates through \`development\`; \`main\` takes only the promotion PR and release-please. See AGENTS.md » PR workflow."
            echo "Retargeted PR #$NUM to development."
            exit 0
          fi

          echo "::error::Could not retarget PR #$NUM off main. Base must be development."
          exit 1
