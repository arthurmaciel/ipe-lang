# ─────────────────────────────────────────────────────────────────────────────
# Static-compilation gate (design: docs/architecture/static-compilation.md).
#
# Proves the `--static` path end to end, per allocator arm:
#   1. the typed refusal + emit-shape tests (`static_emit.rs`, incl. the
#      IPE_E2E_STATIC musl build/run/ldd proof on the dlmalloc leg);
#   2. a CLI-driven `ipe build --static` of a real example, cargo-built
#      standalone for x86_64-unknown-linux-musl with CWD = the emitted crate
#      dir (cargo discovers the generated .cargo/config.toml from CWD);
#   3. `file` + `ldd` assertions — static-ness is asserted, never assumed;
#   4. execution inside a `scratch` container: nothing in the filesystem but
#      the binary itself, so a hidden runtime dependency (dynamic loader,
#      libssl, host cert store, /etc/*) fails loudly here;
#   5. supply-chain: `cargo audit` over the emitted crate's lockfile — static
#      linking freezes every dep into the artifact, so the advisory gate must
#      cover the exact frozen set — with the lockfile uploaded as the
#      version-manifest artifact.
#
# Matrix: dlmalloc (the pure-Rust default) and mimalloc (the explicit C
# opt-in — kept green so the acknowledged path cannot rot).
# ─────────────────────────────────────────────────────────────────────────────
name: static

# The `--static` musl proof (build + scratch-container run + advisory audit of
# the frozen lockfile) is a slow gate — a POST-MERGE / nightly check, OFF the
# required PR path. Runs on push to the main branches and nightly; not on
# pull_request.
on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
  schedule:
    - cron: '52 4 * * *'      # nightly, offset from ci.yml / security.yml / examples-sweep
  workflow_dispatch: {}

concurrency:
  group: static-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux-static-x64:
    name: linux-static-x64 (${{ matrix.allocator }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        allocator: [dlmalloc, mimalloc]

    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.cache/ipe-lang-target
      IPE_NO_SCCACHE: '1'
      STATIC_TRIPLE: x86_64-unknown-linux-musl
      CARGO_HTTP_MULTIPLEXING: 'false'
      CARGO_NET_RETRY: '5'

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      # The emitted dep graph carries C compile units (zstd, ring) — the
      # preflight requires a musl-capable C compiler; mimalloc adds its own.
      - name: Install musl C toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Cache cargo target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ${{ github.workspace }}/.cache/ipe-lang-target
          key: ${{ runner.os }}-static-${{ matrix.allocator }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-static-${{ matrix.allocator }}-
            ${{ runner.os }}-static-

      - name: Build ipe
        run: cargo build --release -p ipe

      # Refusal negatives + emit shape + (dlmalloc leg) the gated musl
      # build/run/ldd e2e, including `ipe run --static`.
      - name: Static gates (refusals, emit shape, e2e)
        env:
          IPE_E2E_STATIC: ${{ matrix.allocator == 'dlmalloc' && '1' || '' }}
        run: cargo test -p ipe --test static_emit

      - name: ipe build --static (example, ${{ matrix.allocator }})
        run: |
          cd examples/01-hello-world
          "$CARGO_TARGET_DIR/release/ipe" build ipe.toml --out out/rust \
            --static --allocator ${{ matrix.allocator }}
          cd out/rust
          cargo build --release --target "$STATIC_TRIPLE"

      - name: Assert static-ness (file + ldd)
        run: |
          BIN="$CARGO_TARGET_DIR/$STATIC_TRIPLE/release/ipe-app"
          file "$BIN"
          file "$BIN" | grep -Eq 'static-pie linked|statically linked'
          LDD_OUT="$(ldd "$BIN" 2>&1 || true)"
          echo "$LDD_OUT"
          echo "$LDD_OUT" | grep -Eq 'statically linked|not a dynamic executable'

      # The zero-runtime-deps proof: a `scratch` image holds NOTHING but the
      # binary — no loader, no libc, no certs, no /etc. It must still run.
      - name: Run in a scratch container
        run: |
          WORK="$(mktemp -d)"
          cp "$CARGO_TARGET_DIR/$STATIC_TRIPLE/release/ipe-app" "$WORK/"
          printf 'FROM scratch\nCOPY ipe-app /ipe-app\nENTRYPOINT ["/ipe-app"]\n' > "$WORK/Dockerfile"
          docker build -t ipe-static-proof "$WORK"
          OUT="$(docker run --rm ipe-static-proof)"
          echo "scratch output: $OUT"
          echo "$OUT" | grep -q 'Hello from Ipe!'

      # Advisory gate over the FROZEN dependency set (the emitted lockfile is
      # exactly what is baked into the static artifact).
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: cargo audit (emitted lockfile)
        run: cargo audit --file examples/01-hello-world/out/rust/Cargo.lock

      - name: Upload frozen-deps manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-frozen-deps-${{ matrix.allocator }}
          path: examples/01-hello-world/out/rust/Cargo.lock
          if-no-files-found: warn

  # ─── aarch64 static gate ───────────────────────────────────────────────────
  # Requires: `aarch64-unknown-linux-musl` rustup target + a musl-capable
  # AArch64 C linker. On ubuntu-24.04-arm (native ARM64 runner) install
  # `musl-tools`; on x86_64 runners use `gcc-aarch64-linux-gnu` +
  # `musl-cross` (or the musl.cc `aarch64-linux-musl-gcc` tarball).
  # Cross-run verification uses `qemu-user-static`.
  #
  # BLOCKED-PENDING-TOOLCHAIN: this job is wired but marked allow-failure
  # until we confirm a musl-capable aarch64 linker is available on the runner.
  # Remove `continue-on-error` once the toolchain is confirmed green.
  linux-static-arm64:
    name: linux-static-arm64 (dlmalloc)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 45

    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.cache/ipe-lang-target
      IPE_NO_SCCACHE: '1'
      STATIC_TRIPLE: aarch64-unknown-linux-musl
      CARGO_HTTP_MULTIPLEXING: 'false'
      CARGO_NET_RETRY: '5'

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl

      # musl-capable AArch64 C linker + QEMU for cross-run verification.
      # Toolchain: gcc-aarch64-linux-gnu provides the cross-assembler/linker;
      # musl-tools provides musl-libc headers; qemu-user-static enables
      # transparent execution of aarch64 binaries on x86_64.
      - name: Install aarch64 musl C toolchain + QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu musl-tools qemu-user-static

      - name: Cache cargo target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ${{ github.workspace }}/.cache/ipe-lang-target
          key: ${{ runner.os }}-static-arm64-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-static-arm64-

      - name: Build ipe
        run: cargo build --release -p ipe

      - name: ipe build --static --target aarch64-unknown-linux-musl
        run: |
          cd examples/01-hello-world
          "$CARGO_TARGET_DIR/release/ipe" build ipe.toml --out out/rust \
            --static --target aarch64-unknown-linux-musl --allocator dlmalloc
          cd out/rust
          cargo build --release --target "$STATIC_TRIPLE"
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_musl: aarch64-linux-gnu-gcc

      - name: Assert static-ness (file)
        run: |
          BIN="$CARGO_TARGET_DIR/$STATIC_TRIPLE/release/ipe-app"
          file "$BIN"
          file "$BIN" | grep -Eq 'static-pie linked|statically linked|ELF 64-bit LSB.*static'

      - name: Run via QEMU
        run: |
          BIN="$CARGO_TARGET_DIR/$STATIC_TRIPLE/release/ipe-app"
          OUT="$(qemu-aarch64-static "$BIN")"
          echo "qemu output: $OUT"
          echo "$OUT" | grep -q 'Hello from Ipe!'

      - name: Upload frozen-deps manifest (arm64)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-frozen-deps-arm64-dlmalloc
          path: examples/01-hello-world/out/rust/Cargo.lock
          if-no-files-found: warn
