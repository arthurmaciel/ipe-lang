name: nightly-full-gate

# The single scheduled entry point for the nightly HEAVY sweep. It fires the
# "Build & test" workflow (ci.yml) against development HEAD via workflow_dispatch;
# ci.yml's heavy jobs (the full 8-shard e2e, seal-slice, seal-modset, miri, the
# runtime full-feature builds, the explain/doc gates, browser-e2e, the Tier-2
# jails) all key on `github.event_name != 'pull_request'`, so a dispatch runs the
# whole heavy gate on the branch the FF promotion advances from. Keeping the cron
# HERE (not on ci.yml) gives the rerun-failed-once orchestration one named
# workflow to watch, and keeps the nightly trigger in one obvious place.
on:
  # 04:00 UTC == 01:00 America/Sao_Paulo (UTC-3): a quiet-hours slot for the
  # long heavy sweep, off the developer's critical path.
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch: {}

permissions:
  actions: write   # dispatch ci.yml
  contents: read

concurrency:
  group: nightly-full-gate
  cancel-in-progress: false

jobs:
  dispatch-full-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch the heavy gate (Build & test) on development HEAD
        env:
          GH_TOKEN: ${{ secrets.PROMOTE_TOKEN || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "Dispatching 'Build & test' (ci.yml) on development for the nightly heavy sweep."
          gh workflow run "Build & test" --repo "$REPO" --ref development
