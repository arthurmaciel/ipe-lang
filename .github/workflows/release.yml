name: Release

# release-please owns tag + GitHub-release CREATION and the changelog body (see
# release-please.yml). This workflow owns only the 5-platform binary build and
# ATTACHES those assets to the release release-please already published — it
# never creates a release itself, so there is exactly one release object per tag.
#
# Trigger: `release: published`, which fires when release-please publishes the
# release for the tag it just pushed. Keying on the release event (not the tag
# push) guarantees the release object already exists when the upload step runs,
# so `gh release upload` cannot race ahead of its creation. `workflow_dispatch`
# stays for manual rebuilds against an existing release.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build + upload assets to (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Native/cross build per target. Linux is fully-static musl (copy-anywhere,
  # no runtime deps); the others are the platform-native binary.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: ipe-linux-x64
            target: x86_64-unknown-linux-musl
            ext: ''
          - os: ubuntu-24.04-arm
            artifact: ipe-linux-arm64
            target: aarch64-unknown-linux-musl
            ext: ''
          - os: macos-latest
            artifact: ipe-darwin-arm64
            target: aarch64-apple-darwin
            ext: ''
          - os: windows-latest
            artifact: ipe-windows-x64
            target: x86_64-pc-windows-msvc
            ext: '.exe'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Build the tagged commit for both triggers: the release event's tag,
          # or the manually-dispatched tag input.
          ref: ${{ github.event.release.tag_name || github.event.inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install musl toolchain (linux)
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build ipe + ipe-ffi-inspector
        shell: bash
        run: |
          cargo build --release --target ${{ matrix.target }} -p ipe -p ipe-ffi-inspector
          mkdir -p dist
          BIN=target/${{ matrix.target }}/release
          cp "$BIN/ipe${{ matrix.ext }}"               "dist/ipe${{ matrix.ext }}"
          cp "$BIN/ipe-ffi-inspector${{ matrix.ext }}" "dist/ipe-ffi-inspector${{ matrix.ext }}"
          chmod +x dist/* || true
      - name: Smoke-test
        shell: bash
        run: ./dist/ipe${{ matrix.ext }} --version
      - name: Package
        shell: bash
        run: |
          cd dist
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            7z a "${{ matrix.artifact }}.zip" "ipe${{ matrix.ext }}" "ipe-ffi-inspector${{ matrix.ext }}"
          else
            tar czf "${{ matrix.artifact }}.tar.gz" "ipe${{ matrix.ext }}" "ipe-ffi-inspector${{ matrix.ext }}"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ matrix.artifact }}.tar.gz
            dist/${{ matrix.artifact }}.zip
          if-no-files-found: ignore

  # FreeBSD has no native GitHub runner — build + test natively in a VM.
  build-freebsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.event.inputs.tag }}
      - name: Build in FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: pkg install -y rust
          run: |
            cargo build --release -p ipe -p ipe-ffi-inspector
            ./target/release/ipe --version
            mkdir -p dist
            cp target/release/ipe dist/ipe
            cp target/release/ipe-ffi-inspector dist/ipe-ffi-inspector
            tar czf dist/ipe-freebsd-x64.tar.gz -C dist ipe ipe-ffi-inspector
      - uses: actions/upload-artifact@v7
        with:
          name: ipe-freebsd-x64
          path: dist/ipe-freebsd-x64.tar.gz
          if-no-files-found: ignore

  # Assemble assets, checksum, upload them to the release-please-created release.
  #
  # `if: always()` runs this job even when a build leg failed, so every binary
  # that DID build is still published. A failed leg uploaded no artifact; this
  # job attaches whatever artifacts exist, then a completeness gate fails the run
  # LOUDLY for each missing platform — the good binaries ship first, the failure
  # stays visible (red run + `::error::` annotations), never swallowed.
  release:
    needs: [build, build-freebsd]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.event.inputs.tag }}
      # A failed build leg uploaded nothing, so some names may be absent.
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Stage assets + checksums
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} release/ \;
          # Ship the installer alongside the binaries so the one-liner is versioned.
          cp install.sh release/install.sh
          # Checksum only over what is present — a missing leg is not a hole here.
          ( cd release && sha256sum * > SHA256SUMS )
          ls -la release/
      # Attach the binaries that built to the release release-please already
      # created. Upload, not create: the release object and its changelog body
      # already exist. `--clobber` makes a manual workflow_dispatch re-run
      # idempotent (replaces same-named assets instead of erroring).
      - name: Upload assets to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME:-${{ github.event.inputs.tag }}}"
          gh release upload "$TAG" release/* \
            --clobber \
            --repo "${{ github.repository }}"
      # Completeness gate, AFTER the upload so present binaries are already
      # attached. Every expected platform must have staged an artifact; each
      # absent one is a red `::error::` annotation plus a summary line, and the
      # run exits non-zero. Loud but non-blocking: the binaries that built are
      # published; the failure keeps our attention rather than being swallowed.
      - name: Verify every platform published
        run: |
          expected="ipe-linux-x64 ipe-linux-arm64 ipe-darwin-arm64 ipe-windows-x64 ipe-freebsd-x64"
          missing=0
          echo "## Release asset completeness" >> "$GITHUB_STEP_SUMMARY"
          for name in $expected; do
            if ls "release/$name".* >/dev/null 2>&1; then
              echo "- ok: \`$name\`" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error title=Release asset missing::$name did not build; its binary is NOT in this release"
              echo "- MISSING: \`$name\`" >> "$GITHUB_STEP_SUMMARY"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "One or more platform binaries are missing from the release (see annotations above)." >&2
            exit 1
          fi
