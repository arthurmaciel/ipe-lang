name: Playground jail

# Gate: build the playground bundle (ipe-wasm) + jail-runner and run the
# sandbox security tests so a change that breaks either fails CI.
#
# Trigger strategy (mirrors the wasm-floor job in ci.yml):
#   • On PRs: unless the fail-closed classifier (.github/ci/change_class.py,
#     `playground` scope) proves every changed path irrelevant.
#   • On push to main/master and nightly: always.
#
# Two jobs:
#   1. build  — cargo build -p ipe-wasm --target wasm32-unknown-unknown and
#               cargo build -p playground-jail-runner.  Verifies the bundle
#               and jail-runner compile end-to-end.
#   2. sandbox-tests — cargo nextest run -p playground-jail-runner, which
#               includes sandbox_security.rs (gated by IPE_PLAYGROUND_E2E=1
#               when bwrap is available on the runner).

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  schedule:
    - cron: '37 4 * * *'   # nightly, offset from ci.yml
  workflow_dispatch: {}

concurrency:
  group: playground-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  # Change classification: `playground` is `false` only when every changed path
  # is PROSE or an unrelated `src/` tree (.github/ci/change_class.py). Any other
  # path (examples/, .github/, tools/, root files), an unreadable diff, or a
  # classifier crash runs the jail.
  changes:
    # Unique context: a required `changes` shared with ci.yml would be ambiguous.
    name: playground-changes
    runs-on: ubuntu-latest
    outputs:
      # An unset output (classifier crash) reads as `true`: absent proof, run.
      playground: ${{ steps.classify.outputs.playground != 'false' }}
      # `release_only` — normalised to `true`/`false` here, once, so no consumer
      # ever splices the raw writer value into a `run:` script.
      release_only: ${{ steps.release.outputs.release_only == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The tested merge commit and its base parent, for the changed-path diff;
          # a merge-group run needs history back to the queue base.
          fetch-depth: ${{ github.event_name == 'merge_group' && '0' || '2' }}
      # `release_only` — true only for a same-repo PR whose changed files are all
      # release-please version metadata (see .github/ci/release_only.py). Keyed on
      # the diff, never the branch name, so no PR can opt itself out of a tier.
      - name: Classify release-only PR
        id: release
        # A classifier crash leaves the output unset, so every tier runs.
        continue-on-error: true
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: python3 .github/ci/release_only.py
      - name: Classify changed paths
        id: classify
        # A crash leaves the output unset, which the job output reads as `true`.
        continue-on-error: true
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: python3 .github/ci/change_class.py --playground

  # Build the wasm bundle and the jail-runner binary. This is the primary rot
  # guard: a compile break here fails fast without needing bwrap on the runner.
  build:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.playground == 'true' || (github.event_name != 'pull_request' && github.event_name != 'merge_group') || needs.changes.outputs.release_only == 'true'
    timeout-minutes: 20
    steps:
      - name: Release-please version/changelog-only diff — trivial pass
        if: needs.changes.outputs.release_only == 'true'
        run: |
          echo "build: release-please-only diff (the wasm bundle and jail runner read source, not the version string); trivial pass, not a skip."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.changes.outputs.release_only != 'true'
      - uses: ./.github/actions/rust-toolchain-pinned
        if: needs.changes.outputs.release_only != 'true'
        with:
          targets: wasm32-unknown-unknown
      - uses: ./.github/actions/sccache
        if: needs.changes.outputs.release_only != 'true'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: needs.changes.outputs.release_only != 'true'

      - name: Build ipe-wasm (wasm32-unknown-unknown)
        if: needs.changes.outputs.release_only != 'true'
        run: cargo build -p ipe-wasm --target wasm32-unknown-unknown --release

      - name: Build playground-jail-runner
        if: needs.changes.outputs.release_only != 'true'
        run: cargo build -p playground-jail-runner

  # Run the jail-runner unit tests and, when bwrap is available, the full
  # sandbox security proofs (IPE_PLAYGROUND_E2E=1).
  playground-jail:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.playground == 'true' || (github.event_name != 'pull_request' && github.event_name != 'merge_group') || needs.changes.outputs.release_only == 'true'
    timeout-minutes: 20
    env:
      IPE_RUNTIME_DIR: ${{ github.workspace }}/src/runtime/rust/src
    steps:
      - name: Release-please version/changelog-only diff — trivial pass
        if: needs.changes.outputs.release_only == 'true'
        run: |
          echo "playground-jail: release-please-only diff (the jail proofs read source, not the version string); trivial pass, not a skip."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.changes.outputs.release_only != 'true'
      - uses: ./.github/actions/rust-toolchain-pinned
        if: needs.changes.outputs.release_only != 'true'
      - uses: ./.github/actions/sccache
        if: needs.changes.outputs.release_only != 'true'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: needs.changes.outputs.release_only != 'true'
      - uses: taiki-e/install-action@23d41aa71228a2692ee31bb433f070fd4bdc6661 # nextest
        if: needs.changes.outputs.release_only != 'true'

      - name: Install bubblewrap
        if: needs.changes.outputs.release_only != 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends bubblewrap

      - name: Build ipe (needed by sandbox_security.rs emit helpers)
        if: needs.changes.outputs.release_only != 'true'
        run: cargo build -p ipe

      - name: Allow unprivileged user namespaces (bwrap netns)
        if: needs.changes.outputs.release_only != 'true'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Run jail-runner tests (unit + sandbox security proofs)
        if: needs.changes.outputs.release_only != 'true'
        env:
          IPE_BIN: ${{ github.workspace }}/target/debug/ipe
          IPE_PLAYGROUND_E2E: "1"
        run: cargo nextest run -p playground-jail-runner --profile ci
