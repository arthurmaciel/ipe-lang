# ─────────────────────────────────────────────────────────────────────────────
# Ipê playground — build, verify, and publish the in-browser compiler.
#
# The playground (examples/wasm-language-playground) compiles Ipê ENTIRELY in
# the browser: the `ipe-wasm` crate is the compiler frontend built to
# `wasm32-unknown-unknown`. Because that WASM embeds the whole frontend + stdlib,
# it must be rebuilt whenever the compiler changes — so this workflow triggers on
# any compiler-source or playground change, rebuilds the WASM via the example's
# own `build.sh`, and drives the built page in headless Chromium
# (scripts/lib/playground-verify.mjs: boots the compiler, compiles the sample,
# checks theme re-theming + the GitHub link + diagnostics).
#
# On a push to the default branch it also publishes the built playground to
# GitHub Pages, so the live "Ipê playground" always reflects the current
# compiler.
# ─────────────────────────────────────────────────────────────────────────────
name: playground

on:
  push:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'tests/golden/**'
      - 'examples/wasm-language-playground/**'
      - 'scripts/lib/playground-verify.mjs'
      - '.github/workflows/playground.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
  pull_request:
    paths:
      - 'src/**'
      - 'examples/wasm-language-playground/**'
      - 'scripts/lib/playground-verify.mjs'
      - '.github/workflows/playground.yml'
  workflow_dispatch: {}

concurrency:
  group: playground-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    outputs:
      artifact: playground-site
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (with wasm target)
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add wasm32-unknown-unknown

      - name: Install wasm-bindgen-cli (version-matched to the crate)
        run: |
          # Pin to the exact wasm-bindgen version resolved in Cargo.lock so the
          # generated JS glue matches the compiled module's ABI. Reads the
          # version from the lockfile's `[[package]] name = "wasm-bindgen"` block.
          ver="$(awk '/^name = "wasm-bindgen"$/{f=1} f&&/^version = /{gsub(/[",]/,"",$3); print $3; exit}' Cargo.lock)"
          echo "wasm-bindgen version: $ver"
          cargo install wasm-bindgen-cli --version "$ver" --locked

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: playground-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Build the in-browser compiler + JS bindings
        run: bash examples/wasm-language-playground/build.sh

      - name: Install headless-browser verify deps
        working-directory: scripts/lib
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Verify the playground in headless Chromium
        working-directory: scripts/lib
        run: node playground-verify.mjs ../../examples/wasm-language-playground

      - name: Assemble the publishable site
        run: |
          mkdir -p site
          cp -r examples/wasm-language-playground/index.html site/
          cp -r examples/wasm-language-playground/pkg site/pkg

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    # Publish only from the default branch, never from PRs.
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    needs: build-and-verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
