# ─────────────────────────────────────────────────────────────────────────────
# Admission sandbox matrix — per-platform isolation proof harness.
#
# Purpose: for each of the 5 platforms we ship binaries for, run a sample
# "untrusted build" inside that platform's off-the-shelf jail and assert the
# isolation contract holds:
#   • no network (a socket/connect attempt is DENIED)
#   • read-only FS except one scratch dir (a write outside scratch is DENIED)
#   • resource + wall-clock caps
#   • non-root
#   • scrubbed env
#   • a benign build SUCCEEDS inside the jail (no false-deny)
#
# This is the reusable substrate the SP4 admission gate will wrap. It does NOT
# depend on `ipe package audit`; it jails an arbitrary build command and proves
# the jail holds. See docs/architecture/tbd/admission-gate-per-platform-sandbox.md
# and ADRs 0040/0041.
#
# Fail-closed invariant: a jail that cannot establish makes that job RED, never
# green-by-skip. Absence of a jail backend on any platform = that platform is
# not safe to admit for.
#
# Platform jail map (spec §1.1):
#   linux-x64   — container --network none (outer) + bubblewrap (inner); AND-composed
#   linux-arm64 — same layering on ubuntu-24.04-arm runner
#   macos-arm64 — sandbox-exec (Seatbelt SBPL profile)
#   windows-x64 — Docker Windows container, --isolation process, --network none
#   freebsd-x64 — vmactions/freebsd-vm VM + jail(8); reuses release.yml infra
# ─────────────────────────────────────────────────────────────────────────────
name: admission-sandbox

on:
  push:
    branches: [main, master, 'ci/admission-sandbox-matrix']
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'
  schedule:
    - cron: '17 3 * * *'   # nightly, offset from ci.yml / security.yml
  workflow_dispatch: {}

concurrency:
  group: admission-sandbox-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Linux x64 ──────────────────────────────────────────────────────────────
  # Outer layer: docker run --network none (run inside a step, not a container
  # job). GHA's container job model injects its own user-defined network before
  # our options arrive, making --network none conflict
  # ("cannot attach both user-defined and non-user-defined network-modes").
  # Running docker explicitly in a step sidesteps that conflict entirely.
  # Inner layer: bubblewrap (bwrap) read-only rootfs + isolated namespaces,
  # executed inside the --network none container.
  # The two layers are AND-composed; either alone would suffice but both are
  # required (redundancy is the spec's stated intent, not an accident).
  #
  # Note on --unshare-net: GitHub hosted runners deny RTM_NEWADDR inside a
  # user-created netns (same wall that broke static.yml). Network denial is
  # therefore enforced at the outer docker-run --network none layer, NOT via
  # bwrap --unshare-net.
  linux-x64:
    name: linux-x64 (docker --network none + bubblewrap)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Run admission jail (outer docker --network none, inner bwrap)
        env:
          ADMISSION_TIMEOUT_SECS: '60'
        run: |
          # Wrap the entire jail invocation inside a --network none container.
          # --cap-add SYS_ADMIN is required for bwrap bind-mounts as root.
          # The scripts and fixture are bind-mounted read-only from the workspace.
          docker run --rm \
            --network none \
            --cap-drop ALL --cap-add SYS_ADMIN \
            -v "$PWD:/workspace:ro" \
            -w /workspace \
            ubuntu:24.04 \
            sh -c '
              apt-get update -qq &&
              apt-get install -y --no-install-recommends bubblewrap python3 &&
              chmod +x scripts/admission/jail-linux.sh tests/fixtures/admission/untrusted-build.sh &&
              ADMISSION_TIMEOUT_SECS='"$ADMISSION_TIMEOUT_SECS"' \
                scripts/admission/jail-linux.sh tests/fixtures/admission/untrusted-build.sh
            '

  # ── Linux arm64 ────────────────────────────────────────────────────────────
  # Identical layering to linux-x64, on a native arm64 runner.
  linux-arm64:
    name: linux-arm64 (docker --network none + bubblewrap)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Run admission jail (outer docker --network none, inner bwrap)
        env:
          ADMISSION_TIMEOUT_SECS: '60'
        run: |
          docker run --rm \
            --network none \
            --cap-drop ALL --cap-add SYS_ADMIN \
            -v "$PWD:/workspace:ro" \
            -w /workspace \
            ubuntu:24.04 \
            sh -c '
              apt-get update -qq &&
              apt-get install -y --no-install-recommends bubblewrap python3 &&
              chmod +x scripts/admission/jail-linux.sh tests/fixtures/admission/untrusted-build.sh &&
              ADMISSION_TIMEOUT_SECS='"$ADMISSION_TIMEOUT_SECS"' \
                scripts/admission/jail-linux.sh tests/fixtures/admission/untrusted-build.sh
            '

  # ── macOS arm64 ────────────────────────────────────────────────────────────
  # Jail: sandbox-exec(1) with an SBPL profile (Seatbelt).
  # Network is denied at the SBPL level (deny network*).
  # FS writes are restricted to the scratch dir.
  macos-arm64:
    name: macos-arm64 (sandbox-exec / Seatbelt)
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Make scripts executable
        run: chmod +x scripts/admission/jail-macos.sh tests/fixtures/admission/untrusted-build.sh

      - name: Run admission jail
        env:
          ADMISSION_TIMEOUT_SECS: '60'
        run: scripts/admission/jail-macos.sh tests/fixtures/admission/untrusted-build.sh

  # ── Windows x64 ────────────────────────────────────────────────────────────
  # Jail: Docker Windows container with --isolation process --network none.
  # Process-isolation (not Hyper-V) is required because GitHub-hosted runners
  # do not support nested virtualisation.
  #
  # Documented constraint: Docker Windows process-isolation containers require
  # the host and container OS versions to match. windows-2022 runners run
  # Windows Server 2022; servercore:ltsc2022 matches. If process-isolation
  # containers cannot start the docker command fails and the job goes red
  # (fail-closed). See PR status table for the confirmed availability result.
  windows-x64:
    name: windows-x64 (Docker Windows container, process isolation)
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # GHA windows-2022 runners run Moby Engine (not Docker Desktop).
      # Docker is pre-installed; Windows container support requires the
      # Containers feature and the Docker daemon configured to use Windows
      # containers. Check the current daemon OS to detect the mode.
      - name: Confirm Docker daemon is in Windows container mode
        run: |
          $info = docker info --format '{{.OSType}}'
          Write-Host "Docker OS type: $info"
          if ($info -ne 'windows') {
            Write-Error "Docker daemon is not in Windows container mode (got: $info). Windows process-isolation containers require Windows daemon mode. This is a known runner constraint — see PR status table."
            exit 1
          }
        shell: powershell

      # servercore:ltsc2022 ships PowerShell and matches the windows-2022 host OS
      # version (required for process-isolation containers — host and container
      # OS versions must match).
      - name: Pull servercore image
        run: docker pull mcr.microsoft.com/windows/servercore:ltsc2022
        shell: powershell

      - name: Run admission jail
        env:
          ADMISSION_TIMEOUT_SECS: '90'
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/admission/jail-windows.ps1
        shell: powershell

  # ── FreeBSD x64 ────────────────────────────────────────────────────────────
  # No native GitHub FreeBSD runner. Runs inside a vmactions/freebsd-vm VM on
  # an ubuntu host, reusing the same infra as release.yml's build-freebsd job.
  # Jail: FreeBSD jail(8) with ip4=disable ip6=disable (no network) and a
  # read-only rootfs except the scratch dir.
  #
  # The vmactions VM runs as root by default, which is required to create
  # jail(8) instances.
  freebsd-x64:
    name: freebsd-x64 (jail(8) inside vmactions VM)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Run admission jail inside FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: |
            pkg install -y python3
          run: |
            chmod +x scripts/admission/jail-freebsd.sh tests/fixtures/admission/untrusted-build.sh
            ADMISSION_TIMEOUT_SECS=60 \
              scripts/admission/jail-freebsd.sh tests/fixtures/admission/untrusted-build.sh
