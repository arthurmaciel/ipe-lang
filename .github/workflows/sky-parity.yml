# ─────────────────────────────────────────────────────────────────────────────
# Sky non-visual behavior-parity check — nightly + manual dispatch.
#
# For each green, non-go_ffi example with shape in {program, console, server}:
#   1. Builds + exercises the committed ipe/ port (ipe build + cargo build).
#   2. Builds + exercises the same example via the upstream sky binary.
#   3. Compares output per shape:
#        program/console — stdout + exit code per the port's parity field:
#          exact         — byte-identical required
#          normalized    — ISO timestamp / epoch-ms tokens stripped before compare
#          skip          — nondeterministic by design; printed with reason
#        server          — HTTP status code + normalized response body per
#                          scripted request set (verify.json or e2e.json).
#                          Sky↔Ipê brand tokens stripped before body compare.
#
# Sky toolchain: prebuilt per-OS release binary from github.com/anzellai/sky.
# The binary is downloaded by install-sky-toolchain.sh (prefers the tagged release
# asset; no Haskell/Stack build required). The pinned version is encoded in that
# script; update PINNED_VERSION there when the example corpus moves to a new
# upstream release.
#
# This job is NOT a required PR gate (it requires a live sky install and network).
# The fast offline PR gate is sky-ports-gate.yml.
# ─────────────────────────────────────────────────────────────────────────────
name: sky behavior parity (non-visual)

on:
  schedule:
    - cron: '47 5 * * *'    # nightly at 05:47 UTC (offset from other nightly jobs)
  workflow_dispatch: {}

concurrency:
  group: sky-parity-nonvisual-${{ github.ref }}
  cancel-in-progress: true

# Read-only: this job does not push or open PRs.
permissions:
  contents: read

jobs:
  sky-parity-nonvisual:
    name: sky non-visual behavior parity
    runs-on: ubuntu-latest
    # A sky-vs-ipe behavior divergence fails the job.
    continue-on-error: false

    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.cache/ipe-target
      IPE_NO_SCCACHE: '1'
      IPE_SWEEP_BUILD_TIMEOUT: '300'
      IPE_AUTH_TOKEN_SECRET: ipe-ci-parity-test-secret-0123456789-abcdef
      CARGO_HTTP_MULTIPLEXING: 'false'
      CARGO_NET_RETRY: '5'

    steps:
      - uses: actions/checkout@v7

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/share/swift || true
          sudo apt-get clean || true

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .cache/ipe-target
          key: sky-parity-nonvisual-${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            sky-parity-nonvisual-${{ runner.os }}-cargo-
            sky-parity-${{ runner.os }}-cargo-

      - name: Build ipe
        run: |
          export CARGO_TARGET_DIR="${{ github.workspace }}/.cache/ipe-target"
          cargo build --release -p ipe

      - name: Install sky toolchain
        run: |
          mkdir -p ~/.local/bin
          bash tools/scripts/install-sky-toolchain.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify sky binary
        run: sky --version

      - name: Run non-visual parity check
        run: |
          export CARGO_TARGET_DIR="${{ github.workspace }}/.cache/ipe-target"
          mkdir -p /tmp/parity-diffs
          bash tools/scripts/check-sky-parity-nonvisual.sh \
            --diff-dir /tmp/parity-diffs

      - name: Upload diff artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sky-parity-diffs-${{ github.run_id }}
          path: /tmp/parity-diffs/
          retention-days: 7
