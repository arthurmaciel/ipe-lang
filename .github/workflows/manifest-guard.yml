# Drift gate for the CI check-disposition SSOT (.github/ci/check-manifest.yml).
#
# Fails a PR when the manifest and the produced workflow contexts disagree — the
# exact "a check exists with no declared disposition" state issue #2138 forbids.
# The manifest is the single source of truth; the branch-protection required set
# is derived from it (.github/ci/required-set.json). This gate keeps the two honest.
#
# Runs on every PR (no paths: filter on the trigger) so a check-run named
# "manifest-guard" is always produced and can be listed as a required check.
name: Manifest guard

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.github/ci/**'
  pull_request:
  merge_group:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  manifest-guard:
    name: manifest-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install PyYAML
        run: 'PIP_CONFIG_FILE=/dev/null python3 -m pip install --isolated --require-hashes --only-binary :all: -r "$GITHUB_WORKSPACE/.github/ci/requirements.txt"'

      - name: Every produced check has exactly one declared disposition
        run: python3 .github/ci/verify-manifest.py

      - name: Prove the workflow-step refusals (unit tests)
        run: python3 .github/ci/test_verify_manifest.py -v

      - name: Prove the strict-YAML loader refusals (unit tests)
        run: python3 .github/ci/test_strict_yaml.py -v

      - name: Prove the fail-closed change-classifier refusals (unit tests)
        run: python3 .github/ci/test_change_class.py -v

      - name: The e2e shards and their cover run exactly the SSOT plan
        run: python3 .github/ci/e2e_shard.py --lint

      - name: Prove the e2e shard-partition refusals (unit tests)
        run: python3 .github/ci/test_e2e_shard.py -v

      - name: Reruns fire only on infrastructure; no test retries
        run: python3 .github/ci/rerun_policy.py --lint

      - name: Prove the rerun-policy refusals (unit tests)
        run: python3 .github/ci/test_rerun_policy.py -v

      - name: A red nightly blocks the next merge (nightly-green wiring)
        run: python3 .github/ci/nightly_green.py --lint

      - name: Prove the nightly-green refusals (unit tests)
        run: python3 .github/ci/test_nightly_green.py -v
      - name: Prove the trust-root parser and merge-decision refusals (unit tests)
        run: python3 .github/ci/test_trust_roots.py -v

      - name: Prove the local-gate refusals (unit tests)
        run: python3 .github/ci/test_local_gate.py -v

      - name: Prove the cargo-invocation reader refusals (unit tests)
        run: python3 .github/ci/test_cargo_invocation.py -v

      - name: Prove the test-claims table refusals (unit tests)
        run: python3 .github/ci/test_claims_table.py -v

      - name: The derived required-set is in sync with the manifest
        run: python3 .github/ci/check_required_set.py
