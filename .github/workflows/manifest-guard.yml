# Drift gate for the CI check-disposition SSOT (.github/ci/check-manifest.yml).
#
# Fails a PR when the manifest and the produced workflow contexts disagree — the
# exact "a check exists with no declared disposition" state.
# The manifest is the single source of truth; the branch-protection required set
# is derived from it (.github/ci/required-set.json, via
# `verify-manifest.py --emit-required-set`). This gate keeps the two honest.
#
# Runs on every PR (no paths: filter on the trigger) so a check-run named
# "manifest-guard" is always produced and can be listed as a required check.
name: Manifest guard

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/ci/**'
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  manifest-guard:
    name: manifest-guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PyYAML
        run: python3 -m pip install --quiet pyyaml

      - name: Every refusal of the drift gate still fires
        run: python3 .github/ci/verify-manifest.py --self-test

      - name: Every check is classified, every required check gates, required-set.json is derived
        run: python3 .github/ci/verify-manifest.py
