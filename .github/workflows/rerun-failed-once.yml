name: rerun-failed-once

# Self-healing retry for the heavy gate: when a "Build & test" run finishes
# FAILED on its FIRST attempt, re-run only its failed jobs ONCE. A transient
# heavy-job flake (a cold cargo-build teardown timeout, a runner scheduler
# hiccup) then clears on the second attempt without a human in the loop, while a
# real regression stays red — the rerun fails again and no third attempt is made.
#
# The "once" guard is the run's own attempt counter: `gh run rerun --failed`
# starts attempt 2, which re-triggers this workflow_run event with
# run_attempt == 2; the guard below only acts when run_attempt == 1, so the
# rerun is issued exactly once per originating run.
on:
  workflow_run:
    workflows: ["Build & test"]
    types: [completed]

permissions:
  actions: write    # rerun failed jobs
  contents: read

concurrency:
  group: rerun-failed-once-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  rerun:
    runs-on: ubuntu-latest
    # Only a first-attempt FAILURE is eligible for the single automatic rerun.
    # A CANCELLED run is not: its conclusion is `cancelled`, never `failure`.
    # So when ci.yml's `cancel-on-cheap-red` watcher cancels a same-repo PR
    # run, that run loses its automatic retry. That is safe because the
    # watcher cancels only on a failed CHECK step listed in
    # `.github/ci/deterministic-checks.json` (never on a setup/infra step or a
    # failed ancestor) — a red that fails identically on any retry, so the
    # retry it removes could never have turned the run green.
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt == 1 &&
      github.event.workflow_run.event != 'merge_group'
    steps:
      # No `ref:` override — this checks out the default branch (the ref that
      # triggered THIS workflow_run event), never the completed run's own
      # head. A fork PR's head content must never gate a decision made by a
      # workflow holding write access. Only the SSOT file is materialised and
      # no credential is left in the git config.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: .github/ci/deterministic-checks.json
          sparse-checkout-cone-mode: false

      - name: Skip the rerun when every failed job is red at its check step
        id: gate
        env:
          GH_TOKEN: ${{ secrets.PROMOTE_TOKEN || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          SSOT: .github/ci/deterministic-checks.json
        run: |
          set -uo pipefail

          # A job failed at its deterministic check step fails the same way on
          # a rerun — retrying only burns runners. A job failed at any other
          # step (checkout, toolchain, cache, crate fetch — network-shaped) is
          # exactly what the retry exists for. Default to rerun; only a
          # positive, fully-read match on EVERY failed job skips it.
          rerun=true

          failed="$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs" --paginate \
            --jq '.jobs[] | select(.conclusion == "failure") | {name, steps: [.steps[] | select(.conclusion == "failure") | .name]}')" || {
            echo "could not list run $RUN_ID's jobs — keeping the default rerun." >&2
            echo "rerun=$rerun" >> "$GITHUB_OUTPUT"
            exit 0
          }

          # Data-only exact match against the SSOT pairs. `all_matched` is
          # exactly `true` only when at least one job failed and each failed
          # job failed at its own check step; a jq error keeps the rerun.
          all_matched="$(printf '%s\n' "$failed" | jq -rs --slurpfile ssot "$SSOT" '
            [ .[] | . as $job
              | any($ssot[0].checks[]; .context == $job.name and (.step as $s | any($job.steps[]; . == $s)))
            ] | length > 0 and all')" || all_matched=error

          if [ "$all_matched" = "true" ]; then
            echo "every failed job on run $RUN_ID failed at its deterministic check step — no automatic retry is issued." >&2
            rerun=false
          else
            echo "run $RUN_ID has a failure outside the deterministic check steps (verdict: $all_matched) — keeping the default rerun." >&2
          fi

          echo "rerun=$rerun" >> "$GITHUB_OUTPUT"

      # Fail toward rerunning: only an explicit `rerun=false` from the gate
      # skips this step. A failed checkout or a crashed gate step leaves the
      # output unset, and the retry still fires.
      - name: Re-run the failed jobs once
        if: ${{ !cancelled() && steps.gate.outputs.rerun != 'false' }}
        env:
          GH_TOKEN: ${{ secrets.PROMOTE_TOKEN || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          echo "Build & test run $RUN_ID failed on attempt 1 — re-running its failed jobs once."
          gh run rerun --failed "$RUN_ID" --repo "$REPO"
