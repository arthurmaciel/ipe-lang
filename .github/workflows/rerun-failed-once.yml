name: rerun-failed-once

# Infrastructure-only retry for the heavy gate: when a "Build & test" run
# finishes FAILED on its FIRST attempt, re-run its failed jobs ONCE — but only
# when `.github/ci/rerun_policy.py` proves every failed job died of
# infrastructure (a lost runner, ENOSPC, an sccache/cache HTTP 5xx, a tool or
# crate download failure) and none shows a test failure. A test failure, a lint
# red, or any failure the policy cannot classify stays red: a retry that turns
# a flaky test green hides nondeterminism, so no evidence means no rerun.
#
# The "once" guard is the run's own attempt counter: `gh run rerun --failed`
# starts attempt 2, which re-triggers this workflow_run event with
# run_attempt == 2; the guard below only acts when run_attempt == 1, so the
# rerun is issued at most once per originating run.
on:
  workflow_run:
    workflows: ["Build & test"]
    types: [completed]

permissions:
  actions: write    # read job logs; rerun failed jobs
  checks: read      # read a failed job's annotations (a lost runner's only trace)
  contents: read

concurrency:
  group: rerun-failed-once-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  rerun:
    runs-on: ubuntu-latest
    # Bounds the log scan; a killed classify step leaves no verdict (no rerun).
    timeout-minutes: 20
    # Only a first-attempt FAILURE is eligible. A CANCELLED run (ci.yml's
    # `cancel-on-cheap-red` watcher, a superseded push) concludes `cancelled`,
    # never `failure`, so it is never retried.
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt == 1 &&
      github.event.workflow_run.event != 'merge_group'
    steps:
      # No `ref:` override — this checks out the default branch (the ref that
      # triggered THIS workflow_run event), never the completed run's own
      # head. A fork PR's head content must never gate a decision made by a
      # workflow holding write access. Only the policy module is materialised
      # and no credential is left in the git config.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: .github/ci/rerun_policy.py
          sparse-checkout-cone-mode: false

      # Prints exactly `true` only on a positive infra-only proof for EVERY
      # failed job; any listing, log, or classification failure prints `false`.
      # A crash of the step itself leaves the output unset — also no rerun.
      - name: Classify the failed jobs (rerun only on infrastructure)
        id: gate
        env:
          GH_TOKEN: ${{ secrets.PROMOTE_TOKEN || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          verdict="$(python3 .github/ci/rerun_policy.py decide)"
          echo "run $RUN_ID infra-only verdict: $verdict" >&2
          echo "rerun=$verdict" >> "$GITHUB_OUTPUT"

      # Fail toward NOT rerunning: only the exact verdict `true` fires it.
      - name: Re-run the infrastructure-failed jobs once
        if: ${{ steps.gate.outputs.rerun == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.PROMOTE_TOKEN || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          echo "Build & test run $RUN_ID failed on infrastructure on attempt 1 — re-running its failed jobs once."
          gh run rerun --failed "$RUN_ID" --repo "$REPO"
