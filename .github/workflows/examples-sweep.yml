  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: dtolnay/rust-toolchain@stable
  #     - uses: actions/setup-go@v5
  #       with: { go-version: '1.26', cache: true }
  #     - uses: haskell-actions/setup@v2       # build the Haskell `sky` reference
  #       with: { ghc-version: '9.6.7', cabal-version: 'latest' }
  #     - run: sudo apt-get update && sudo apt-get install -y ripgrep xvfb
  #     - name: Build ipe
  #       run: cargo build --release -p ipe
  #     - name: Build the Haskell sky reference (IPE_GO_BIN)
  #       run: |
  #         # (in the sky checkout) cabal build exe:sky && ln -sf "$(cabal list-bin exe:sky)" /usr/local/bin/sky
  #         echo "TODO: wire the Haskell sky reference build"
