# ─────────────────────────────────────────────────────────────────────────────
# ipê EXAMPLES sweep — the cornerstone correctness gate for the vendored examples.
#
# Runs `scripts/equivalence-checks/examples-sweep.sh` (per in-scope example: BUILD `skyc build` +
# `cargo build` · RUN headless per shape · EQUIVALENCE Go≡Rust — PHASED, off for now).
# The single OS-aware `scripts/lib/checks.sh` drives every host — no per-OS fork.
#
# ── PHASED Go-parity (READ THIS) ─────────────────────────────────────────────
# EQUIVALENCE needs a Go reference built by the Haskell `sky` compiler, which this repo
# does NOT have. The first iteration therefore runs BUILD+RUN only
# (IPE_SWEEP_NO_EQUIV=1). The commented `examples-sweep-equivalence` job stub at the
# bottom shows how EQUIVALENCE turns on later (build/obtain the Haskell `sky` reference).
#
# ── NON-GATING FOR NOW ───────────────────────────────────────────────────────
# skyc currently implements only `Sky.Core.*`; examples reaching for `Std.*` /
# server / tui / webview runtimes will skyc-fail or cargo-fail until the compiler
# reaches parity. So the sweep is expected to be largely RED during the build-out.
# The job runs with `continue-on-error: true` (informational: it prints the table,
# uploads the artifact, and surfaces the verdict WITHOUT failing the workflow).
# FLIP `continue-on-error` to false — making a RED row fail CI — once skyc reaches
# example parity (tracked in docs/architecture/examples-sweep-port.md).
# ─────────────────────────────────────────────────────────────────────────────
name: examples sweep

on:
  push:
    branches: [main, master, 'feat/**']
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_dispatch: {}

concurrency:
  group: examples-sweep-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  examples-sweep:
    name: examples-sweep (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # NON-GATING while the compiler is incomplete (see header). Flip to remove.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        # ubuntu is the developer-reference host (full cli/server/live/tui/webview).
        # macOS adapts (tui via BSD `script`, webview via the real display). Windows
        # (Git Bash) can be added once skyc matures — kept out of the first iteration
        # to avoid noise while most rows are still skyc-fail.
        os: [ubuntu-latest, macos-latest]

    env:
      # Shared cargo target (persisted via actions/cache). skyc + every emitted
      # example crate build into this ONE dir, so heavy deps compile once.
      CARGO_TARGET_DIR: ${{ github.workspace }}/.cache/sky-rust-target
      # sccache OFF on CI (its GHA backend uses GitHub's retired v1 Actions-Cache
      # API); actions/cache carries cross-run warmth instead. Leaving
      # CARGO_INCREMENTAL at cargo's default lets the cached target do incremental.
      IPE_NO_SCCACHE: '1'
      # Phase 1: BUILD + RUN, no Go≡Rust EQUIVALENCE (no Haskell `sky` reference here).
      IPE_SWEEP_NO_EQUIV: '1'
      # Night gate is opt-in (off by default) — but set FORCE too, belt-and-braces.
      IPE_SWEEP_FORCE: '1'
      # >=32-byte test secret so any Std.Auth example that DOES build can boot.
      IPE_AUTH_TOKEN_SECRET: sky-ci-sweep-test-secret-0123456789-abcdef
      # Cold-CI build headroom (per-example skyc ceiling).
      IPE_SWEEP_BUILD_TIMEOUT: '900'
      CARGO_HTTP_MULTIPLEXING: 'false'
      CARGO_NET_RETRY: '5'

    steps:
      - uses: actions/checkout@v4

      # Free disk before the cache restore + builds (Linux runners ship ~14 GB).
      - name: Free disk space (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/share/swift || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL /opt/microsoft /opt/google/chrome /opt/az || true
          sudo swapoff -a || true; sudo rm -f /swapfile /mnt/swapfile || true
          sudo apt-get clean || true
          df -h /

      - uses: dtolnay/rust-toolchain@stable

      # Cache the shared cargo target + registry (skyc + emitted-crate deps).
      - name: Cache cargo target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ${{ github.workspace }}/.cache/sky-rust-target
          key: ${{ runner.os }}-sweep-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-sweep-cargo-

      # ripgrep — REQUIRED by lib/examples.sh's is_out_of_scope Go-FFI filter.
      # Without it the scope scan silently mis-classifies and the sweep is wrong.
      - name: Install ripgrep + xvfb (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep xvfb
          # NOTE: webkit2gtk/libsoup (needed to LINK a webview example) are not
          # installed yet — webview examples don't build on skyc during phase 1,
          # so their RUN column reports skip. Add them here when that changes.

      - name: Install ripgrep + coreutils (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install ripgrep coreutils
          # GNU `timeout` (the sweep + libs use bare `timeout`).
          mkdir -p "$HOME/.local/bin"
          ln -sf "$(brew --prefix coreutils)/libexec/gnubin/timeout" "$HOME/.local/bin/timeout"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Build the compiler under test into the shared target dir. --release keeps
      # the per-example build ceilings comfortable; SKYC_BIN auto-resolves to
      # $CARGO_TARGET_DIR/release/skyc (see scripts/lib/env.sh).
      - name: Build skyc
        run: cargo build --release -p skyc

      # Pre-warm the runtime dep tree so the first example's cargo build reuses
      # compiled deps instead of cold-compiling the world and blowing the ceiling.
      - name: Pre-warm runtime deps
        run: cargo build -p ipe-runtime-rust || cargo build --workspace || true

      - name: Run examples sweep (BUILD + RUN, no EQUIVALENCE)
        shell: bash
        run: bash scripts/equivalence-checks/examples-sweep.sh

      # Per-OS job summary: the BUILD·RUN·EQUIVALENCE table inline on the run page.
      # always() so it renders even on a RED verdict. COSMETIC — never fails the job.
      - name: Job summary (sweep table)
        if: always()
        shell: bash
        run: |
          set +e +o pipefail
          HIST="$HOME/.cache/sky/examples-sweep"
          table="$(ls -t "$HIST"/sweep-*.table 2>/dev/null | head -1)"
          verdict="$(grep -h '=== VERDICT:' "$HIST"/run-*.log 2>/dev/null | tail -1 | sed 's/^=== //; s/ ===.*$//')"
          {
            echo "## examples-sweep — ${{ matrix.os }}"
            echo
            echo "_Phase 1: BUILD + RUN only (Go≡Rust EQUIVALENCE is phased in later)._"
            echo
            [ -n "$verdict" ] && { echo "**${verdict}**"; echo; }
            if [ -n "$table" ] && [ -f "$table" ]; then
              echo '```'; cat "$table"; echo '```'
            else
              echo "_No sweep table found (see the \"Run examples sweep\" step log)._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Upload sweep scoreboard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: examples-sweep-${{ matrix.os }}
          path: |
            ~/.cache/sky/examples-sweep/sweep-*.table
            ~/.cache/sky/examples-sweep/warnings-*.tsv
            ~/.cache/sky/examples-sweep/*.log
          if-no-files-found: warn

  # ───────────────────────────────────────────────────────────────────────────
  # PHASE 2 (COMMENTED STUB) — Go≡Rust EQUIVALENCE. Turn this on once a Go reference is
  # available. Two supported paths:
  #   (a) Build the Haskell `sky` compiler in the job (haskell-actions/setup +
  #       cabal build exe:sky), put it on PATH as IPE_GO_BIN, drop
  #       IPE_SWEEP_NO_EQUIV, and add setup-go for the reference `go build`.
  #   (b) Consume vendored Go reference outputs (expected_go.txt per example,
  #       à la docs/architecture/e2e-and-oracle-caching.md) so no Go toolchain is
  #       needed — extend equivalence_for() to diff against the cached reference.
  # ───────────────────────────────────────────────────────────────────────────
