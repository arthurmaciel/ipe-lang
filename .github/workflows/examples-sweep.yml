# ─────────────────────────────────────────────────────────────────────────────
# Ipê EXAMPLES sweep — the upstream-mirror parity PROOF.
#
# Runs `scripts/examples-sweep.sh`. For each in-scope example it mirrors the real
# upstream Sky example (fetched from the anzellai/sky GitHub repo), patches it
# into Ipê (examples/sky/rename-map.tsv token rewrite
# + optional examples/sky/ipe-patches/<name>.patch), then runs BUILD (`ipe build`
# + `cargo build`) and RUN (headless, per shape). There is NO reference-compiler
# build and no cross-compiler output comparison — this proves OUR compiler
# builds+runs the real upstream examples. `scripts/lib/checks.sh` drives every host.
#
# ── UNPATCHED NEW EXAMPLES (FAIL LOUD) ───────────────────────────────────────
# Any upstream Sky example NOT listed in examples/sky/manifest.toml emits a RED
# `unpatched-new-example` row. Add the entry to manifest.toml (with a verified
# patch) before the sweep can pass with a new upstream example.
#
# ── NON-GATING FOR NOW ───────────────────────────────────────────────────────
# ipe is still reaching example parity, so some rows are expected RED during the
# build-out. The job runs with `continue-on-error: true` (informational: it
# prints the table, uploads the artifact, and surfaces the verdict WITHOUT
# failing the workflow). FLIP `continue-on-error` to false once ipe reaches
# example parity.
# ─────────────────────────────────────────────────────────────────────────────
name: examples sweep

# Slow, live-upstream parity proof — a POST-MERGE / nightly check, OFF the
# required PR gate (the fast PR proxy for THE SEAL is ci.yml's `seal-smoke`).
# Runs on push to the main branches and on a nightly schedule; never on
# pull_request.
on:
  push:
    branches: [main, master, 'feat/**']
    paths-ignore:
      - '**.md'
  schedule:
    - cron: '37 4 * * *'      # nightly, offset from ci.yml (04:00) + security.yml (05:13)
  workflow_dispatch: {}

concurrency:
  group: examples-sweep-${{ github.ref }}
  cancel-in-progress: true

# On the nightly schedule the sweep regenerates the committed examples/sky/
# {original,ipe} trees from upstream and opens a refresh PR when they drift;
# that step (ubuntu, main only) needs write access to push a branch + open a PR.
# Every other job/host stays read-only.
permissions:
  contents: write
  pull-requests: write

jobs:
  examples-sweep:
    name: examples-sweep (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # NON-GATING while the compiler is incomplete (see header). Flip to remove.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        # ubuntu is the developer-reference host (full cli/server/live/tui/webview).
        # macOS adapts (tui via BSD `script`, webview via the real display).
        # Windows and FreeBSD run as separate jobs below (different install paths
        # and scoping — see examples-sweep-windows and examples-sweep-freebsd).
        os: [ubuntu-latest, macos-latest]

    env:
      # Shared cargo target (persisted via actions/cache). ipe + every emitted
      # example crate build into this ONE dir, so heavy deps compile once.
      CARGO_TARGET_DIR: ${{ github.workspace }}/.cache/ipe-target
      # sccache OFF on CI (its GHA backend uses GitHub's retired v1 Actions-Cache
      # API); actions/cache carries cross-run warmth instead. Leaving
      # CARGO_INCREMENTAL at cargo's default lets the cached target do incremental.
      IPE_NO_SCCACHE: '1'
      # Night gate is opt-in (off by default) — but set FORCE too, belt-and-braces.
      IPE_SWEEP_FORCE: '1'
      # >=32-byte test secret so any Ipe.Auth example that DOES build can boot.
      IPE_AUTH_TOKEN_SECRET: ipe-ci-sweep-test-secret-0123456789-abcdef
      # Cold-CI build headroom (per-example ipe ceiling).
      IPE_SWEEP_BUILD_TIMEOUT: '900'
      CARGO_HTTP_MULTIPLEXING: 'false'
      CARGO_NET_RETRY: '5'

    steps:
      - uses: actions/checkout@v7

      # Free disk before the cache restore + builds (Linux runners ship ~14 GB).
      - name: Free disk space (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/share/swift || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL /opt/microsoft /opt/google/chrome /opt/az || true
          sudo swapoff -a || true; sudo rm -f /swapfile /mnt/swapfile || true
          sudo apt-get clean || true
          df -h /

      - uses: dtolnay/rust-toolchain@stable

      # Cache the shared cargo target + registry (ipe + emitted-crate deps).
      - name: Cache cargo target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ${{ github.workspace }}/.cache/ipe-target
          key: ${{ runner.os }}-sweep-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-sweep-cargo-

      # ripgrep — REQUIRED by lib/examples.sh's is_out_of_scope Go-FFI filter.
      # Without it the scope scan silently mis-classifies and the sweep is wrong.
      # xvfb runs webview examples headless. curl+tar fetch the upstream mirror.
      - name: Install ripgrep + xvfb + webview link deps (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          # webkit2gtk-4.1 + libsoup-3.0 are wry 0.55's Linux link deps, so the
          # webview examples (29/31) link; xvfb runs them headless.
          sudo apt-get install -y ripgrep xvfb libwebkit2gtk-4.1-dev libsoup-3.0-dev

      - name: Install ripgrep + coreutils + flock (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          # `flock` serialises the shared-CARGO_TARGET_DIR build/run span; macOS
          # has no flock by default, so the sweep aborts without it.
          brew install ripgrep coreutils flock
          # GNU `timeout` (the sweep + libs use bare `timeout`).
          mkdir -p "$HOME/.local/bin"
          ln -sf "$(brew --prefix coreutils)/libexec/gnubin/timeout" "$HOME/.local/bin/timeout"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Build the compiler under test into the shared target dir. --release keeps
      # the per-example build ceilings comfortable; IPE_BIN auto-resolves to
      # $CARGO_TARGET_DIR/release/ipe (see scripts/lib/env.sh).
      - name: Build ipe
        run: cargo build --release -p ipe

      # Pre-warm the runtime dep tree so the first example's cargo build reuses
      # compiled deps instead of cold-compiling the world and blowing the ceiling.
      - name: Pre-warm runtime deps
        run: cargo build -p ipe-runtime-rust || cargo build --workspace || true

      # Offline consistency gate: the committed examples/sky/ipe/ ports must match
      # re-deriving them from the committed examples/sky/original/ tree with the
      # current rename-map + ipe-edits. No network — this does NOT re-fetch
      # upstream (drift is the refresh PR's job). Catches an edited rename-map or
      # ipe-edit that was not regenerated + committed.
      - name: Check committed Sky ports are consistent
        if: startsWith(matrix.os, 'ubuntu')
        shell: bash
        run: bash scripts/regen-sky-examples.sh --check

      # The mirror fetches every example from the anzellai/sky GitHub repo
      # (curl + tar, both preinstalled on the runners).
      - name: Run examples sweep (mirror + BUILD + RUN)
        shell: bash
        run: bash scripts/examples-sweep.sh

      # Open a refresh PR when upstream drifted. The sweep above regenerated
      # examples/sky/{original,ipe} from the CURRENT upstream; if that differs
      # from the committed trees, upstream moved. Land the refresh as a reviewed
      # PR (branch protection blocks a direct push to main, and a refresh may add
      # new examples or break an ipe-edit anchor that a human must vet). ONE OS
      # (ubuntu), on the nightly schedule (or manual dispatch), main only. The
      # sweep's BUILD/RUN artifacts are gitignored, so only source drift stages.
      - name: Open upstream-refresh PR on drift
        if: >-
          startsWith(matrix.os, 'ubuntu')
          && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
          && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git add -A examples/sky/original examples/sky/ipe
          if git diff --cached --quiet; then
            echo "Sky mirror unchanged — no refresh PR needed."
            exit 0
          fi
          branch="chore/sky-mirror-refresh"
          git config user.name  "ipe-mirror-bot"
          git config user.email "ipe-mirror-bot@users.noreply.github.com"
          git checkout -B "$branch"
          git commit -m "chore(examples): refresh Sky mirror from anzellai/sky"
          # Force-update the standing refresh branch so an open PR just updates.
          git push -f origin "$branch"
          if gh pr view "$branch" --json state --jq .state 2>/dev/null | grep -q OPEN; then
            echo "Refresh PR already open for $branch — updated its branch."
          else
            gh pr create --base "${GITHUB_REF_NAME}" --head "$branch" \
              --title "chore(examples): refresh Sky mirror from anzellai/sky" \
              --body "Automated upstream refresh of \`examples/sky/{original,ipe}\` from anzellai/sky. Review new examples / any changed \`ipe-edits\` anchors before merging."
          fi

      # Per-OS job summary: the BUILD·RUN table inline on the run page. always()
      # so it renders even on a RED verdict. COSMETIC — never fails the job.
      - name: Job summary (sweep table)
        if: always()
        shell: bash
        run: |
          set +e +o pipefail
          HIST="$HOME/.cache/ipe/examples-sweep"
          # shellcheck disable=SC2012  # names are timestamped (no odd chars); ls -t is the intent
          table="$(ls -t "$HIST"/sweep-*.table 2>/dev/null | head -1)"
          verdict="$(grep -h '=== VERDICT:' "$HIST"/run-*.log 2>/dev/null | tail -1 | sed 's/^=== //; s/ ===.*$//')"
          {
            echo "## examples-sweep — ${{ matrix.os }}"
            echo
            echo "_Upstream-mirror parity: does ipe build + run the real (patched) upstream examples?_"
            echo
            [ -n "$verdict" ] && { echo "**${verdict}**"; echo; }
            if [ -n "$table" ] && [ -f "$table" ]; then
              echo '```'; cat "$table"; echo '```'
            else
              echo "_No sweep table found (see the \"Run examples sweep\" step log)._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Upload sweep scoreboard
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: examples-sweep-${{ matrix.os }}
          path: |
            ~/.cache/ipe/examples-sweep/sweep-*.table
            ~/.cache/ipe/examples-sweep/warnings-*.tsv
            ~/.cache/ipe/examples-sweep/*.log
          if-no-files-found: warn

  # ── Windows (Git Bash) — the SAME sweep harness, informational ───────────────
  # Reuses scripts/examples-sweep.sh under Git Bash (`shell: bash` — Git Bash
  # ships with windows-latest), NOT a native-PowerShell reimplementation: a second
  # harness would be a second source of truth and a silent-divergence vector. The
  # harness was made Git-Bash-portable at three points (all Windows-conditional,
  # Linux/macOS behaviour unchanged): env.sh resolves `ipe.exe`, checks.sh's
  # resolve_bin resolves `ipe-app.exe`, and examples-sweep.sh degrades `flock` to
  # a no-op when it is absent (Git Bash has none) — sound because a lone CI sweep
  # has no contender for the shared CARGO_TARGET_DIR the lock guards.
  #
  # PER-SHAPE COVERAGE ON THIS RUNNER (driven by the harness itself, so it can
  # never silently pass a shape it did not actually exercise):
  #   cli      — RUN (pure console).
  #   server   — RUN (curl loopback probe; tokio/axum/rustls are portable).
  #   live     — RUN as a boot/serve check (no browser round-trip: no Playwright
  #              browsers are installed here).
  #   webview  — RUN, no xvfb, no-panic gate (WebView2 preinstalled on the runner);
  #              a webview example whose emitted crate does not link `wry`/`tao`
  #              cargo-fails LOUD rather than faking a green.
  #   tui      — SKIP inside the sweep: the emitted Tui.app needs a real console
  #              and Git-Bash CI has no ConPTY (exercise_tui in checks.sh emits a
  #              windows SKIP row). Real Windows TUI-render coverage belongs to the
  #              runtime `element_to_cells` pure-fn unit lane, not this sweep.
  #   wasm     — n/a: the upstream Sky mirror set contains no [wasm] example.
  #
  # Non-gating (continue-on-error: true) while the compiler is reaching example
  # parity — matches how the ubuntu/macOS jobs are introduced; flip alongside them.
  examples-sweep-windows:
    name: examples-sweep (windows — Git Bash harness, informational)
    runs-on: windows-latest
    continue-on-error: true
    defaults:
      run:
        shell: bash
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.cache/ipe-target
      IPE_NO_SCCACHE: '1'
      IPE_SWEEP_FORCE: '1'
      IPE_AUTH_TOKEN_SECRET: ipe-ci-sweep-test-secret-0123456789-abcdef
      IPE_SWEEP_BUILD_TIMEOUT: '900'
      IPE_RUNTIME_DIR: ${{ github.workspace }}/src/runtime/rust/src
      CARGO_HTTP_MULTIPLEXING: 'false'
      CARGO_NET_RETRY: '5'

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ${{ github.workspace }}/.cache/ipe-target
          key: windows-sweep-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            windows-sweep-cargo-

      - name: Install ripgrep (choco)
        shell: pwsh
        run: choco install ripgrep -y --no-progress

      - name: Build ipe
        run: cargo build --release -p ipe

      # Pre-warm the runtime dep tree so the first example's cargo build reuses
      # compiled deps instead of cold-compiling the world and blowing the ceiling.
      - name: Pre-warm runtime deps
        run: cargo build -p ipe-runtime-rust || cargo build --workspace || true

      # The SAME harness the ubuntu/macOS jobs run — mirror (curl+tar, both in Git
      # Bash) + BUILD (ipe.exe + cargo) + per-shape RUN. flock no-ops here; ipe.exe
      # / ipe-app.exe resolve via the Windows-conditional paths in env.sh/checks.sh.
      - name: Run examples sweep (mirror + BUILD + RUN)
        run: bash scripts/examples-sweep.sh

      # Per-OS job summary: the BUILD·RUN table inline on the run page. always()
      # so it renders even on a RED verdict. COSMETIC — never fails the job.
      - name: Job summary (sweep table)
        if: always()
        run: |
          set +e +o pipefail
          HIST="$HOME/.cache/ipe/examples-sweep"
          # shellcheck disable=SC2012  # names are timestamped (no odd chars); ls -t is the intent
          table="$(ls -t "$HIST"/sweep-*.table 2>/dev/null | head -1)"
          verdict="$(grep -h '=== VERDICT:' "$HIST"/run-*.log 2>/dev/null | tail -1 | sed 's/^=== //; s/ ===.*$//')"
          {
            echo "## examples-sweep — windows-latest (Git Bash)"
            echo
            echo "_Upstream-mirror parity under Git Bash: does ipe build + run the real (patched) upstream examples on Windows?_"
            echo
            [ -n "$verdict" ] && { echo "**${verdict}**"; echo; }
            if [ -n "$table" ] && [ -f "$table" ]; then
              echo '```'; cat "$table"; echo '```'
            else
              echo "_No sweep table found (see the \"Run examples sweep\" step log)._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Upload sweep scoreboard
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: examples-sweep-windows-latest
          path: |
            ~/.cache/ipe/examples-sweep/sweep-*.table
            ~/.cache/ipe/examples-sweep/warnings-*.tsv
            ~/.cache/ipe/examples-sweep/*.log
          if-no-files-found: warn

  # ── FreeBSD (vmactions VM on ubuntu host) — BUILD-only ───────────────────────
  # Scope: ipe build + cargo build inside a FreeBSD VM. RUN is skipped (no
  # display, no pty allocation in the VM's `run:` block). The full sweep script
  # requires `flock` — FreeBSD has it in base, but the VM budget is tight, so
  # we drive ipe build + cargo build directly on the two cli examples rather
  # than fetching the full upstream mirror and iterating all examples.
  # Non-gating (continue-on-error: true). Mirror-commit step is ubuntu-only and
  # is intentionally absent here.
  examples-sweep-freebsd:
    name: examples-sweep (freebsd — BUILD-only, cli shapes)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v7

      - name: BUILD cli examples inside FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: |
            pkg install -y rust ripgrep curl
          run: |
            set -e
            export CARGO_TARGET_DIR="$HOME/.cache/ipe-freebsd-target"
            export IPE_RUNTIME_DIR="$PWD/src/runtime/rust/src"
            export CARGO_HTTP_MULTIPLEXING=false
            export CARGO_NET_RETRY=5
            cargo build --release -p ipe
            IPE="$CARGO_TARGET_DIR/release/ipe"
            for ex in examples/sky/ipe/01-hello-world examples/sky/ipe/06-json; do
              echo "=== BUILD $ex ==="
              cd "$ex"
              "$IPE" build ipe.toml --out out/rust
              cargo build --manifest-path out/rust/Cargo.toml
              cd -
            done
