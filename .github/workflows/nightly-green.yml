name: nightly-green

# A red nightly blocks the next merge. `nightly-green` is a required context:
# it passes only on proof the full gate ("Build & test" dispatched by
# nightly-full-gate.yml, which runs every `nightly-gate` job) is green — either
# the latest completed nightly on main concluded `success` within 48h, or this
# change's own commit passed a dispatched full gate (the recovery path for the
# PR that fixes a red nightly: `gh workflow run 'Build & test' --ref <branch>`,
# then re-run this check). It also requires the latest scheduled ruleset admin
# read (ruleset-admin-read.yml) on main to be green within 48h, on every
# change. A red ruleset admin read caused by the ruleset or its token is fixed
# there, and the next scheduled run proves the fix (a `gh run rerun` keeps the
# run's `created_at`, so it never makes a stale run fresh); one caused by
# main's tree needs the break-glass sequence in .github/ci/RECONCILIATION.md.
# Absence is not a pass.
# The rule lives in `.github/ci/nightly_green.py`; its `--lint`
# (manifest-guard) pins this wiring.
on:
  pull_request:
  merge_group:

permissions:
  actions: read     # list the "Build & test" and ruleset admin read runs
  contents: read
  pull-requests: read  # merge_group: resolve the queued PR's head commit

concurrency:
  group: nightly-green-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nightly-green:
    name: nightly-green
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Only the verdict module is materialised; no credential stays in git.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: .github/ci/nightly_green.py
          sparse-checkout-cone-mode: false

      - name: Require a green full gate (latest nightly, or this commit)
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/ci/nightly_green.py --verdict
