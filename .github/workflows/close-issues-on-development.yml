name: Close issues on development
# GitHub only auto-closes an issue from a `Closes #N` keyword when the fix reaches
# the DEFAULT branch (`main`). This project's PRs land on `development` first and
# only reach `main` on promotion, so closing keywords would otherwise sit unhonoured
# until the nightly FF. This workflow closes those issues at development-merge time.
#
# Two paths, because a closing keyword can live in either place:
#   - push: scans the messages of the commits pushed to `development`.
#   - pull_request_target (closed+merged): scans the merged PR's title + body — a
#     squash-merge's commit message is only the PR TITLE, so a `Closes #N` written
#     in the PR BODY never reaches the commit-message scan above. This path closes
#     that gap. `pull_request_target` gives an `issues: write` token and runs NO PR
#     code (reads only event metadata), so it is safe on fork PRs.
on:
  push:
    branches: [development]
  pull_request_target:
    types: [closed]
    branches: [development]
permissions:
  issues: write
  contents: read
concurrency:
  group: close-issues-on-development
  cancel-in-progress: false
jobs:
  close-from-pushed-commits:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Close issues referenced by the pushed commits
        env:
          GH_TOKEN: ${{ secrets.PROMOTE_TOKEN || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          COMMITS_JSON: ${{ toJSON(github.event.commits) }}
        run: |
          set -euo pipefail
          # Issue numbers following a GitHub closing keyword
          # (close/closes/closed, fix/fixes/fixed, resolve/resolves/resolved) in any
          # pushed commit message. Deduplicate, then close each still-open issue.
          numbers=$(printf '%s' "$COMMITS_JSON" \
            | jq -r '.[].message' \
            | grep -oiE '(close[sd]?|fix(es|ed)?|resolve[sd]?)[[:space:]]+#[0-9]+' \
            | grep -oE '[0-9]+' \
            | sort -un || true)
          if [ -z "$numbers" ]; then
            echo "No closing keywords in this push."
            exit 0
          fi
          for n in $numbers; do
            state=$(gh issue view "$n" --repo "$REPO" --json state --jq '.state' 2>/dev/null || echo MISSING)
            if [ "$state" = "OPEN" ]; then
              gh issue close "$n" --repo "$REPO" \
                --comment "Fixed on \`development\` (merged). Reaches \`main\` on the next promotion." \
                && echo "closed #$n" || echo "skip #$n (close failed)"
            else
              echo "skip #$n (state=$state)"
            fi
          done

  close-from-merged-pr:
    if: github.event_name == 'pull_request_target' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Close issues referenced in the merged PR title/body
        env:
          GH_TOKEN: ${{ secrets.PROMOTE_TOKEN || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUM: ${{ github.event.pull_request.number }}
          # Attacker-controllable text reaches the shell ONLY via these env vars
          # (never interpolated into the run body) — no command-injection surface.
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          numbers=$(printf '%s\n%s' "$PR_TITLE" "$PR_BODY" \
            | grep -oiE '(close[sd]?|fix(es|ed)?|resolve[sd]?)[[:space:]]+#[0-9]+' \
            | grep -oE '[0-9]+' \
            | sort -un || true)
          if [ -z "$numbers" ]; then
            echo "No closing keywords in PR #$PR_NUM."
            exit 0
          fi
          for n in $numbers; do
            state=$(gh issue view "$n" --repo "$REPO" --json state --jq '.state' 2>/dev/null || echo MISSING)
            if [ "$state" = "OPEN" ]; then
              gh issue close "$n" --repo "$REPO" \
                --comment "Fixed on \`development\` via #$PR_NUM (merged). Reaches \`main\` on the next promotion." \
                && echo "closed #$n" || echo "skip #$n (close failed)"
            else
              echo "skip #$n (state=$state)"
            fi
          done
