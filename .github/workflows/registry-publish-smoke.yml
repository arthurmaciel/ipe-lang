# Live-registry publish smoke test — exercise the real `ipe package publish`
# push-path end-to-end against the live (or a staging) registry.
#
# The `registry-admission` CI job (ci.yml) proves the publish *logic* over a
# LOCAL fixture index — no real registry. This workflow closes that gap: it drives
# the actual network push-path — `ipe package publish` opens a PR on the registry,
# the registry's admission workflow accepts it, and the entry resolves back
# through the Pages read API — then cleans up idempotently so the real index is
# never polluted. See tools/scripts/registry/publish-smoke.sh for the mechanism.
#
# Cadence: NIGHTLY (cron) + manual `workflow_dispatch` ONLY. Never per-PR, never a
# promotion-required check — pushing to a real registry must not gate every PR or
# promotion. This workflow is advisory: a red run signals a broken live push-path,
# it does not block a merge or a release.
#
# Trust boundary: it uses a publish token — the
# IPE_REGISTRY_PUBLISH_TOKEN repo secret — to push a branch and open a PR on the
# registry. The token is passed to the smoke script ONLY through the environment;
# the script never echoes it, never writes it to a logged file, and never places
# it on a process argv (git gets it via GIT_ASKPASS, the API via the Authorization
# header). `set -x` is never enabled. The run is fail-closed: any auth, admission,
# or resolution failure turns the job RED — never green-by-skip.
#
# Staging vs production: PREFER a staging registry (a throwaway repo mirroring the
# ipe-registry layout) so a failed run can never corrupt the real index. Configure
# it with the IPE_SMOKE_INDEX_REPO / IPE_SMOKE_REGISTRY_URL repo variables. With no
# staging repo configured, the run falls back to the production registry using a
# RESERVED disposable package name (`ipe-registry-smoke-probe`, a `0.0.0-smoke.*`
# prerelease no real consumer depends on) plus guaranteed idempotent cleanup.
#
# Required infra for a live run (absent → the job fails-closed with a clear note):
#   secret  IPE_REGISTRY_PUBLISH_TOKEN  publish token with push + open-PR rights on
#                                       the index repo and the fork.
#   var     IPE_SMOKE_INDEX_REPO        <owner>/<name> the PR targets
#                                       (default arthurmaciel/ipe-registry).
#   var     IPE_SMOKE_FORK              fork owner the publish branch is pushed to
#                                       (default: the index repo owner).
#   var     IPE_SMOKE_REGISTRY_URL      Pages read API base
#                                       (default https://arthurmaciel.github.io/ipe-registry).
#   var     IPE_SMOKE_SOURCE_REPO       disposable repo whose HEAD the entry pins
#                                       (default: <fork>/ipe-registry-smoke-probe).
name: Registry publish smoke

on:
  schedule:
    # 05:12 UTC — a quiet-hours slot offset from the other nightly crons
    # (ci nightly 04:00, sandbox 03:17) so the scheduled runs do not pile up.
    - cron: '12 5 * * *'
  workflow_dispatch: {}

# Read-only at the workflow level: the smoke's registry writes are authorized by
# the publish token secret, NOT by the workflow GITHUB_TOKEN, so this workflow's
# own token needs no write scope.
permissions:
  contents: read

concurrency:
  # One live smoke at a time — two concurrent runs would race on the reserved
  # package's branch/PR. Do not cancel an in-flight run (it owns cleanup).
  group: registry-publish-smoke
  cancel-in-progress: false

jobs:
  publish-smoke:
    name: publish → admission → resolve → cleanup
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.9
      - uses: Swatinem/rust-cache@v2

      - name: Build the ipe binary
        env:
          IPE_RUNTIME_DIR: ${{ github.workspace }}/src/runtime/rust/src
        run: cargo build -p ipe --bin ipe

      # Fail closed BEFORE running the smoke when the publish token is absent, so
      # the reason is an obvious job-summary line, not an opaque mid-run error.
      - name: Verify the publish token is present (fail-closed)
        env:
          TOKEN_PRESENT: ${{ secrets.IPE_REGISTRY_PUBLISH_TOKEN != '' }}
        run: |
          if [ "$TOKEN_PRESENT" != "true" ]; then
            {
              echo "### Registry publish smoke — NOT RUN"
              echo
              echo "The \`IPE_REGISTRY_PUBLISH_TOKEN\` repo secret is not configured."
              echo "The live push-path needs a publish token with push + open-PR rights."
              echo "Add the secret (and optionally the staging \`IPE_SMOKE_*\` repo variables)"
              echo "to enable this smoke. This is a fail-closed skip, not a passing proof."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::IPE_REGISTRY_PUBLISH_TOKEN is unset — cannot run the live-registry publish smoke (fail-closed)."
            exit 1
          fi

      - name: Run the live publish smoke
        env:
          # The token is delivered ONLY here, on the environment. The script never
          # echoes it, never logs it, never puts it on an argv.
          IPE_SMOKE_TOKEN: ${{ secrets.IPE_REGISTRY_PUBLISH_TOKEN }}
          # Staging overrides fall through to the script's production defaults when
          # the repo variables are unset.
          IPE_SMOKE_INDEX_REPO: ${{ vars.IPE_SMOKE_INDEX_REPO }}
          IPE_SMOKE_FORK: ${{ vars.IPE_SMOKE_FORK }}
          IPE_REGISTRY_URL: ${{ vars.IPE_SMOKE_REGISTRY_URL }}
          IPE_SMOKE_SOURCE_REPO: ${{ vars.IPE_SMOKE_SOURCE_REPO }}
          IPE_BIN: ${{ github.workspace }}/target/debug/ipe
          IPE_RUNTIME_DIR: ${{ github.workspace }}/src/runtime/rust/src
        run: bash tools/scripts/registry/publish-smoke.sh
