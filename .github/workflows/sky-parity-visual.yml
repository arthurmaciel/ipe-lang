# ─────────────────────────────────────────────────────────────────────────────
# Visual parity — nightly screenshot diff of sky vs Ipê web ports.
#
# For each green web-shape port in examples/sky/manifest.toml:
#   1. Builds the Ipê port (ipe build + cargo build).
#   2. Builds the Sky port (sky build + go build from original/).
#   3. Starts both HTTP servers and captures screenshots with Playwright Chromium
#      (same-engine comparison; threshold RMS ≤ 8.0).
#   4. Computes a perceptual RMS diff; reports PASS or FAIL.
#
# Honest verdict: SKY-BUILD-FAIL counts as FAIL — a port whose Sky side did not
# build was not compared. A run with zero real comparisons also fails. The gate
# must report a genuine comparison count, not a spurious green.
#
# install-sky-toolchain.sh resolves the latest Sky release from GitHub so
# build failures due to a pinned stale version are visible immediately.
#
# This is NOT a required PR gate — it needs live sky + playwright + webkit deps.
# The fast PR gate is sky-ports-gate.yml (offline, build-only).
# ─────────────────────────────────────────────────────────────────────────────
name: sky visual parity

on:
  schedule:
    - cron: '17 6 * * *'    # nightly at 06:17 UTC (offset from sky-parity at 05:47)
  workflow_dispatch: {}

concurrency:
  group: sky-visual-parity-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sky-visual-parity:
    name: sky visual parity (web ports)
    runs-on: ubuntu-latest
    # Gating: a FAIL here means a real comparison failure — sky-build-fail,
    # capture-fail, diff-above-threshold, or zero comparisons performed.
    continue-on-error: false

    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.cache/ipe-target
      IPE_NO_SCCACHE: '1'
      IPE_SWEEP_BUILD_TIMEOUT: '300'
      CARGO_HTTP_MULTIPLEXING: 'false'
      CARGO_NET_RETRY: '5'
      VISUAL_PARITY_OUT: /tmp/ipe-visual-parity

    steps:
      - uses: actions/checkout@v7

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/share/swift || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL /opt/microsoft /opt/google/chrome || true
          sudo apt-get clean || true
          df -h /

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ github.workspace }}/.cache/ipe-target
          key: visual-parity-${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            visual-parity-${{ runner.os }}-cargo-

      # Install system deps: xvfb + webview link libs (for ipe webview ports),
      # imagemagick (xvfb capture, webview shape), python3-pil (diff tool).
      # Playwright/Chromium handles web port screenshots via npx.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            imagemagick \
            python3-pil \
            ripgrep

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build ipe
        run: |
          export CARGO_TARGET_DIR="${{ github.workspace }}/.cache/ipe-target"
          cargo build --release -p ipe

      - name: Install sky toolchain
        run: |
          mkdir -p ~/.local/bin
          bash tools/scripts/install-sky-toolchain.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify sky binary
        run: sky --version

      # Run the visual parity harness over all green web-shape ports.
      # SKY-BUILD-FAIL counts as FAIL — no comparison was performed.
      - name: Run visual parity check (web ports)
        run: |
          export CARGO_TARGET_DIR="${{ github.workspace }}/.cache/ipe-target"
          mkdir -p /tmp/ipe-visual-parity
          bash tools/scripts/check-sky-parity-visual.sh \
            --out-dir /tmp/ipe-visual-parity
        env:
          VISUAL_PARITY_OUT: /tmp/ipe-visual-parity

      # Upload all screenshots and diff logs as a CI artifact for visual review.
      # Screenshots are NOT committed to git (too large; reference baselines are
      # a future decision).
      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-parity-screenshots
          path: /tmp/ipe-visual-parity/
          retention-days: 7

      - name: Job summary
        if: always()
        run: |
          {
            echo "## sky visual parity"
            echo ""
            echo "Screenshots and diff logs: see the \`visual-parity-screenshots\` artifact."
            echo ""
            echo "| File | Size |"
            echo "|------|------|"
            find /tmp/ipe-visual-parity -maxdepth 1 -name "*.png" -o -name "*.log" 2>/dev/null \
              | sort | while read -r f; do
              echo "| $(basename "$f") | $(du -sh "$f" 2>/dev/null | cut -f1) |"
            done
          } >> "$GITHUB_STEP_SUMMARY" || true
