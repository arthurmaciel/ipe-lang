name: Install the mold linker
description: >-
  Install a pinned mold release and make it the system linker. The tarball is
  fetched with retries on transient server errors and must match its pinned
  sha256 before anything is extracted, so a flaky or tampered download fails
  the step instead of installing. This is the ONLY place mold may be
  installed — `ci/verify-manifest.py` refuses the raw `rui314/setup-mold`
  action anywhere else. Bumping mold means changing the version and both
  digests below together.

runs:
  using: composite
  steps:
    - name: Install pinned mold
      shell: bash
      run: |
        set -euo pipefail
        version=2.42.1
        arch="$(uname -m)"
        case "$arch" in
          x86_64) digest=6ff270c9bf07d2bec5c98aa324eb7c4daf6a1a4d815c05ff1708049616047855 ;;
          aarch64) digest=16b025652d3d7456689e6025a77e1903bb2a15e7630877c26cc133f5df95b9c6 ;;
          *) echo "::error::no pinned mold digest for ${arch}" >&2; exit 1 ;;
        esac
        tarball="$RUNNER_TEMP/mold-${version}-${arch}-linux.tar.gz"
        curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
          --retry 5 --retry-all-errors --retry-delay 3 --max-time 120 \
          --output "$tarball" \
          "https://github.com/rui314/mold/releases/download/v${version}/mold-${version}-${arch}-linux.tar.gz"
        echo "${digest}  ${tarball}" | sha256sum --check --strict -
        sudo tar -C /usr/local --strip-components=1 --no-overwrite-dir -xzf "$tarball"
        ld="$(realpath /usr/bin/ld)"
        if [ "$ld" != /usr/local/bin/mold ]; then
          sudo ln -sf /usr/local/bin/mold "$ld"
        fi
        mold --version
