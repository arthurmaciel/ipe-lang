# Dependency update proposals. Every update is one grouped PR per ecosystem per
# week, so the open-PR budget stays small; a release must be public for a week
# before it is proposed, so a compromised publish has time to be yanked first.
# Updates land through the same required checks and code-owner review as any PR
# (this file is under `/.github/` in CODEOWNERS).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: cargo
    directories:
      - /
      - /tools/panic-scan
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    groups:
      cargo:
        patterns: ["*"]
    commit-message:
      prefix: chore
      include: scope
