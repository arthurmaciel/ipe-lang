# CI check-disposition SSOT
#
# Single source of truth mapping every produced status context to exactly one
# disposition. The branch-protection required set is DERIVED from this file
# (every `gate` entry), never hand-synced; `ci/verify-manifest.py` fails CI if a
# produced context is missing here, or if a `gate` entry lacks a producer.
#
# Dispositions
#   gate          Blocks (a required status context) and runs per relevant change.
#   nightly-gate  Heavy; runs nightly, not on every PR. A red blocks the NEXT
#                 merge via the required `nightly-green` gate (absence != pass).
#                 Never silently advisory.
#   informational Never blocks. MANDATORY low-noise surface (the ci-health
#                 dedup issue + summary) and a named owner. May NOT guard a
#                 Security / Soundness / SEAL invariant.
#   delete        Dead / orphaned / make-up. Kept here only until removed, with a
#                 reason, so the drift gate does not flag it as unclassified.
#
# `context` is the exact status-context string GitHub reports (the job `name:`,
# or the job id when no `name:` is set). Matrix jobs report one context per leg;
# they are covered by their `aggregator` (the single promotable context) so the
# matrix legs are marked `internal: true` and excluded from the required set.
#
# `owner` is required for every `informational` entry (who watches its surface).
# `guards` records the Security / Soundness / SEAL invariant a check protects;
# an entry that `guards` such an invariant may not be `informational`.
#
# `local` (required on every `gate`) is how `tools/scripts/gate` reproduces the
# check before a push. Exactly one of:
#   tier + run    Run these commands at `quick` (per push), `affected` (tests
#                 over changed crates + reverse deps) or `full` (the CI mirror).
#                 A command is a string or {cmd, env, cwd, differs}. Each must
#                 match a command the producer job runs, token for token, with
#                 the same env and working directory; `differs: <reason>`
#                 waives only the token match. Placeholders: {packages} (changed
#                 crates; `--workspace` in CI), {lib_packages} (the same, library
#                 crates only), {repo_root}, {target_dir}.
#   covered-by    Another gate context whose local run exercises this one.
#   ci-only       Not reproducible locally: platform | privileged | classifier |
#                 inline-script.
# `.github/ci/local_gate.py` parses and verifies these; the verifier refuses a
# gate without one and a local command that drifts from CI.
#
# `release-only` (required on every entry whose producer runs on pull requests
# or in the merge queue) is what the entry does on a release-please PR whose
# diff is version metadata only. Exactly one key, with a non-empty reason:
#   run   Version-sensitive or cheap: executes in full. No job `if:` names
#         `release_only`, and no job needs one that skips on it.
#   pass  Version-independent: a gate job executes the trivial-pass step and
#         skips the rest; a non-gate job may skip as a whole.
# Merge-group and push runs are never release-only, so every tier still runs
# before and after the merge. Check 13 of `ci/verify-manifest.py` holds each
# producer to its declaration and refuses a missing or contradicted one.

version: 1

checks:
  # ── Fast per-change gates (ci.yml, PR + push) ─────────────────────────────
  - context: fmt
    disposition: gate
    producer: ci.yml
    release-only:
      run: cheap; runs on every diff
    local:
      tier: quick
      run:
        - cargo fmt --all -- --check
  - context: clippy
    disposition: gate
    producer: ci.yml
    release-only:
      pass: lints read source, which a version bump leaves as the gated main
    local:
      tier: quick
      run:
        - cargo clippy --all-targets {packages} -- -D warnings
  - context: runtime-feature-combos
    disposition: gate
    producer: ci.yml
    release-only:
      pass: feature-combo clippy reads source, not the version
    local:
      tier: affected
      run:
        - cargo clippy -p ipe-runtime-rust --no-default-features --features db --all-targets -- -D warnings
        - cargo clippy -p ipe-runtime-rust --no-default-features --features db,web --all-targets -- -D warnings
        - cargo clippy -p ipe-runtime-rust --features debugger,tui --all-targets -- -D warnings
        - cargo clippy -p ipe-runtime-rust --features debugger,web --all-targets -- -D warnings
    guards: >-
      Every runtime feature combination the emitter can select builds clean
      under clippy (SEAL); path-gated, so a skip on a non-emit PR passes.
  - context: windows-check
    disposition: gate
    producer: ci.yml
    release-only:
      pass: the Windows build reads source, not the version
    local:
      ci-only: platform
    guards: >-
      The Windows output-directory code compiles, so its held-handle,
      reparse-point-refusing file operations ship rather than rot unbuilt.
  - context: quick-check
    disposition: gate
    producer: ci.yml
    release-only:
      run: compiles the workspace against the bumped Cargo.toml and Cargo.lock
    local:
      tier: quick
      run:
        - cargo check --workspace
  - context: test
    disposition: gate
    producer: ci.yml
    release-only:
      run: the SEAL suite, which reads CARGO_PKG_VERSION
    local:
      tier: affected
      run:
        - cmd: cargo nextest run {packages} --profile ci --no-tests=warn
          differs: CI runs the same suite from one archive split over shards; locally it runs over the selected crates directly
        - cargo test --doc {lib_packages}
    aggregates: [test-prep, test-run]
  - context: artifact-guard
    disposition: gate
    producer: ci.yml
    release-only:
      run: cheap; a release PR must not commit build artifacts
    local:
      tier: quick
      run:
        - .github/ci/artifact-guard.sh
  - context: manifest-lock-consistency
    disposition: gate
    producer: ci.yml
    release-only:
      run: the version-sensitive lock check
    local:
      tier: quick
      run:
        - .github/ci/manifest-lock-consistency.sh
    guards: >-
      Cargo.lock pins every version-inheriting workspace member to the version
      Cargo.toml declares, and the release-please release commit bumps exactly
      those entries, so a release can never ship a lock that fails
      `cargo build --locked`.
  - context: diagnostic-tone
    disposition: gate
    producer: ci.yml
    release-only:
      pass: diagnostic text holds no version
    local:
      tier: quick
      run:
        - bash tools/scripts/tests/test-require-tool.sh
        - bash tools/scripts/lint-diagnostic-tone.sh
  - context: "explain-page example gate (ADR 0059)"
    disposition: gate
    producer: ci.yml
    release-only:
      pass: explain pages hold no version
    local:
      tier: affected
      run:
        - cargo build --release -p ipe
        - cmd: bash tools/scripts/check-explain-examples.sh
          env:
            IPE_BIN: "{target_dir}/release/ipe"
            IPE_RUNTIME_DIR: "{repo_root}/src/runtime/rust/src"
  - context: "doc-string example gate"
    disposition: gate
    producer: ci.yml
    release-only:
      pass: doc strings hold no version
    local:
      tier: affected
      run:
        - cargo build --release -p ipe
        - cmd: bash tools/scripts/check-doc-examples.sh
          env:
            IPE_BIN: "{target_dir}/release/ipe"
            IPE_RUNTIME_DIR: "{repo_root}/src/runtime/rust/src"
  - context: "first-party check floor (ipe type-check only)"
    disposition: gate
    producer: ci.yml
    release-only:
      pass: type-checking first-party Ipe reads no version
    local:
      tier: affected
      run:
        - cargo build --release -p ipe
        - cmd: bash tools/scripts/first-party-check-floor.sh
          env:
            IPE_BIN: "{target_dir}/release/ipe"
            IPE_RUNTIME_DIR: "{repo_root}/src/runtime/rust/src"
  - context: "first-party shapes (build gate)"
    disposition: gate
    producer: ci.yml
    release-only:
      pass: the shapes build reads source, not the version; seal-smoke proves the version pin
    local:
      ci-only: inline-script
  - context: wasm-floor
    disposition: gate
    producer: ci.yml
    release-only:
      pass: the wasm runtime build reads source, not the version
    local:
      tier: full
      run:
        - cargo build -p ipe-runtime-rust --target wasm32-unknown-unknown
        - cargo build -p ipe-runtime-rust --target wasm32-unknown-unknown --features json
        - cargo build -p ipe-runtime-rust --target wasm32-unknown-unknown --no-default-features --features wasm-client,debugger
        - cargo build -p ipe-runtime-rust --target wasm32-wasip1 --no-default-features
        - cargo build -p ipe-runtime-rust --target wasm32-wasip1 --no-default-features --features time,log,json,uuid,random,decimal,regex,crypto-core,secret,char-category
  - context: seal-smoke
    disposition: gate
    producer: ci.yml
    release-only:
      run: proves an emitted project builds against the bumped runtime version pin
    local:
      ci-only: inline-script
    guards: SEAL
  - context: build-tools
    disposition: gate
    producer: ci.yml
    release-only:
      pass: its only consumers are the docs-drift gates, which pass on a version bump
    local:
      covered-by: stdlib-docs-drift
    guards: >-
      Security — a build step that a required gate `needs` must itself be
      required, or its failure/skip silently fail-opens the gates depending on
      it (the same fail-closed-classifier property as `changes` below).
      Compiles the six doc/golden regenerator binaries once and shares them
      via artifact across the docs-drift gates.
  - context: stdlib-docs-drift
    disposition: gate
    producer: ci.yml
    release-only:
      pass: generated stdlib docs hold no version
    local:
      tier: quick
      run:
        - cmd: cargo run -p ipe_docs --bin gen-stdlib-docs -- --repo-root {repo_root}
          differs: CI runs the binary build-tools prebuilt and shared by artifact; cargo run builds it locally
        - git diff --exit-code docs/reference/stdlib.md docs/reference/stdlib/
  - context: env-docs-drift
    disposition: gate
    producer: ci.yml
    release-only:
      pass: generated env docs hold no version
    local:
      tier: quick
      run:
        - cmd: cargo run -p ipe_docs --bin gen-env-docs -- --repo-root {repo_root}
          differs: CI runs the binary build-tools prebuilt and shared by artifact; cargo run builds it locally
        - git diff --exit-code docs/reference/env.md
  - context: capabilities-docs-drift
    disposition: gate
    producer: ci.yml
    release-only:
      pass: generated capability docs hold no version
    local:
      tier: quick
      run:
        - cmd: cargo run -p ipe_docs --bin gen-capabilities-docs -- --repo-root {repo_root}
          differs: CI runs the binary build-tools prebuilt and shared by artifact; cargo run builds it locally
        - git diff --exit-code docs/reference/capabilities.md
  - context: cli-docs-drift
    disposition: gate
    producer: ci.yml
    release-only:
      pass: generated CLI docs hold no version
    local:
      tier: quick
      run:
        - cmd: cargo run -p ipe --bin gen-cli-docs -- --repo-root {repo_root}
          differs: CI runs the binary build-tools prebuilt and shared by artifact; cargo run builds it locally
        - git diff --exit-code docs/reference/cli.md
  - context: requirements-docs-drift
    disposition: gate
    producer: ci.yml
    release-only:
      pass: generated requirements docs hold no version
    local:
      tier: quick
      run:
        - cmd: cargo run -p ipe_docs --bin gen-requirements-docs -- --repo-root {repo_root}
          differs: CI runs the binary build-tools prebuilt and shared by artifact; cargo run builds it locally
        - git diff --exit-code docs/reference/requirements.md
  - context: cli-transcripts-drift
    disposition: gate
    producer: ci.yml
    release-only:
      pass: CLI goldens normalise the version to <VERSION>
    local:
      tier: quick
      run:
        - cmd: cargo run -p regen-cli-transcripts -- --repo-root {repo_root}
          differs: CI runs the binary build-tools prebuilt and shared by artifact; cargo run builds it locally, and CI points it at its prebuilt ipe via --ipe-bin
        - git diff --exit-code src/ipe-cli/tests/golden/cli/
  - context: markdown-parity
    disposition: gate
    producer: ci.yml
    release-only:
      pass: the markdown parity snapshot holds no version
    local:
      tier: quick
      run:
        - tools/scripts/regen-markdown-parity.sh
        - git diff --exit-code src/ipe-docs/src/markdown/parity/snapshot.txt
  - context: runtime-full-features
    disposition: gate
    producer: ci.yml
    release-only:
      pass: the full-feature runtime suite reads source, not the version
    local:
      tier: affected
      run:
        - cargo nextest run -p ipe-runtime-rust --features full --profile ci
    guards: SEAL
  - context: registry-admission
    disposition: gate
    producer: ci.yml
    release-only:
      run: author- and event-gated, never keyed on the diff
    local:
      tier: affected
      run:
        - cmd: cargo nextest run -p ipe --test registry_admission --profile ci
          env:
            IPE_E2E: "1"
            IPE_RUNTIME_DIR: "{repo_root}/src/runtime/rust/src"

  # ── Cancel-on-cheap-red watcher — informational (never a merge gate) ──────
  # Normally SKIPPED (its `needs:` all succeed and `failure()` is false), so it
  # may not be a `gate`: requiring a check that is skipped on every green run
  # buys nothing (GitHub already counts a skip as passing) and only adds
  # noise to the required set. Its `needs:` list and every check-step name
  # are checked against `ci/deterministic-checks.json` by
  # `ci/verify-manifest.py`, so they can never drift apart.
  - context: cancel-on-cheap-red
    disposition: informational
    producer: ci.yml
    release-only:
      run: fires only on a red need, whatever the diff
    owner: ci
    note: >-
      PR-only watcher that cancels a run once a deterministic cheap gate is
      red at its check step, so the heavy tier stops consuming runners; see the comment above
      the job in ci.yml.

  # ── Trust-root diff — informational until promoted with the ruleset ───────
  - context: trust-root-diff
    disposition: informational
    producer: trust-root-diff.yml
    release-only:
      run: cheap trust-boundary check, never keyed on the diff
    owner: maintainer
    note: >-
      Fails an outside PR that touches a path .github/CODEOWNERS owns until a
      code owner approves its current commit. Promote to `gate` in one commit
      together with required-set.json and the ruleset's required checks.

  # ── Panic-scan / cargo-deny / playground / admission (per-change gates) ────
  - context: panic-scan
    disposition: gate
    producer: ci.yml
    release-only:
      run: cheap; runs on every diff
    local:
      tier: quick
      run:
        - cargo test --manifest-path tools/panic-scan/Cargo.toml
        - cmd: cargo run --release --manifest-path tools/panic-scan/Cargo.toml -- --walk src
          differs: CI builds the scanner then runs it from its in-tree target dir; cargo run resolves the local target dir
    guards: Soundness
  - context: cargo-deny
    disposition: gate
    producer: security.yml
    release-only:
      run: audits the bumped Cargo.lock
    local:
      tier: affected
      run:
        - cargo deny check advisories bans licenses sources
    guards: Security
  - context: playground-jail
    disposition: gate
    producer: playground.yml
    release-only:
      pass: the playground jail runs source, not the version
    local:
      ci-only: privileged
    guards: Security
  - context: "linux-x64 (seccomp socket-deny + bubblewrap)"
    disposition: gate
    producer: admission-sandbox.yml
    release-only:
      pass: the admission jail runs source, not the version
    local:
      ci-only: privileged
    guards: Security
  - context: "linux-arm64 (seccomp socket-deny + bubblewrap)"
    disposition: gate
    producer: admission-sandbox.yml
    release-only:
      pass: the admission jail runs source, not the version
    local:
      ci-only: platform
    guards: Security
  - context: "macos-arm64 (sandbox-exec / Seatbelt)"
    disposition: gate
    producer: admission-sandbox.yml
    release-only:
      pass: the admission jail runs source, not the version
    local:
      ci-only: platform
    guards: Security

  # ── Nightly enforcement (per-change gate) ─────────────────────────────────
  # Red unless the latest nightly on main is green and fresh, or this change's
  # own commit passed a dispatched full gate — so a red `nightly-gate` job
  # blocks the next merge (`.github/ci/nightly_green.py`).
  - context: nightly-green
    disposition: gate
    producer: nightly-green.yml
    release-only:
      run: reads run history, never the diff
    local:
      ci-only: run-history
    guards: >-
      Soundness / SEAL — every `nightly-gate` proof (jail, sanitizers,
      seal-modset, browser-e2e) holds on main before another change lands.

  # ── Editor tooling (per-change gate) ──────────────────────────────────────
  # The tree-sitter grammar must accept every reference `.ipe` file (stdlib +
  # examples) with zero ERROR/MISSING — the drift guard keeping the editor
  # grammar in lockstep with the compiler's hand-written parser. Runs on every
  # PR (passes trivially when no grammar/corpus change; blocks only on drift).
  - context: grammar
    disposition: gate
    producer: tree-sitter-ipe.yml
    release-only:
      run: one job with a step-level path filter that already passes a diff outside the grammar
    local:
      tier: full
      run:
        - cmd: tree-sitter generate
          cwd: editors/tree-sitter-ipe
        - cmd: tree-sitter test
          cwd: editors/tree-sitter-ipe
        - bash editors/tree-sitter-ipe/scripts/parity-check.sh
  - context: editors-configure
    disposition: gate
    producer: ci.yml
    release-only:
      pass: the editor configure scripts read no version
    local:
      tier: full
      run:
        - bash editors/tests/configure-test.sh
    guards: >-
      Every editors/*/configure.sh path, plus the one Zed's "install dev
      extension" actually runs and nothing else validated: compiling
      editors/zed-ipe for wasm32-wasip2 from the assembled tree configure.sh
      installs, so a shipped extension config can never go unbuilt.

  # ── E2E + seal-slice aggregators (gate) ───────────────────────────────────
  - context: e2e-all
    disposition: gate
    producer: ci.yml
    release-only:
      pass: the emitted-build shards read source, not the version; seal-smoke proves the version pin
    local:
      tier: full
      run:
        - cmd: cargo nextest run --workspace --profile ci --no-fail-fast
          env:
            IPE_E2E: "1"
            IPE_RUNTIME_DIR: "{repo_root}/src/runtime/rust/src"
          differs: CI runs the same suite from one archive split into heavy and light partitions
    guards: SEAL
    aggregates: [e2e]
  - context: seal-slice
    disposition: gate
    producer: ci.yml
    release-only:
      pass: a release-only diff runs no e2e shards, so there is no shard plan to prove
    local:
      covered-by: e2e-all
    guards: SEAL
    aggregates: [e2e]

  # ── Heavy soundness / sanitizers — nightly-gate ───────────────────────────
  - context: asan-all
    disposition: nightly-gate
    producer: ci.yml
    release-only:
      pass: sanitizer shards read source, not the version
    guards: Soundness
    aggregates: [asan]
  - context: tsan
    disposition: nightly-gate
    producer: ci.yml
    release-only:
      pass: the sanitizer run reads source, not the version
    guards: Soundness
  - context: "seal-modset (vendored emit model)"
    disposition: nightly-gate
    producer: ci.yml
    release-only:
      pass: the vendored emit model reads source, not the version
    guards: SEAL
  - context: "browser-e2e (Ipe.Browser geo+clipboard — headless Playwright)"
    disposition: nightly-gate
    producer: ci.yml
    release-only:
      run: author- and event-gated, never keyed on the diff
    guards: Security

  # ── Cross-platform jail proofs — nightly-gate (Security §1) ───────────────
  # The Linux jail Tier-2 proofs — the containment gate CI produces on GitHub-
  # hosted runners. macOS/Windows/FreeBSD Tier-2 jails need real-OS substrate a
  # hosted runner lacks, so those platforms' build/run-jail containment is
  # verified out-of-band (release checklist) rather than as a CI status context;
  # macos-arm64 (sandbox-exec / Seatbelt) in admission-sandbox.yml is the
  # required macOS containment proof.
  - context: "linux-x64-tier2 (bwrap+seccomp — the real Linux jail proof)"
    disposition: nightly-gate
    producer: ci.yml
    release-only:
      run: author- and event-gated, never keyed on the diff
    guards: Security
  - context: "linux-arm64-tier2 (fifth platform — fail-closed refuse-to-certify proof)"
    disposition: nightly-gate
    producer: ci.yml
    release-only:
      pass: the jail proof runs source, not the version
    guards: Security
  - context: "windows-x64 (Docker Windows container, process isolation)"
    disposition: nightly-gate
    producer: admission-sandbox.yml
    release-only:
      pass: the admission jail runs source, not the version
    guards: Security
  - context: "freebsd-x64 (jail(8) inside vmactions VM)"
    disposition: nightly-gate
    producer: admission-sandbox.yml
    release-only:
      pass: the admission jail runs source, not the version
    guards: Security

  # ── C-free / static portability — nightly-gate + informational ────────────
  - context: "linux-cfree-gate (refusal is fail-closed)"
    disposition: nightly-gate
    producer: static.yml
    guards: Security
  - context: "linux-static-x64 (dlmalloc)"
    disposition: informational
    producer: static.yml
    owner: release
    internal: true
    note: portability build (matrix leg); a red is a build-portability regression, not a guarantee.
  - context: "linux-static-x64 (mimalloc)"
    disposition: informational
    producer: static.yml
    owner: release
    internal: true
    note: portability build (matrix leg).
  - context: "linux-static-arm64 (dlmalloc)"
    disposition: informational
    producer: static.yml
    owner: release
    note: portability build.
  - context: "windows-static (dlmalloc, MSVC +crt-static)"
    disposition: informational
    producer: static.yml
    owner: release
    note: >-
      Portability build. Currently carries continue-on-error:true (a red reports
      GREEN — worse than advisory); drop continue-on-error so the ci-health
      surface can see it. Tracked in the reconciliation doc.
  - context: "freebsd-cross (x86_64-unknown-freebsd, build-only)"
    disposition: informational
    producer: static.yml
    owner: release
    note: >-
      Cross build-only. Currently continue-on-error:true; drop it so the
      surface sees a red.

  # ── Registry publish smoke — informational (advisory live push-path proof) ──
  - context: "publish → admit clean + reject bad → cleanup"
    disposition: informational
    producer: registry-publish-smoke.yml
    owner: release
    note: >-
      Advisory nightly/dispatch live-registry publish smoke; a red signals a
      broken live push-path but never blocks a merge or promotion. The
      registry-admission gate covers the publish logic over a local fixture.

  # ── Install-smoke — informational (installer UX; artifact separately gated) ─
  - context: "install-smoke (ubuntu-latest)"
    disposition: informational
    producer: install-smoke.yml
    release-only:
      run: path-filtered to the installer, which a version bump never touches
    owner: release
  - context: "install-smoke (macos-latest)"
    disposition: informational
    producer: install-smoke.yml
    release-only:
      run: path-filtered to the installer, which a version bump never touches
    owner: release
  - context: "install-smoke (windows-latest)"
    disposition: informational
    producer: install-smoke.yml
    release-only:
      run: path-filtered to the installer, which a version bump never touches
    owner: release
  - context: "install-smoke (freebsd)"
    disposition: informational
    producer: install-smoke.yml
    release-only:
      run: path-filtered to the installer, which a version bump never touches
    owner: release

  # ── Docs deploy — informational ───────────────────────────────────────────
  - context: deploy
    disposition: informational
    producer: docs-pages.yml
    owner: docs
    note: GitHub Pages deploy; not a code guarantee.
  - context: build
    disposition: informational
    producer: playground.yml
    release-only:
      pass: the wasm bundle is built from source, not the version
    owner: docs
    note: playground.yml build leg; playground-jail is the Security gate.

  # ── Path classifiers (gate) ──────────────────────────────────────────────
  # Each workflow's `changes` job, running the fail-closed classifier
  # (.github/ci/change_class.py; ci.yml's `changes` also runs its PROSE-set
  # guard, .github/ci/prose_guard.py, so a PR that makes a PROSE path readable cannot merge). A failed or
  # cancelled `changes` job SKIPS every job that `needs` it, and GitHub counts
  # a skipped required check as passing — so the classifier is itself
  # required: absent proof it ran, the merge is blocked (fail closed). Each carries a workflow-unique name so the
  # required context resolves to exactly one producer.
  - context: changes
    disposition: gate
    producer: ci.yml
    release-only:
      run: the classifier that computes release_only
    local:
      ci-only: classifier
    guards: >-
      Security — fail-closed path classification + the PROSE-set guard: a
      failed classifier cannot skip every ci.yml tier into a passing required
      set, and a PROSE path cannot gain a reader.
  - context: admission-changes
    disposition: gate
    producer: admission-sandbox.yml
    release-only:
      run: the classifier that computes release_only
    local:
      ci-only: classifier
    guards: >-
      Security — fail-closed path classification for the admission jail proofs.
  - context: playground-changes
    disposition: gate
