[workspace]
resolver = "2"
members = [
    "src/compiler/intern",
    "src/compiler/diagnostics",
    "src/compiler/kernels",
    "src/compiler/syntax",
    "src/compiler/parse",
    "src/compiler/db",
    "src/compiler/canon",
    "src/compiler/types",
    "src/compiler/ir",
    "src/compiler/lower",
    "src/compiler/backend",
    "src/compiler/backend/rust",
    "src/compiler/ffi",
    "src/ffi-bindgen-macro",
    "src/compiler/sandbox",
    "src/compiler/watch",
    "src/stdlib",
    "src/ipe-wasm",
    "src/lsp/features",
    "src/lsp/server",
    "src/ipe-cli",
    "tools/e2e-support",
    "src/runtime/rust",
    "tools/ipe-ffi-inspector",
    "src/playground",
]
# `tools/panic-scan` carries its own `[workspace]` so it builds standalone as a
# pre-commit/CI hook without pulling the compiler crates. Excluding it here lets
# `ipe-cli` path-depend on it (the `ipe package audit` provenance scan) without
# cargo seeing two workspace roots.
exclude = ["tools/panic-scan"]

[workspace.package]
edition = "2024"
version = "0.1.17" # x-release-please-version
license = "Apache-2.0"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
pedantic = "deny"
nursery = "deny"

# The workspace's ~180 golden test binaries each statically link the full
# compiler rlib set. With debuginfo on, `ld` must relocate a debug-symbol table
# per binary — the peak allocation OOMs a 7 GB CI linker (`ld terminated with
# signal 7 [Bus error]`). Test debuginfo is never consumed (goldens assert on
# emitted bytes / process output, not under a debugger), so dropping it removes
# the OOM without losing any test signal. `dev` keeps debuginfo for local
# interactive debugging of the library crates.
[profile.test]
debug = 0

[profile.dev]
debug = 1
