[workspace]
resolver = "2"
members = [
    "src/compiler/intern",
    "src/compiler/path-core",
    "src/compiler/diagnostics",
    "src/compiler/kernels",
    "src/compiler/syntax",
    "src/compiler/parse",
    "src/compiler/db",
    "src/compiler/canon",
    "src/compiler/annotate",
    "src/compiler/types",
    "src/compiler/ir",
    "src/compiler/lower",
    "src/compiler/backend",
    "src/compiler/backend/rust",
    "src/compiler/ffi",
    "src/ffi-bindgen-macro",
    "src/compiler/sandbox",
    "src/compiler/watch",
    "src/stdlib",
    "src/wasm",
    "src/lsp/features",
    "src/lsp/server",
    "src/ipe-cli",
    "src/ipe-docs",
    "tools/e2e-support",
    "src/runtime/rust",
    "tools/ipe-ffi-inspector",
    "tools/regen-goldens",
    "examples/wasm/language-playground/jail-runner",
    "src/ipe-wrapper",
]
# `tools/panic-scan` carries its own `[workspace]` so it builds standalone as a
# pre-commit/CI hook without pulling the compiler crates. Excluding it here lets
# `ipe-cli` path-depend on it (the `ipe package audit` provenance scan) without
# cargo seeing two workspace roots.
exclude = ["tools/panic-scan"]

[workspace.package]
edition = "2024"
version = "0.1.76" # x-release-please-version
license = "Apache-2.0"

# THE SSOT for the workspace clippy policy. Every `cargo clippy` — in CI and in
# the docs — is just `-- -D warnings`; it inherits this set, so what is enforced
# is changed in ONE place. Enable as much as is actionable: the broad groups
# plus a cherry-picked slice of `restriction`, with two `cargo` lints allowed
# where they are noise for this workspace.
[workspace.lints.clippy]
# Cherry-picked `restriction` lints (the group is deliberately NOT enabled whole).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
# The broad lint GROUPS, at priority -1 so the specific allows below override them.
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
# Two `clippy::cargo` lints that are noise for THIS workspace; the rest of the
# group stays enforced (wildcard deps, feature-name hygiene):
#  - cargo_common_metadata wants publish metadata (description / license / …) on
#    every crate, but the internal compiler crates are implementation detail,
#    never published separately — only `ipe` ships.
#  - multiple_crate_versions fires on transitive deps pulling different majors
#    (e.g. `bitflags` 1 and 2) — not something this workspace's code controls.
cargo_common_metadata = "allow"
multiple_crate_versions = "allow"

# The workspace's ~180 golden test binaries each statically link the full
# compiler rlib set. With debuginfo on, `ld` must relocate a debug-symbol table
# per binary — the peak allocation OOMs a 7 GB CI linker (`ld terminated with
# signal 7 [Bus error]`). Test debuginfo is never consumed (goldens assert on
# emitted bytes / process output, not under a debugger), so dropping it removes
# the OOM without losing any test signal. `dev` keeps debuginfo for local
# interactive debugging of the library crates.
[profile.test]
debug = 0

[profile.dev]
debug = 1
