[workspace]
resolver = "2"
members = [
    "src/compiler/intern",
    "src/compiler/diagnostics",
    "src/compiler/kernels",
    "src/compiler/syntax",
    "src/compiler/parse",
    "src/compiler/db",
    "src/compiler/canon",
    "src/compiler/types",
    "src/compiler/ir",
    "src/compiler/lower",
    "src/compiler/backend",
    "src/compiler/backend/rust",
    "src/compiler/ffi",
    "src/compiler/sandbox",
    "src/compiler/watch",
    "src/lsp/features",
    "src/lsp/server",
    "src/ipe-cli",
    "tools/oracle",
    "tools/refresh-oracle",
    "src/runtime/rust",
    "tools/ipe-ffi-inspector",
    "tools/parity-matrix",
]

[workspace.package]
edition = "2024"
version = "0.0.0"
license = "Apache-2.0"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
pedantic = "deny"
nursery = "deny"
