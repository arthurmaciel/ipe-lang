[workspace]
resolver = "2"
members = [
    "src/compiler/sky_intern",
    "src/compiler/sky_diagnostics",
    "src/compiler/sky_kernels",
    "src/compiler/sky_syntax",
    "src/compiler/sky_parse",
    "src/compiler/sky_db",
    "src/compiler/sky_canon",
    "src/compiler/sky_types",
    "src/compiler/sky_ir",
    "src/compiler/sky_lower",
    "src/compiler/sky_backend",
    "src/compiler/sky_backend_rust",
    "src/compiler/sky_watch",
    "src/ipe-cli",
    "tools/oracle",
    "tools/refresh-oracle",
    "src/runtime/rust",
    "tools/sky-ffi-inspect-rs",
    "tools/parity-matrix",
]

[workspace.package]
edition = "2024"
version = "0.0.0"
license = "Apache-2.0"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
pedantic = "deny"
nursery = "deny"
