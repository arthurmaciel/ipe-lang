# Merge queue for ipe-lang.
#
# Any non-draft pull request targeting main is queued automatically: Mergify
# batches queued PRs, tests each batch against main together, and merges only
# when the batch is green — main stays green by construction, and a PR that
# breaks its batch is evicted rather than reddening main. Branch protection's
# required checks gate every merge.
#
# Batches are sized for the file-disjoint PRs this repo produces, and
# speculative_checks tests successive batches in parallel to drain faster.
#
# Hold a PR out of the queue by marking it draft or labelling it `do-not-queue`
# (used for release PRs and work in progress).
queue_rules:
  - name: default
    merge_method: squash
    batch_size: 10
    speculative_checks: 2

pull_request_rules:
  - name: auto-queue ready pull requests
    conditions:
      - base=main
      - "-draft"
      - "-label=do-not-queue"
    actions:
      queue:
        name: default
