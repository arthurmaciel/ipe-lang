[package]
name = "oracle"
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
name = "oracle"
path = "src/lib.rs"

[dependencies]
# Hashing of Main.sky for the staleness gate, plus hex rendering of the digest.
sha2 = "0.10"
hex = "0.4"
# Parsing `cargo build --message-format=json` to locate the emitted binary.
serde_json = "1"

[lints]
workspace = true
