[package]
name = "ipe-ffi-inspector"
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
description = "Rust crate inspector for Ipe FFI — uses rustdoc JSON for complete API discovery including macro-generated items"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ipe_env = { path = "../../src/compiler/env" }
ipe_sandbox = { path = "../../src/compiler/sandbox" }
ipe_diagnostics = { path = "../../src/compiler/diagnostics" }


[dev-dependencies]
tempfile = "3"
ipe-test-temp = { path = "../test-temp" }

[lints.rust]
# Mirrors the workspace `unsafe_code` deny (this crate keeps its own `[lints]`).
unsafe_code = "deny"

[lints.clippy]
# Mirrors the workspace `mem_forget` deny: a forgotten `Drop` guard leaks.
mem_forget = "deny"
# unwrap/expect/panic are used in test assertions and controlled CLI
# exit-on-error paths; the token-level panic-scan gate governs those, not the
# clippy lint groups. The pedantic/style/complexity/correctness groups ARE
# enforced here (workspace clippy gate), so no blanket escape for them.
unwrap_used = "allow"
expect_used = "allow"
panic = "allow"
