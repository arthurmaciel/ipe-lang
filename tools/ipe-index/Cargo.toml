[package]
name = "ipe-index"
license = "Apache-2.0"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
regex = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
tree-sitter = "0.22"
tree-sitter-rust = "0.21"
tree-sitter-typescript = "0.21"

[profile.dev]
debug = 0

# Standalone dev tool — detached from the compiler workspace so it keeps its own
# edition/lints and its own target dir.
[workspace]
