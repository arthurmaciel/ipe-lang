name = "bevy-game"
version = "0.1.0"
entry = "src/Main.ipe"
backend = "rust"

[source]
root = "src"

# The REAL crates.io `bevy_ecs` crate, auto-FFI-bound shim-free. Bindings are
# generated locally (sandboxed) into .ipe/cache/ffi/rust, which is gitignored —
# run `ipe install --yes --allow-build-scripts` to produce them before building.
[rust.dependencies]
bevy_ecs = "=0.19.0"
