# examples/sky/manifest.toml
#
# Registry of upstream Sky examples covered by the Sky→Ipê syntactic patch.
# The patch itself is the single global rename-map.tsv applied by
# scripts/equivalence-checks/sky-to-ipe-transform.py — a token-rewrite that
# survives any line-position changes between Sky releases (unlike a *.patch).
#
# PATCH SCOPE: rename-map.tsv is sufficient for every example listed here.
# All Sky→Ipê differences are purely syntactic module-qualifier rewrites
# (Sky.Core.* / Sky.Http.* / Std.* / Sky.Ffi / Sky.Test → Ipe.*) plus the
# .sky→.ipe extension and sky.toml `entry` key. No example in this list
# requires a behaviour-changing delta; such a delta would be a compiler/stdlib
# gap to file, never a patch.
#
# HOW THE SWEEP USES THIS FILE
# scripts/equivalence-checks/examples-sweep.sh with IPE_SWEEP_MIRROR_SKY=1
# calls mirror_sky_examples (scripts/lib/sky_mirror.sh) which:
#   1. Copies ../sky/examples/<name> (fallback: fetches anzellai/sky) into
#      examples/sky/<name>/ (git-ignored — regenerated each run).
#   2. Applies rename-map.tsv via sky-to-ipe-transform.py (token rewrite).
#   3. Hands the patched tree to the normal BUILD/RUN/EQUIVALENCE pipeline.
#
# ADDING A NEW UPSTREAM EXAMPLE
# When anzellai/sky adds an example not listed here the sweep emits a loud
# FAIL for that example (unpatched-new-example). Add it here once you have
# verified the global rename-map covers it (or extended the map / added a
# per-example override). Never let an unpatched example silently skip.
#
# FORMAT: one [[example]] section per Sky-derived example.
#   name         = upstream directory name
#   sky_source   = "sibling" | "network" (how the sweep fetches the source)
#   patch        = "global-rename-map" | "global-rename-map+<override-file>"
#   go_ffi       = true if the example imports Go packages (excluded from Rust
#                  build; checked by is_out_of_scope in lib/examples.sh)
#   notes        = free-form, optional

# ── Pure Ipê / no Go-FFI ─────────────────────────────────────────────────────

