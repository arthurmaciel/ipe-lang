# examples/sky/manifest.toml
#
# Registry of the upstream Sky examples this repo mirrors into buildable-on-Ipê
# ports. It classifies which examples are in scope for the Rust backend; the
# regen script + sweep read it to know every upstream example that MUST have a
# verified transform.
#
# TRANSFORM MECHANISM (two ordered steps, per example — see examples/sky/README.md):
#   1. rename-map.tsv (via tools/scripts/lib/sky-to-ipe-transform.py) — the shared,
#      drift-resistant token rewrite: Sky.Core.* / Sky.Http.* / Sky.Ffi /
#      Sky.Test / Std.* → Ipe.*, plus the .sky→.ipe extension and sky.toml
#      `entry` key. Sufficient for every example whose delta is purely syntactic.
#   2. ipe-edits/<name>.edits — an OPTIONAL per-example set of content-anchored
#      find/replace edits for a semantic delta the token rewrite cannot express.
#      Anchored on the exact source text (never a line number), so they survive
#      the line shifts upstream makes between releases. Absent when the transform
#      alone suffices (the common case).
#
# HOW THE REGEN + SWEEP USE THIS FILE
# tools/scripts/regen-sky-examples.sh (and the sweep) call mirror_sky_examples:
#   1. Fetch examples/<name> from upstream GitHub (anzellai/sky): the raw tree
#      lands in examples/sky/original/<name>/, its Ipê port in examples/sky/ipe/<name>/.
#   2. Apply rename-map.tsv then ipe-edits/<name>.edits to the port.
#   3. The sweep then BUILD (ipe build + cargo build) + RUN the port.
#
# ADDING A NEW UPSTREAM EXAMPLE
# When anzellai/sky adds an example not listed here the sweep emits a loud
# FAIL for that example (unpatched-new-example). Add it here once you have
# verified the transform (+ any ipe-edits) covers it. Never let an unpatched
# example silently skip.
#
# FORMAT: one [[example]] section per Sky-derived example.
#   name         = upstream directory name
#   patch        = "rename-map" | "rename-map+ipe-edit" | "override"
#                  ("override" = a whole-port rebuild lives in
#                  examples/sky/ipe-overrides/<name>/; the transform is skipped)
#   go_ffi       = true if the example imports Go packages (excluded from Rust
#                  build; checked by is_out_of_scope in lib/examples.sh)
#   shape        = "program" | "console" | "tui" | "web" | "webview" | "server"
#                  Inferred from the ipe/ source imports; used by check-sky-ports.sh
#                  to dispatch the correct run strategy.
#   verify       = "run" | "build" | "serve"
#                  Selects how check-sky-ports.sh exercises the port:
#                    run   — run to exit 0 (CLI / program shape)
#                    build — build only (tui/webview/composite; needs infra to run)
#                    serve — build + bounded HTTP smoke (web/server; smoke deferred
#                            to a later increment; treated as build-only for now)
#   status       = "green" | "ice-blocked" | "deps-deferred" | "broken"
#                  green         — full emit+build+run passes; gate enforces it
#                  ice-blocked   — compiler ICE blocks emit; tracked, not gated
#                  deps-deferred — cargo fails only on absent system libs
#                                  (glib/webkit); builds in a later increment
#                  broken        — emit-ok but cargo-fail (non-syslib) or run-fail
#                                  on a compiler/API gap; tracked, not gated
#   parity       = "exact" | "normalized" | "skip"  (OPTIONAL; default "exact")
#                  Applies only to green run-verify program/console ports that
#                  check-sky-parity.sh compares against upstream sky run output.
#                  exact      — byte-identical stdout expected (pure, deterministic)
#                  normalized — stdout is compared after stripping known
#                               nondeterministic tokens (e.g. ISO timestamps);
#                               the normalization rule is documented inline
#                  skip       — output is intrinsically nondeterministic (random
#                               tokens, UUIDs, timing-dependent values); parity
#                               check is skipped with a printed reason
#   parity_skip_reason = one-line explanation required when parity = "skip"
#   blocked      = OPTIONAL reason string when the example exercises an Ipê
#                  feature not yet implemented (a tracked compiler gap). The
#                  sweep marks it a documented SKIP, never a surprise RED.
#   notes        = free-form, optional

# ── Pure Ipê / no Go-FFI ─────────────────────────────────────────────────────

[[example]]
name = "00-standard-libs"
patch = "rename-map+ipe-edit"
go_ffi = false
shape  = "program"
verify = "run"
status = "green"
parity = "skip"
parity_skip_reason = "retry tests migrated off the removed synchronous Task.perform (IPE-N0036); taskRetrySuite dropped — RetryPolicy field access ICEs (IPE-I0001); output diverges from upstream by design"

