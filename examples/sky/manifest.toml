# examples/sky/manifest.toml
#
# Registry of the upstream Sky examples this repo mirrors + patches into
# buildable-on-Ipê examples. It classifies which examples are in scope for the
# Rust backend; the sweep (scripts/examples-sweep.sh) reads it to know every
# upstream example that MUST have a verified patch.
#
# PATCH MECHANISM (two ordered steps, per example — see examples/sky/README.md):
#   1. rename-map.tsv (via scripts/lib/sky-to-ipe-transform.py) — the shared,
#      drift-resistant token rewrite: Sky.Core.* / Sky.Http.* / Sky.Ffi /
#      Sky.Test / Std.* → Ipe.*, plus the .sky→.ipe extension and sky.toml
#      `entry` key. Sufficient for every example whose delta is purely syntactic.
#   2. ipe-patches/<name>.patch — an OPTIONAL per-example unified diff applied on
#      top, for a semantic delta the token rewrite cannot express. Absent when
#      the transform alone suffices (the common case). A behavioural NEED that a
#      patch cannot cleanly express is a compiler/stdlib gap to FILE in
#      BLOCKERS.md, never a hack.
#
# HOW THE SWEEP USES THIS FILE
# scripts/examples-sweep.sh calls mirror_sky_examples (scripts/lib/mirror.sh):
#   1. Copies ../sky/examples/<name> (fallback: fetches anzellai/sky) into
#      examples/sky/<name>/ (git-ignored — regenerated each run).
#   2. Applies rename-map.tsv then ipe-patches/<name>.patch.
#   3. Hands the patched tree to the BUILD (ipe build + cargo build) + RUN pipeline.
#
# ADDING A NEW UPSTREAM EXAMPLE
# When anzellai/sky adds an example not listed here the sweep emits a loud
# FAIL for that example (unpatched-new-example). Add it here once you have
# verified the transform (+ any ipe-patch) covers it. Never let an unpatched
# example silently skip.
#
# FORMAT: one [[example]] section per Sky-derived example.
#   name         = upstream directory name
#   sky_source   = "sibling" | "network" (how the sweep fetches the source)
#   patch        = "rename-map" | "rename-map+ipe-patch"
#   go_ffi       = true if the example imports Go packages (excluded from Rust
#                  build; checked by is_out_of_scope in lib/examples.sh)
#   notes        = free-form, optional

# ── Pure Ipê / no Go-FFI ─────────────────────────────────────────────────────

