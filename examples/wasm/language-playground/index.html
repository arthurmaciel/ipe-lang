<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- The same policy the run server sends on GET / (without `frame-ancestors`,
       which only a header can carry), so a static host enforces it too. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'" />
  <title>Ipê playground</title>
  <style>
    /* The default palette matches the original playground (slate). Every
       colour is a CSS variable so a chosen ACE theme can re-theme the whole
       interface, not just the editor. JS overrides these variables from the
       selected theme's computed background/foreground. */
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --border: #334155;
      --fg: #e2e8f0;
      --muted: #94a3b8;
      --accent: #2563eb;
      --accent-fg: #ffffff;
      --ok: #34d399;
      --err: #f87171;
      --warn: #fbbf24;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--fg);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 12px 20px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    header h1 { font-size: 1.1rem; font-weight: 600; color: var(--fg); }
    header .badge {
      font-size: 0.7rem;
      background: var(--accent);
      color: var(--accent-fg);
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 500;
    }
    .spacer { margin-left: auto; }
    label.control {
      font-size: 0.8rem;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    select {
      background: var(--bg);
      color: var(--fg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 5px 8px;
      font-size: 0.85rem;
    }
    #run-btn {
      padding: 7px 18px;
      background: var(--accent);
      color: var(--accent-fg);
      border: none;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #run-btn:hover { filter: brightness(1.1); }
    #run-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    #run-btn svg { fill: currentColor; }
    a.gh {
      color: var(--muted);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
    }
    a.gh:hover { color: var(--fg); }
    a.gh svg { fill: currentColor; }
    main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      min-height: 0;
    }
    #editor-pane, #output-pane, #run-pane {
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    #editor-pane { border-right: 1px solid var(--border); }
    #run-pane { border-left: 1px solid var(--border); }
    .pane-label {
      padding: 8px 12px;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #editor { flex: 1; min-height: 0; width: 100%; font-size: 14px; }
    #output, #run-output {
      flex: 1;
      margin: 0;
      padding: 16px;
      overflow: auto;
      background: var(--bg);
      color: var(--fg);
      font-family: "JetBrains Mono", "Fira Code", ui-monospace, monospace;
      font-size: 0.8rem;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }
    #output.err, #run-output.err { color: var(--err); }
    #run-output.warn { color: var(--warn); }
    #status-bar {
      padding: 6px 12px;
      font-size: 0.75rem;
      background: var(--panel);
      border-top: 1px solid var(--border);
      color: var(--muted);
      min-height: 28px;
    }
    #status-bar.error { color: var(--err); }
    #status-bar.ok { color: var(--ok); }
    #status-bar.compiling { color: var(--warn); }
  </style>
  <!-- Every script is a same-origin file from this directory: ACE is vendored
       under `static/vendor/ace/`, and `static/app.js` holds the page logic. -->
  <script src="static/vendor/ace/ace.js"></script>
  <script src="static/vendor/ace/ext-themelist.js"></script>
  <script type="module" src="static/app.js"></script>
</head>
<body>
  <header>
    <h1>Ipê playground</h1>
    <span class="badge">in-browser WASM compiler</span>
    <label class="control">
      Theme
      <select id="theme-select" aria-label="Editor and interface theme"></select>
    </label>
    <button id="run-btn" title="Build and run on the server, sandboxed (Ctrl/Cmd+Enter)">
      <svg width="13" height="13" viewBox="0 0 16 16" aria-hidden="true"><polygon points="3,2 13,8 3,14"/></svg>
      Run
    </button>
    <span class="spacer"></span>
    <a class="gh" href="https://github.com/ipe-lang/compiler/tree/main/examples/wasm/language-playground" target="_blank" rel="noopener">
      <svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true">
        <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
      </svg>
      GitHub
    </a>
  </header>
  <main>
    <div id="editor-pane">
      <div class="pane-label">Ipê source</div>
      <div id="editor"></div>
    </div>
    <div id="output-pane">
      <div class="pane-label"><span id="output-title">Emitted Rust</span></div>
      <pre id="output">Loading the in-browser compiler…</pre>
    </div>
    <div id="run-pane">
      <div class="pane-label"><span id="run-title">Program output</span></div>
      <pre id="run-output">Press Run to build and execute the emitted Rust on the server (sandboxed).</pre>
    </div>
  </main>
  <div id="status-bar">Initialising…</div>

</body>
</html>
