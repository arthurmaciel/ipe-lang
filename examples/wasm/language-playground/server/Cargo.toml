[package]
name = "ipe-playground"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "Playground backend: compile Ipê source to WASM in a sandboxed subprocess and serve the bundle."

[lib]
name = "ipe_playground"
path = "src/lib.rs"

[[bin]]
name = "ipe-playground"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["json"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.5", features = ["cors", "fs"] }
tempfile = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
# The isolation jail: every build+run of user-derived code goes through
# `run_in_bwrap_jail` (bubblewrap + prlimit + timeout), never a raw subprocess.
ipe_sandbox = { path = "../../../../src/compiler/sandbox" }

[lints]
workspace = true
