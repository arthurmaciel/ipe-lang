name = "skyshop"
version = "0.1.0"
entry = "src/Main.ipe"
backend = "rust"

[source]
root = "src"

[live]
port = 8000
store = "memory"

# The REAL SDK crates, auto-FFI-bound shim-free. Bindings are generated locally
# (sandboxed) into .ipe/cache/ffi/rust, which is gitignored — run
# `ipe install --yes --allow-build-scripts` to produce them before building.
[rust.dependencies]
firestore = "=0.49.0"
async-stripe = { version = "=1.0.0-rc.6", features = ["default-tls"] }
async-stripe-types = "=1.0.0-rc.6"
async-stripe-shared = "=1.0.0-rc.6"
async-stripe-client-core = "=1.0.0-rc.6"
async-stripe-checkout = { version = "=1.0.0-rc.6", features = ["checkout_session"] }
async-stripe-core = { version = "=1.0.0-rc.6", features = ["customer"] }
rs-firebase-admin-sdk = "4.3"
