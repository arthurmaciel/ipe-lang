name: heavy

# Self-hosted heavy CI per docs/architecture/ci-and-hosting.md.
# Runs on the local dev box (the only host with the RAM AND the Go `sky`
# oracle for behavioural parity). Fires on push to main, on PRs, nightly,
# and on manual dispatch.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * *'   # 06:00 UTC ≈ 03:00 America/Sao_Paulo (nightly)
  workflow_dispatch: {}

jobs:
  sweep-and-parity:
    runs-on: [self-hosted, heavy]   # label set when registering the local runner
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive   # vendor/upstream-sky (Go `sky` oracle + runtime-go)

      - name: fmt --check
        run: cargo fmt --all -- --check

      - name: clippy -D warnings
        run: cargo clippy --all-targets -- -D warnings

      - name: build
        run: cargo build

      - name: test
        run: cargo test

      - name: miri (mutation-heavy crates)
        run: cargo +nightly miri test -p sky_intern -p sky_ir -p sky_types -p sky_lower -p sky_diagnostics

      - name: example sweep (Rust backend, byte/behaviour)
        run: |
          if [ -x ./scripts/example-sweep.sh ]; then
            ./scripts/example-sweep.sh
          else
            echo "scripts/example-sweep.sh not present yet — skipping (best-effort placeholder)"
          fi

      - name: behavioural parity (sky[Go] vs skyc[Rust])
        run: |
          if [ -x ./scripts/parity-sweep.sh ]; then
            ./scripts/parity-sweep.sh
          else
            echo "scripts/parity-sweep.sh not present yet — skipping (best-effort placeholder)"
          fi

      - name: perf sweep
        run: |
          if [ -x ./scripts/perf-sweep.sh ]; then
            ./scripts/perf-sweep.sh
          else
            echo "scripts/perf-sweep.sh not present yet — skipping (best-effort placeholder)"
          fi
