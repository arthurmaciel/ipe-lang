# Admission gate for the curated Ipê package index — the fail-closed trust
# boundary of docs/adr/0044. A publish PR only touches packages/<name>.toml; this
# workflow is the authority that decides whether it may merge. The client that
# opened the PR holds no index credentials — the trust chain is that the index
# vouches for a merged entry's pinned, hashed, gated source, and this job is where
# that vouching happens.
#
# THIS FILE IS THE SCAFFOLD, not the running workflow. It is authored in the Ipê
# compiler repo (misc/index-repo/) and copied into the hosted index repository,
# where `.github/workflows/admission.yml` must be a REQUIRED status check on the
# branch-protection rule for `main` — otherwise the gate is advisory and a red
# result would still be mergeable, which would break the fail-closed guarantee.
#
# Steps, in order, each fail-closed (a non-zero exit blocks the merge):
#   1. Validate the submitted entry against the schema (ipe package validate-entry).
#   2. Verify the source pin — fetch the pinned rev and check its tree hash equals
#      the entry's sha256 — by driving the shipped resolver (ipe add), which
#      performs exactly that verify-before-trust fetch.
#   3. Re-run the Tier-1 package gate (ipe package audit) on the fetched source,
#      with the pre-PR index as the semver baseline.
#   4. Merge only when all of the above are green (an auto-merge step, gated by the
#      branch protection this workflow is a required check for).
name: admission

on:
  pull_request:
    paths:
      - 'packages/**'

# Read the repo and the PR; request write only for the optional auto-merge step.
# No credential of this workflow's own — it uses the ambient GITHUB_TOKEN.
permissions:
  contents: read
  pull-requests: write

concurrency:
  group: admission-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  admit:
    name: admit index entry
    runs-on: ubuntu-latest
    steps:
      # The PR head (the submitted entry) and, separately, the base (the index as
      # it stands before this PR) — the base is the semver baseline for the gate.
      - name: Check out the PR head
        uses: actions/checkout@v7
        with:
          path: head
          fetch-depth: 0
      - name: Check out the index base
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - name: Install the pinned ipe release
        shell: bash
        env:
          IPE_INSTALL_DIR: ${{ runner.temp }}/ipe
        run: |
          set -eu
          # Pin the toolchain the gate runs — an entry is admitted by a known ipe
          # version, never "whatever is latest". Bump deliberately.
          IPE_VERSION="0.1.28" sh head/scripts/install.sh
          echo "$IPE_INSTALL_DIR" >> "$GITHUB_PATH"

      # A publish PR must add or change exactly one packages/<name>.toml. Refuse a
      # PR that touches none, or more than one, or anything outside packages/ —
      # the gate reasons about a single submitted entry.
      - name: Identify the submitted entry
        id: entry
        shell: bash
        run: |
          set -eu
          cd head
          base_sha='${{ github.event.pull_request.base.sha }}'
          changed="$(git diff --name-only "$base_sha"...HEAD)"
          entries="$(printf '%s\n' "$changed" | grep -E '^packages/[^/]+\.toml$' || true)"
          nonentry="$(printf '%s\n' "$changed" | grep -vE '^packages/[^/]+\.toml$' || true)"
          if [ -n "$nonentry" ]; then
            echo "refused: a publish PR changes only packages/<name>.toml; also changed:" >&2
            printf '%s\n' "$nonentry" >&2
            exit 1
          fi
          count="$(printf '%s\n' "$entries" | grep -c . || true)"
          if [ "$count" != "1" ]; then
            echo "refused: expected exactly one changed entry file, found $count" >&2
            printf '%s\n' "$entries" >&2
            exit 1
          fi
          echo "file=$entries" >> "$GITHUB_OUTPUT"
          name="$(basename "$entries" .toml)"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      # 1. Schema validation — fail-closed on any malformed field. The validator is
      #    the resolver's own parser, so a file that passes here is a file the
      #    resolver will read.
      - name: Validate the entry against the schema
        shell: bash
        run: ipe package validate-entry "head/${{ steps.entry.outputs.file }}"

      # 2. Source-pin verification. `ipe add` fetches the pinned rev and verifies
      #    the fetched tree's hash equals the entry's sha256 (verify-before-trust);
      #    a swapped tree or a wrong hash is a hard failure here. Run in a throwaway
      #    project whose index is the PR-head index (so the new entry is visible).
      - name: Verify the source pin
        shell: bash
        env:
          IPE_INDEX_DIR: ${{ github.workspace }}/head
        run: |
          set -eu
          work="$(mktemp -d)"
          cd "$work"
          ipe init --yes >/dev/null 2>&1 || ipe init >/dev/null 2>&1 || true
          # `ipe add <name>` resolves the highest published version, fetches the
          # pinned source, and verifies its sha256 — the shipped trust boundary.
          ipe add "${{ steps.entry.outputs.name }}"

      # 3. The Tier-1 package gate on the fetched source, with the pre-PR index as
      #    the semver baseline. The author's local run was advisory; THIS run is
      #    authoritative.
      - name: Re-run the package gate on the pinned source
        shell: bash
        env:
          IPE_INDEX_DIR: ${{ github.workspace }}/base
        run: |
          set -eu
          # Fetch the exact pinned source out of the verified entry, then audit it
          # against the base index as the previous-version baseline.
          src="$(mktemp -d)"
          file="head/${{ steps.entry.outputs.file }}"
          source_url="$(grep -m1 '^source' "$file" | sed -E 's/.*"(.*)".*/\1/')"
          rev="$(grep -m1 '^rev' "$file" | sed -E 's/.*"(.*)".*/\1/')"
          git clone --quiet "$source_url" "$src/pkg"
          git -C "$src/pkg" checkout --quiet "$rev"
          ipe package audit "$src/pkg" --index "${{ github.workspace }}/base"

  # Auto-merge is optional and lives behind branch protection: it only merges
  # because the `admit` job above is a REQUIRED check, so a red gate blocks the
  # merge regardless of this step. Without that branch-protection rule this step
  # is inert, and the gate is still fail-closed (a red `admit` blocks a manual
  # merge too).
  merge:
    name: merge on green
    needs: admit
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge --squash --auto "${{ github.event.pull_request.number }}"
