[package]
name = "ipe_wrapper"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "ipe-wrapper"
path = "src/main.rs"

[dependencies]
ipe_sandbox = { path = "../compiler/sandbox" }
# Scratch-directory names draw from each target's real CSPRNG with no weaker
# fallback (`getrandom(2)` / `BCryptGenRandom`).
getrandom = { version = "0.3", features = ["std"] }

[dev-dependencies]
ipe_kernels = { path = "../compiler/kernels" }

[lints]
workspace = true
