[package]
name = "ipe_intern"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
ipe_diagnostics = { path = "../diagnostics" }
# Phase 6.5 (symbol-relocation persistence): `Symbol`'s ambient-interner
# `serde::Serialize`/`Deserialize` impls — see the type's own doc for why a
# derived impl is impossible (a `Symbol` is a process-local interner index)
# and why the relocation pass lives here rather than at a persistence
# boundary crate.
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
