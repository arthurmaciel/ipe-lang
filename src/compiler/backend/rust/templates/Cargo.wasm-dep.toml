[package]
name = "ipe-app"
version = "0.1.0"
edition = "2024"
# The crate root is `src/main.rs` (shared layout with the binary targets);
# without this cargo would ALSO infer a `[[bin]]` from that path.
autobins = false

[features]
default = []
alloc_dlmalloc = ["dep:dlmalloc"]
alloc_mimalloc = ["dep:mimalloc"]

[lib]
# Browser WASM module. Same source layout as the binary targets; the crate
# root stays `src/main.rs`.
name = "ipe_app"
crate-type = ["cdylib"]
path = "src/main.rs"

[dependencies]
dlmalloc = { version = "0.2", features = ["global"], optional = true }
mimalloc = { version = "0.1", optional = true, default-features = false }
# The Ipê runtime, bundled alongside this crate under `ipe_runtime_dep/`,
# built for `wasm32-unknown-unknown` with the reached features. The `wasm-client`
# floor feature transitively pulls the whole closed browser module set (and its
# browser-glue crates — wasm-bindgen, web-sys, js-sys, gloo-timers, getrandom/js,
# console_error_panic_hook — from the runtime crate's own wasm32 `[target]`
# table), so this app crate declares no browser-glue dependency of its own beyond
# the two it references BY PATH below. A relative path: `cargo build` works in
# any environment because the runtime source is local.
ipe_runtime = { package = "ipe-runtime-rust", path = "ipe_runtime_dep", default-features = false, features = [__IPE_RUNTIME_FEATURES__] }
# The emitted entry is `#[wasm_bindgen::prelude::wasm_bindgen(start)] fn
# ipe_start`, so the app crate references `wasm-bindgen` by path. Pinned exact:
# the JS glue is generated by the wasm-bindgen CLI, which requires a byte-matching
# crate version. The runtime crate pins the SAME version for its own wasm arm, so
# cargo unifies both onto one lockfile node.
wasm-bindgen = "=0.2.126"
# The emitted TEA `Model` / `Msg` / record types derive `serde::Serialize` /
# `serde::Deserialize` BY PATH (the browser wire + form decode). The runtime's
# own `serde` is a private dependency not re-exported, so the app crate declares
# its own — pinned + `derive`-featured identically.
serde = { version = "1", features = ["derive"] }

[profile.dev]
debug = 0
incremental = true
overflow-checks = false

[profile.release]
opt-level = "z"
lto = true
panic = "abort"
strip = true

# Detach this generated crate from any ancestor cargo workspace so it builds
# hermetically even when emitted inside another workspace tree.
[workspace]
