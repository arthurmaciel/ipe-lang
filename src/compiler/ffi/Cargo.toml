[package]
name = "ipe_ffi"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "Shim-free Rust-crate FFI binding generator: typed decode of inspector output, call-AST validation, and artifact emission"

[dependencies]
ipe_diagnostics = { path = "../diagnostics" }
ipe_canon = { path = "../canon" }
ipe_intern = { path = "../intern" }
ipe_kernels = { path = "../kernels" }
# The asserted-call surface (`Rust.Ffi.call`) parses the author's annotation
# straight from the source AST — never from re-rendered text.
ipe_syntax = { path = "../syntax" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The Tier-2 wrapper capability scan lexes wrapper Rust with the SAME
# proc-macro2 token model `tools/panic-scan` uses, so a capability-bearing path
# named inside a string literal or a comment is invisible and one split across
# lines is still found. `span-locations` supplies the 1-based line a diagnostic
# points at.
proc-macro2 = { version = "1", features = ["span-locations"] }

[lints]
workspace = true
