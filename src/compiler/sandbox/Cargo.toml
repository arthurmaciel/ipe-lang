[package]
name = "ipe_sandbox"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "Isolation jail for compiling/inspecting untrusted foreign crates: bubblewrap-primary, proven-unshare fallback, fail-closed refusal"

[dependencies]
ipe_diagnostics = { path = "../diagnostics" }
ipe_kernels = { path = "../kernels" }
serde = { version = "1", features = ["derive"] }

# Used on Unix (FreeBSD, macOS, Linux) for `getuid(3)` in the exclusive jail-dir
# ownership verification — the only way to obtain the current uid without
# shelling out or reading a non-authoritative file.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The Windows run-jail arm builds its confinement primitives directly through the
# Win32 kernel API (Job Object, AppContainer lowbox token, capability SIDs, ACLs,
# CreateProcess with an extended startup-info attribute list). `windows-sys` is
# the same crate (and the 0.61 major already resolved in the workspace lockfile)
# the rest of the dependency tree pulls in; only the features the arm calls are
# enabled so the build surface stays minimal.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_AppLocker",
    "Win32_Security_Isolation",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_SystemServices",
    "Win32_Storage_FileSystem",
] }

[lints]
workspace = true
