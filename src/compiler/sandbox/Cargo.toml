[package]
name = "ipe_sandbox"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "Isolation jail for compiling/inspecting untrusted foreign crates: bubblewrap-primary, proven-unshare fallback, fail-closed refusal"

[dependencies]
ipe_diagnostics = { path = "../diagnostics" }
ipe_kernels = { path = "../kernels" }
ipe_env = { path = "../env" }
serde = { version = "1", features = ["derive"] }
# Scratch names draw 128 bits from each target's real CSPRNG (`getrandom(2)`,
# `BCryptGenRandom`) with no weaker fallback. `std` supplies the
# `getrandom::Error` -> `io::Error` conversion.
getrandom = { version = "0.3", features = ["std"] }

# `O_NOFOLLOW` for the private-scratch exclusive file open.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
# The effective uid/gid the private-scratch and jail-dir ownership checks compare
# against, obtained without `unsafe`.
rustix = { version = "0.38", features = ["fs", "process"] }

# The Windows run-jail arm builds its confinement primitives through the Win32
# kernel API (Job Object, AppContainer lowbox token, capability SIDs, ACLs,
# CreateProcess with an extended startup-info attribute list). `windows-sys` is
# the same crate (and the 0.61 major already resolved in the workspace lockfile)
# the rest of the dependency tree pulls in; only the features the arm calls are
# enabled so the build surface stays minimal.
[target.'cfg(windows)'.dependencies]
# The safe Job Object lifecycle (create, assign, close on drop), so those calls
# carry no `unsafe` of this crate's own.
win32job = "2"
# The plain drive-letter form of a canonical path wherever it names the same file:
# the jail hands canonical paths to PowerShell and the ACL grants, and a verbatim
# `\\?\` path is not accepted by every consumer.
dunce = "1"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_AppLocker",
    "Win32_Security_Isolation",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_SystemServices",
    "Win32_Storage_FileSystem",
] }

[dev-dependencies]
ipe-test-temp = { path = "../../../tools/test-temp" }

# `rerun_this_test_exact`: the Windows e2e env test's re-exec must prove the
# child ran its test, not merely exited 0.
[target.'cfg(windows)'.dev-dependencies]
e2e-support = { path = "../../../tools/e2e-support" }

[lints]
workspace = true
