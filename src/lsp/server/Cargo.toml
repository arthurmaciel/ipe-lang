[package]
name = "ipe_lsp_server"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
ipe_db = { path = "../../compiler/db" }
ipe_diagnostics = { path = "../../compiler/diagnostics" }
ipe_lsp_features = { path = "../features" }
lsp-server = "0.7"
