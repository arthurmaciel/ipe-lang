[package]
name = "ipe"
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
name = "ipe"
path = "src/lib.rs"

[[bin]]
name = "ipe"
path = "src/main.rs"

[dependencies]
ipe_stdlib = { path = "../stdlib" }
ipe_kernels = { path = "../compiler/kernels" }
ipe_intern = { path = "../compiler/intern" }
ipe_diagnostics = { path = "../compiler/diagnostics" }
ipe_parse = { path = "../compiler/parse" }
ipe_syntax = { path = "../compiler/syntax" }
ipe_db = { path = "../compiler/db" }
ipe_canon = { path = "../compiler/canon" }
ipe_types = { path = "../compiler/types" }
ipe_lower = { path = "../compiler/lower" }
ipe_ir = { path = "../compiler/ir" }
ipe_backend = { path = "../compiler/backend" }
ipe_backend_rust = { path = "../compiler/backend/rust" }
ipe_ffi = { path = "../compiler/ffi" }
ipe_sandbox = { path = "../compiler/sandbox" }
ipe_lsp_server = { path = "../lsp/server" }
# Phase 7 (`crate::watch` — Tasks 21-25): the confined watcher + process
# supervisor primitives, and the two crates `watch.rs` drives directly —
# `salsa` for `Cancelled::catch`/`Setter` (Task 25's cancellation) and
# `notify` for the raw filesystem watch (Task 21). Same salsa pin as
# `ipe_db` (`crates/ipe_db/Cargo.toml`) — one version across the workspace.
ipe_watch = { path = "../compiler/watch" }
salsa = "=0.27.2"
notify = "8"
# On-disk build cache (`src/cache.rs`) — content hashing of the whole-project
# key + the compiler/toolchain version-epoch, and JSON (de)serialization of the
# cached `EmittedProject`.
sha2 = "0.10"
hex = "0.4"
serde_json = "1"
# `[dependencies]` version requirements in `ipe.toml` are parsed into typed
# `semver::VersionReq` at manifest-parse time (parse, don't validate).
semver = "1"
# The Tier-2 wrapper capability gate reads a wrapper crate's `Cargo.toml`
# dependency tables STRUCTURALLY (parse, don't validate): a hand-rolled line
# scan under-refuses on valid-but-unusual TOML (a trailing comment on a header,
# whitespace inside `[ dependencies ]`, an inline `dependencies = { … }`
# table), and any missed dependency would admit an unconstrained capability.
# Same `toml` version the runtime crate already pins, so this adds no new crate
# to the vetted dependency graph.
toml = "0.8"
# The runtime crate SOURCE (`../runtime/rust`: its `Cargo.toml` + `src/**`) is
# compiled INTO this binary as a static directory tree, so a copied `ipe`
# binary carries its own runtime source and never needs a separate download.
# `include_dir` walks the tree at build time and embeds each file as a byte
# slice — source only, no object code (the rejected prebuilt-rlib route). The
# tree is written to `<IPE_HOME>/runtime/<version>/rust` on demand and built
# locally.
include_dir = "0.7"
# The `ipe package audit` provenance panic-scan reuses the SAME token scanner the
# repo's abrupt-failure attestation hook runs (`tools/panic-scan`), so the gate
# and the hook can never diverge on what counts as an authored abrupt-failure
# construct. `panic-scan` declares its own `[workspace]`, so this path dependency
# is built as a standalone unit rather than a workspace member.
panic-scan = { path = "../../tools/panic-scan" }

[dev-dependencies]
# Build + run plumbing shared by the golden E2E tests (tests/support/mod.rs).
# `cargo build --message-format=json` parsing that locates the produced binary
# lives in the `e2e_support` crate, so serde_json is pulled in transitively.
e2e-support = { path = "../../tools/e2e-support" }

[lints]
workspace = true
