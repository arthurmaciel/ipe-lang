[package]
name = "ipe"
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
name = "ipe"
path = "src/lib.rs"

[[bin]]
name = "ipe"
path = "src/main.rs"

[dependencies]
ipe_intern = { path = "../compiler/intern" }
ipe_diagnostics = { path = "../compiler/diagnostics" }
ipe_parse = { path = "../compiler/parse" }
ipe_db = { path = "../compiler/db" }
ipe_canon = { path = "../compiler/canon" }
ipe_types = { path = "../compiler/types" }
ipe_lower = { path = "../compiler/lower" }
ipe_ir = { path = "../compiler/ir" }
ipe_backend = { path = "../compiler/backend" }
ipe_backend_rust = { path = "../compiler/backend/rust" }
ipe_ffi = { path = "../compiler/ffi" }
ipe_sandbox = { path = "../compiler/sandbox" }
ipe_lsp_server = { path = "../lsp/server" }
# Phase 7 (`crate::watch` — Tasks 21-25): the confined watcher + process
# supervisor primitives, and the two crates `watch.rs` drives directly —
# `salsa` for `Cancelled::catch`/`Setter` (Task 25's cancellation) and
# `notify` for the raw filesystem watch (Task 21). Same salsa pin as
# `ipe_db` (`crates/ipe_db/Cargo.toml`) — one version across the workspace.
ipe_watch = { path = "../compiler/watch" }
salsa = "=0.27.2"
notify = "8"
# Phase 6 (Task 19/20): the on-disk build cache (`src/cache.rs`) — content
# hashing of the whole-project key + the compiler/toolchain version-epoch,
# and JSON (de)serialization of the cached `EmittedProject`. Same version
# pins as `tools/oracle` (already resolved in the workspace lockfile).
sha2 = "0.10"
hex = "0.4"
serde_json = "1"

[dev-dependencies]
# Cached Go-oracle format + staleness gate + the shared build/run-emitted core
# used by the golden parity tests (tests/support/mod.rs). The `cargo build
# --message-format=json` parsing that locates the produced binary now lives in
# the `oracle` crate, so serde_json is pulled in transitively, not directly.
oracle = { path = "../../tools/oracle" }

[lints]
workspace = true
