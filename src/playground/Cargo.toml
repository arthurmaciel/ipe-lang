[package]
name = "ipe-playground"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "Playground backend: compile Ipê source to WASM in a sandboxed subprocess and serve the bundle."

[[bin]]
name = "ipe-playground"
path = "src/main.rs"

[dependencies]
# The hardened bubblewrap + prlimit jail the untrusted-source build runs inside
# — REUSED from the FFI RCE-sandbox path, not reinvented.
ipe_sandbox = { path = "../compiler/sandbox" }
axum = { version = "0.7", features = ["json"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.5", features = ["cors", "fs"] }
tempfile = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[lints]
workspace = true
