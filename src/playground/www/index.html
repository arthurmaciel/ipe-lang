<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ipê Playground</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 12px 20px;
      background: #1e293b;
      border-bottom: 1px solid #334155;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    header h1 {
      font-size: 1.1rem;
      font-weight: 600;
      color: #f8fafc;
    }
    header .badge {
      font-size: 0.7rem;
      background: #3b82f6;
      color: white;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 500;
    }
    #run-btn {
      margin-left: auto;
      padding: 8px 20px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #run-btn:hover { background: #1d4ed8; }
    #run-btn:disabled { background: #64748b; cursor: not-allowed; }
    main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr;
      min-height: 0;
    }
    #editor-pane {
      display: flex;
      flex-direction: column;
      border-right: 1px solid #334155;
      min-height: 0;
    }
    #editor-pane label, #preview-pane label {
      padding: 8px 12px;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #94a3b8;
      background: #1e293b;
      border-bottom: 1px solid #334155;
    }
    #source {
      flex: 1;
      background: #0f172a;
      color: #e2e8f0;
      border: none;
      padding: 16px;
      font-family: "JetBrains Mono", "Fira Code", monospace;
      font-size: 0.875rem;
      line-height: 1.6;
      resize: none;
      outline: none;
      tab-size: 4;
    }
    #preview-pane {
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    #preview-frame {
      flex: 1;
      border: none;
      background: white;
    }
    #status-bar {
      padding: 6px 12px;
      font-size: 0.75rem;
      background: #1e293b;
      border-top: 1px solid #334155;
      color: #94a3b8;
      min-height: 28px;
    }
    #status-bar.error { color: #f87171; }
    #status-bar.ok { color: #34d399; }
    #status-bar.compiling { color: #fbbf24; }
  </style>
</head>
<body>
  <header>
    <h1>Ipê Playground</h1>
    <span class="badge">WASM</span>
    <button id="run-btn" onclick="runCompile()">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
        <polygon points="3,2 13,8 3,14"/>
      </svg>
      Run
    </button>
  </header>
  <main>
    <div id="editor-pane">
      <label>Ipê Source</label>
      <textarea id="source" spellcheck="false">module Main exposing (main)

import Ipe.Prelude exposing (..)
import Ipe.String as String
import Ipe.Live exposing (app)
import Ipe.Tea.Web.Cmd as Cmd
import Ipe.Tea.Web.Sub as Sub
import Ipe.Html as Html

type Msg = Increment | Decrement | Reset

type alias Model = { count : Int }

init : a -> ( Model, Cmd Msg )
init _req = ( { count = 0 }, Cmd.none )

update : Msg -> Model -> ( Model, Cmd Msg )
update msg model =
    case msg of
        Increment -> ( { model | count = model.count + 1 }, Cmd.none )
        Decrement -> ( { model | count = model.count - 1 }, Cmd.none )
        Reset     -> ( { model | count = 0 }, Cmd.none )

subscriptions : Model -> Sub Msg
subscriptions _model = Sub.none

view : Model -> Html Msg
view model =
    Html.div [ Html.attribute "style" "font-family:sans-serif;padding:2rem" ]
        [ Html.h1 [] [ Html.text "Counter" ]
        , Html.p [] [ Html.text (String.fromInt model.count) ]
        , Html.button [ Html.onClick Increment ] [ Html.text "+" ]
        , Html.button [ Html.onClick Decrement ] [ Html.text "−" ]
        , Html.button [ Html.onClick Reset ] [ Html.text "Reset" ]
        ]

main =
    app
        { init = init
        , update = update
        , view = view
        , subscriptions = subscriptions
        , routes = []
        , notFound = {}
        }
</textarea>
    </div>
    <div id="preview-pane">
      <label>Preview</label>
      <iframe id="preview-frame" sandbox="allow-scripts"></iframe>
    </div>
  </main>
  <div id="status-bar">Press Run to compile and run your Ipê program.</div>

  <script>
    const COMPILE_URL = '/compile';

    async function runCompile() {
      const btn = document.getElementById('run-btn');
      const statusBar = document.getElementById('status-bar');
      const source = document.getElementById('source').value;

      btn.disabled = true;
      statusBar.className = 'compiling';
      statusBar.textContent = 'Compiling…';

      try {
        const resp = await fetch(COMPILE_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ source }),
        });
        const data = await resp.json();

        if (data.status === 'ok') {
          mountBundle(data);
          statusBar.className = 'ok';
          statusBar.textContent = 'Compiled successfully.';
        } else {
          statusBar.className = 'error';
          statusBar.textContent = data.diagnostics || 'Compile error (no diagnostics returned)';
          document.getElementById('preview-frame').srcdoc =
            `<pre style="font-family:monospace;color:#ef4444;padding:1rem;white-space:pre-wrap">${escapeHtml(data.diagnostics || '')}</pre>`;
        }
      } catch (e) {
        statusBar.className = 'error';
        statusBar.textContent = `Network error: ${e.message}`;
      } finally {
        btn.disabled = false;
      }
    }

    function mountBundle(bundle) {
      // Decode the base64 WASM bytes and inject the bundle into the iframe.
      // The iframe uses srcdoc with an inline script that:
      //   1. Decodes the base64 WASM
      //   2. Streams it to WebAssembly.instantiate via the wasm-bindgen glue
      //   3. Calls ipe_start() (the #[wasm_bindgen(start)] entry)
      const wasmB64 = bundle.pkg_wasm_b64;
      const glueJs = bundle.pkg_js;
      const bootJs = bundle.boot_js;

      // Inline the wasm as a data URL to avoid cross-origin fetch in the sandbox.
      const doc = `<!DOCTYPE html>
<html><head><meta charset="UTF-8" /></head>
<body>
<script>
(async () => {
  // Decode base64 WASM inline.
  function b64decode(b64) {
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  }
  const wasmBytes = b64decode(${JSON.stringify(wasmB64)});

  // The wasm-bindgen glue expects the WASM bytes via __wbg_init.
  // Inject the glue, then call __wbg_init with the bytes.
  const glueBlob = new Blob([${JSON.stringify(glueJs)}], {type: 'text/javascript'});
  const glueUrl = URL.createObjectURL(glueBlob);
  const mod = await import(glueUrl);
  await mod.default(wasmBytes);
  // __wbg_init calls ipe_start() automatically (start attribute).
})().catch(e => {
  document.body.innerHTML = '<pre style="color:red">' + e + '</pre>';
});
<\/script>
</body></html>`;
      document.getElementById('preview-frame').srcdoc = doc;
    }

    function escapeHtml(s) {
      return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    // Ctrl+Enter / Cmd+Enter runs the compile.
    document.getElementById('source').addEventListener('keydown', e => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        e.preventDefault();
        runCompile();
      }
    });
  </script>
</body>
</html>
