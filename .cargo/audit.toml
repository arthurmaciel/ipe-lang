# cargo-audit configuration. Read automatically by `cargo audit` when run from
# the repo root (the .github/workflows/security.yml `cargo-audit` job's path).
#
# Documented advisory acceptances — each MUST carry a justification + a
# re-check trigger. This is the RustSec-sanctioned way to handle an advisory
# that has no available upstream fix (the alternative — a perpetually-red
# audit gate — trains reviewers to ignore the job's output, which hides any
# NEW advisory in the noise). Re-audit and remove an entry the moment a fix
# ships upstream.

[advisories]
ignore = [
    # RUSTSEC-2023-0071 — rsa 0.9.x "Marvin Attack" (PKCS#1 v1.5 timing
    # sidechannel). No fixed upstream release exists (the advisory's own
    # Solution field says "no fixed upgrade available"). Pulled in via
    # `runtime`'s optional `crypto` feature (jsonwebtoken -> rsa) for
    # Sky.Core.Jwt RS256 sign/verify — see runtime/src/sky_runtime/jwt.rs +
    # runtime/src/sky_runtime/crypto.rs. Exposure is limited to SIGN (private
    # key) + VERIFY (public key); the Marvin attack targets the PKCS#1 v1.5
    # DECRYPTION oracle, which this codebase never exercises. Accepted +
    # tracked; revisit when `rsa` ships a fix or a vetted constant-time RS256
    # alternative replaces it. (security hardening pass, 2026-07-12)
    "RUSTSEC-2023-0071",
]
