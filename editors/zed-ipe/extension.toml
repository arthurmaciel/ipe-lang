id = "ipe"
name = "Ipê"
description = "Ipê language support for Zed: syntax highlighting (tree-sitter) and the ipe LSP."
version = "0.2.0"
schema_version = 1
authors = ["Arthur Maciel <arthurmaciel@gmail.com>"]
repository = "https://github.com/ipe-lang/compiler"

[grammars.ipe]
repository = "https://github.com/ipe-lang/compiler"
# A commit whose editors/tree-sitter-ipe matches this checkout's grammar and
# queries (Zed checks out exactly this revision; a branch name goes stale).
# editors/tests/configure-test.sh fails when the two drift apart.
rev = "e7ff85a969e481cc46563733dbb501f97a75bff7"
path = "editors/tree-sitter-ipe"

[language_servers.ipe-lsp]
name = "Ipê LSP"
languages = ["Ipê"]
language_ids = { "Ipê" = "ipe" }
