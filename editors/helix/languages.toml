# Ipê for Helix — the block editors/helix/configure.sh writes into
# ~/.config/helix/languages.toml (between its `>>> ipe` / `<<< ipe` markers).
# The grammar and queries are installed separately by the script.
[[language]]
name = "ipe"
scope = "source.ipe"
file-types = ["ipe"]
roots = ["package.ipe"]
language-servers = ["ipe-lsp"]
auto-format = true
comment-tokens = ["--"]
block-comment-tokens = { start = "{-", end = "-}" }
indent = { tab-width = 4, unit = "    " }

[language-server.ipe-lsp]
command = "ipe"
args = ["lsp"]
